baseurl = 'https://docs.yugabyte.com'
languageCode = 'en-us'
title = 'YugabyteDB Docs'
# Highlighting config (Pygments)
pygmentsCodefences = true
pygmentsStyle = 'pygments'
resourceDir = 'docs/resources'

[languages]
  [languages.en]
    languageCode = 'en-US'
    languageDirection = 'ltr'
    languageName = 'English'
    weight = 1

enableGitInfo = true

[frontmatter]
  date = [ "lastmod", ":default" ]
# lastmod = [ ":git", ":default" ]

[params]
  regenerateDiagrams = false

[markup.goldmark.parser.attribute]
  block = true

[security]
  [security.funcs]
    getenv = [
      'ONETRUST_API_KEY',
      'RUDDERSTACK_API_KEY'
    ]

# Fetchable Markdown at /path/page.md. Sections publish at /path/index.md,
# and layouts/_partials/markdown-section.md also publishes /path.md.
# ugly publishes a regular page as page.md instead of page/index.md.
[outputFormats.markdown]
  ugly = true

[outputs]
  home = ['html', 'rss', 'markdown']
  page = ['html', 'markdown']
  section = ['html', 'rss', 'markdown']
