[package]
name = "anon"
version = "3.1.3"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg14"]
#pg11 = ["pgrx/pg11", "pgrx-tests/pg11" ]
#pg12 = ["pgrx/pg12", "pgrx-tests/pg12" ]
#pg13 = ["pgrx/pg13", "pgrx-tests/pg13" ]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14" ]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg_test = []

[dependencies]
c_str_macro = "1.0.3"
chrono = "0.4.37"
fake = { version = "5.1.0", features = ["bigdecimal", "chrono", "http", "rust_decimal", "uuid", "time","random_color"] }
fastrand = "2.3.0"
image = "0.25.5"
md-5 = "0.10.6"
paste = "1.0"
# YB: Using local clone of pgrx.
pgrx = {path = "../pgrx/pgrx"}
rand = "0.8.5"
regex = "1.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

[dev-dependencies]
# YB: Using local clone of pgrx.
pgrx-tests = {path = "../pgrx/pgrx-tests"}

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
