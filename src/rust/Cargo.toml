# Rust code in YugabyteDB, built by CMake (cmake_modules/YugabyteRust.cmake); see docs/build.md.
# Components move to Rust one at a time: shared crates live in common/ and tools/ and carry no
# component name; each component's crates live in its own directory (master/).
[workspace]
resolver = "3"
members = [
    "common/yb-cpp-host",
    "common/yb-flags",
    "common/yb-host-api",
    "common/yb-proto",
    "common/yb-web",
    "master/catalog-entity",
    "master/master",
    "master/rpc-handlers",
    "master/tools/conformance",
    "tools/yb-cxxgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

# Direct dependencies are pinned exactly; Cargo.lock pins the rest and every build passes --locked.
# cxx and cxx-gen must stay on the same patch version: cxx-gen writes the C++ half of the bridges
# that the cxx runtime on the Rust side has to match.
[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
cxx = "=1.0.202"
cxx-gen = "=0.7.202"
hyper-util = { version = "=0.1.20", features = ["client-legacy", "http1", "server-auto", "service", "tokio"] }
openssl = "=0.10.81"
proc-macro2 = "1"
protobuf = "=3.7.2"
protobuf-codegen = "=3.7.2"
protobuf-parse = "=3.7.2"
tokio = { version = "=1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-openssl = "=0.6.5"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["std", "registry"] }

yb-cpp-host = { path = "common/yb-cpp-host" }
yb-flags = { path = "common/yb-flags" }
yb-host-api = { path = "common/yb-host-api" }
master-catalog-entity = { path = "master/catalog-entity" }
master-rpc-handlers = { path = "master/rpc-handlers" }
yb-proto = { path = "common/yb-proto" }
yb-web = { path = "common/yb-web" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# A Rust panic must never unwind into C++ frames. With abort, the panic hook (yb-cpp-host)
# logs through glog and the process dies with a stack trace, like a C++ CHECK failure.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = "line-tables-only"
