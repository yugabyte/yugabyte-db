// Calls only the Rust master (src/yb/rust/master) serves: the location stream between Rust masters
// (src/yb/rust/master/docs/tablet-locations.md) and a dump of the in-memory catalog for tests. A
// C++ master does not register the service and answers "not registered"; C++ only uses the proxy.

syntax = "proto2";

package yb.master;

option java_package = "org.yb.master";

import "yb/common/common_types.proto";
import "yb/consensus/metadata.proto";
import "yb/common/common.proto";
import "yb/common/common_net.proto";
import "yb/common/version_info.proto";
import "yb/master/catalog_entity_info.proto";
import "yb/master/master_client.proto";
import "yb/master/master_ddl.proto";
import "yb/master/master_heartbeat.proto";
import "yb/master/master_types.proto";

message ReplicaLocationPB {
  optional bytes ts_uuid = 1;
  optional PeerRole role = 2;
  optional consensus.PeerMemberType member_type = 3;
}

// The whole replica set of one tablet as the leader knows it; no replicas removes the tablet.
message TabletReplicasPB {
  optional bytes tablet_id = 1;
  repeated ReplicaLocationPB replicas = 2;
}

message TServerStatePB {
  optional TSInformationPB info = 1;
  optional bool live = 2;
}

// Deltas of the leader's observed state, sequence-numbered within the leader's term.
message PushLocationsRequestPB {
  optional bytes leader_uuid = 1;
  optional int64 term = 2;
  optional uint64 sequence = 3;
  // Replaces everything the follower holds instead of applying on top of it.
  optional bool full = 4;
  repeated TabletReplicasPB tablets = 5;
  repeated TServerStatePB tservers = 6;
}

message PushLocationsResponsePB {
  optional MasterErrorPB error = 1;
  // The follower missed a delta and needs a full push.
  optional bool needs_full = 2;
}

message DumpCatalogRequestPB {
}

message DumpCatalogResponsePB {
  optional MasterErrorPB error = 1;
  message Row {
    optional SysRowEntryType entry_type = 1;
    optional bytes id = 2;
    optional bytes data = 3;
  }
  // Every row of the in-memory catalog, as of `as_of`.
  repeated Row rows = 2;
  optional fixed64 as_of = 3;
  // Full loads so far; a PITR restore or remote bootstrap adds one.
  optional uint64 generation = 4;
  // Self-checks whose digest differed from a scan of the tablet.
  optional uint64 self_check_mismatches = 5;
  // Observed state: tablets with known replicas, and registered tservers by liveness.
  optional uint64 num_tablet_locations = 6;
  optional uint64 num_live_tservers = 7;
  optional uint64 num_tservers = 8;
  // Heartbeats answered with live_tservers_unchanged.
  optional uint64 live_tservers_unchanged_responses = 9;
  // Replicas over all tablets with known replicas.
  optional uint64 num_tablet_replicas = 10;
}

// The host's C++ steps of CatalogManager::CreateTable that a Rust leader asks for
// (MasterHost::HandleOnHost "PrepareTableSchema"): the schema checks, column ids, the default
// partition schema, the tablet count and the partitions. Not sent over the wire.
message PrepareTableSchemaRequestPB {
  optional CreateTableRequestPB request = 1;
  // Live tservers in the table's placement, for the default tablet count.
  optional uint64 num_live_tservers = 2;
  // The TOO_MANY_TABLETS limit the leader checks after; above it the partitions are not built,
  // since building them allocates per tablet. 0 for none.
  optional int64 max_num_tablets = 3;
  // When set, the response also has the new table's row (FillNewTableEntry), for a YSQL table.
  optional bytes namespace_id = 4;
  optional bytes namespace_name = 5;
  // A colocated table (CreateTable's `colocated`): one partition, and no hash columns.
  optional bool colocated = 6;
  // A tablegroup's parent table: the request's schema is replaced by the parent's
  // (CreateTablegroup's).
  optional bool tablegroup_parent = 7;
}

message PrepareTableSchemaResponsePB {
  // A schema error; nothing else is set.
  optional MasterErrorPB error = 1;
  optional SchemaPB schema = 2;
  optional PartitionSchemaPB partition_schema = 3;
  optional int32 next_column_id = 4;
  // Before partitioning, which the tablet limits check.
  optional int32 num_tablets = 5;
  repeated PartitionPB partitions = 6;
  // A partitioning error, which C++ reports after the tablet limits.
  optional MasterErrorPB partitions_error = 7;
  // The new table's row, PREPARING, when the request named the namespace.
  optional SysTablesEntryPB table = 8;
}

// CatalogManager::AlterTable's schema step for a Rust leader ("AlterTableSchema").
message AlterTableSchemaRequestPB {
  optional bytes table_id = 1;
  optional SysTablesEntryPB table = 2;
  optional AlterTableRequestPB request = 3;
}

message AlterTableSchemaResponsePB {
  optional MasterErrorPB error = 1;
  // Unset when the request has no schema change.
  optional SchemaPB schema = 2;
  optional int32 next_column_id = 3;
}

// The encoded (DocDB) keys of partition keys, as a split sends them to the tablet leader
// (MasterHost::HandleOnHost "EncodedPartitionKeys", PartitionSchema::GetEncodedPartitionKey).
message EncodedPartitionKeysRequestPB {
  optional PartitionSchemaPB partition_schema = 1;
  repeated bytes partition_keys = 2;
}

message EncodedPartitionKeysResponsePB {
  optional MasterErrorPB error = 1;
  repeated bytes encoded_keys = 2;
}

// A new YSQL universe's first leader restores the shipped initial sys catalog snapshot instead of
// running initdb (MasterHost::HandleOnHost "RestoreInitialSysCatalogSnapshot", as
// CatalogManager::MaybeRestoreInitialSysCatalogSnapshotAndReloadSysCatalog). The leader checks
// that initdb is not done; the host checks the flags and the instance metadata.
message RestoreInitialSysCatalogSnapshotRequestPB {
  optional int64 term = 1;
}

message RestoreInitialSysCatalogSnapshotResponsePB {
  optional MasterErrorPB error = 1;
  // False when this universe does not restore one: YSQL is off, there is no snapshot, or the
  // universe predates restoring it.
  optional bool restored = 2;
}

// The Rust leader tells its host the term in which it became ready, or -1 when it is not ready
// (MasterHost::HandleOnHost "SetLeaderReadyTerm"): the host serves YSQL's catalog reads and writes
// only in that term, as CatalogManager does in leader_ready_term_.
message SetLeaderReadyTermRequestPB {
  optional int64 term = 1;
}

message SetLeaderReadyTermResponsePB {
  optional MasterErrorPB error = 1;
}

// The Rust leader's AutoFlags config changes (MasterHost::HandleOnHost with the method's name:
// PromoteAutoFlags, RollbackAutoFlags, PromoteSingleAutoFlag or DemoteSingleAutoFlag), with what
// MasterAutoFlagsManager reads from the C++ Master on a C++ leader. The response is the method's.
message AutoFlagsChangeRequestPB {
  // The method's request, serialized.
  optional bytes request = 1;
  optional bool ysql_major_upgrade_in_progress = 2;
  message TserverVersion {
    optional string uuid = 1;
    optional VersionInfoPB version_info = 2;
  }
  // The live tservers, for TSManager::ValidateAllTserverVersions.
  repeated TserverVersion live_tservers = 3;
}

// The Rust leader's refresh of the host's heartbeat catalog versions cache
// (CatalogManager::RefreshPgCatalogVersionCache), ignored unless `term` is the ready term.
message RefreshPgCatalogVersionCacheRequestPB {
  optional int64 term = 1;
}

message RefreshPgCatalogVersionCacheResponsePB {
  optional MasterErrorPB error = 1;
  // False when the read failed; the leader retries sooner.
  optional bool refreshed = 2;
}

// The Rust leader's tablespace refresh (CatalogManager::DoRefreshTablespaceInfo): the host reads
// pg_tablespace and, for `databases`, pg_class and pg_yb_tablegroup.
message ReadYsqlTablespacesRequestPB {
  message Database {
    optional uint32 oid = 1;
    optional bool colocated = 2;
  }
  repeated Database databases = 1;
}

message ReadYsqlTablespacesResponsePB {
  optional MasterErrorPB error = 1;
  message Tablespace {
    optional bytes id = 1;
    // Absent: the tablespace has no placement.
    optional ReplicationInfoPB replication_info = 2;
  }
  repeated Tablespace tablespaces = 2;
  message Table {
    optional bytes table_id = 1;
    // Absent: the default tablespace.
    optional bytes tablespace_id = 2;
  }
  repeated Table tables = 3;
}

// The schema names of YSQL tables (YsqlManager::GetCachedPgSchemaName): pg_class.relnamespace's
// pg_namespace.nspname, for ListTables and GetTableSchema.
message GetPgSchemaNamesRequestPB {
  message Table {
    optional uint32 database_oid = 1;
    optional uint32 pg_table_oid = 2;
  }
  repeated Table tables = 1;
}

message GetPgSchemaNamesResponsePB {
  optional MasterErrorPB error = 1;
  // One per requested table; empty when not found (not committed, or dropped).
  repeated string names = 2;
}

// DDL verification of a transaction whose outcome PG did not report (TableSchemaVerificationTask's
// schema comparison): the host checks the PG catalog against `table`'s row.
message CheckYsqlDdlSchemaRequestPB {
  optional bytes table_id = 1;
  optional SysTablesEntryPB table = 2;
  // A table in the sys catalog tablet (TableInfo::is_system).
  optional bool is_system = 3;
}

message CheckYsqlDdlSchemaResponsePB {
  optional MasterErrorPB error = 1;
  // Absent: the PG catalog cannot tell (the DDL did not change the DocDB schema).
  optional bool committed = 2;
}

// NamespaceVerificationTask's check: whether pg_database has the database.
message YsqlDatabaseExistsRequestPB {
  optional bytes namespace_id = 1;
}

message YsqlDatabaseExistsResponsePB {
  optional MasterErrorPB error = 1;
  optional bool exists = 2;
}

// The cluster balancer's metrics, which C++ keeps in the "cluster" metric entity
// (MasterHost::HandleOnHost "SetClusterMetrics", ClusterLoadBalancer::ReportMetrics and
// UpdatePerRunMetrics). A field left unset keeps its value.
message SetClusterMetricsRequestPB {
  optional bool is_load_balancing_enabled = 1;
  optional uint32 tablets_in_wrong_placement = 2;
  optional uint32 blacklisted_leaders = 3;
  optional uint32 total_table_load_difference = 4;
  optional uint64 estimated_data_to_balance_bytes = 5;
}

message SetClusterMetricsResponsePB {
  optional MasterErrorPB error = 1;
}

// What a YCQL virtual table (SystemTableDefs) shows, from the Rust leader's catalog and tserver
// registry; the host formats the rows (MasterHost's virtual tables, as the C++ YQL*VTable classes
// format them). Only the fields the named table reads are set.
message YcqlVirtualTableInputPB {
  optional string namespace_name = 1;
  optional string table_name = 2;
  // Live tservers in uuid order (system.local, system.peers).
  repeated TSInformationPB tservers = 3;
  message Keyspace {
    optional string name = 1;
    optional uint32 replication_factor = 2;
  }
  repeated Keyspace keyspaces = 4;
  // YCQL tables and indexes visible to clients (GetTables(kVisibleToClient) with IsYcqlTable),
  // with the locations of their tablets for system.partitions and system.size_estimates.
  message Table {
    optional bytes id = 1;
    optional string namespace_name = 2;
    optional SysTablesEntryPB table = 3;
    repeated TabletLocationsPB tablets = 4;
  }
  repeated Table tables = 5;
  message Type {
    optional string namespace_name = 1;
    optional SysUDTypeEntryPB type = 2;
  }
  repeated Type types = 6;
  repeated SysRoleEntryPB roles = 7;
}

// A table row with its id.
message TableRowPB {
  optional bytes id = 1;
  optional SysTablesEntryPB table = 2;
}

// CREATE DATABASE's copy of its template's PG catalog tables (MasterHost::HandleOnHost
// "CopyPgsqlSysTables", CatalogManager::CopyPgsqlSysTables): the host adds the new database's
// tables to the sys catalog tablet and copies their rows; the Rust leader writes the rows it
// returns.
message CopyPgsqlSysTablesRequestPB {
  optional bytes namespace_id = 1;
  optional bytes namespace_name = 2;
  // The template database's PG catalog tables, in table id order.
  repeated TableRowPB source_tables = 3;
  optional int64 term = 4;
  optional TransactionMetadataPB transaction = 5;
}

message CopyPgsqlSysTablesResponsePB {
  optional MasterErrorPB error = 1;
  // The new tables' rows, RUNNING.
  repeated TableRowPB tables = 2;
}

// Removes PG catalog tables of a dropped database from the sys catalog tablet
// (SysCatalogTable::DeleteYsqlSystemTable). A table the tablet no longer has is skipped, so a new
// leader can repeat it.
message DeleteYsqlSystemTablesRequestPB {
  repeated bytes table_ids = 1;
  optional int64 term = 2;
}

message DeleteYsqlSystemTablesResponsePB {
  optional MasterErrorPB error = 1;
}

// The host's hybrid clock (MasterHost::HandleOnHost "HybridTimeNow").
message HybridTimeNowRequestPB {
}

message HybridTimeNowResponsePB {
  optional MasterErrorPB error = 1;
  optional fixed64 hybrid_time = 2;
}

service MasterRustPeer {
  rpc PushLocations(PushLocationsRequestPB) returns (PushLocationsResponsePB);
  rpc DumpCatalog(DumpCatalogRequestPB) returns (DumpCatalogResponsePB);
}
