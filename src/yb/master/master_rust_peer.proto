// Calls only the Rust master (src/yb/rust/master) serves: the location stream between Rust masters
// (src/yb/rust/master/docs/tablet-locations.md) and a dump of the in-memory catalog for tests. A
// C++ master does not register the service and answers "not registered"; C++ only uses the proxy.

syntax = "proto2";

package yb.master;

option java_package = "org.yb.master";

import "yb/common/common_types.proto";
import "yb/consensus/metadata.proto";
import "yb/common/common.proto";
import "yb/master/catalog_entity_info.proto";
import "yb/master/master_ddl.proto";
import "yb/master/master_heartbeat.proto";
import "yb/master/master_types.proto";

message ReplicaLocationPB {
  optional bytes ts_uuid = 1;
  optional PeerRole role = 2;
  optional consensus.PeerMemberType member_type = 3;
}

// The whole replica set of one tablet as the leader knows it; no replicas removes the tablet.
message TabletReplicasPB {
  optional bytes tablet_id = 1;
  repeated ReplicaLocationPB replicas = 2;
}

message TServerStatePB {
  optional TSInformationPB info = 1;
  optional bool live = 2;
}

// Deltas of the leader's observed state, sequence-numbered within the leader's term.
message PushLocationsRequestPB {
  optional bytes leader_uuid = 1;
  optional int64 term = 2;
  optional uint64 sequence = 3;
  // Replaces everything the follower holds instead of applying on top of it.
  optional bool full = 4;
  repeated TabletReplicasPB tablets = 5;
  repeated TServerStatePB tservers = 6;
}

message PushLocationsResponsePB {
  optional MasterErrorPB error = 1;
  // The follower missed a delta and needs a full push.
  optional bool needs_full = 2;
}

message DumpCatalogRequestPB {
}

message DumpCatalogResponsePB {
  optional MasterErrorPB error = 1;
  message Row {
    optional SysRowEntryType entry_type = 1;
    optional bytes id = 2;
    optional bytes data = 3;
  }
  // Every row of the in-memory catalog, as of `as_of`.
  repeated Row rows = 2;
  optional fixed64 as_of = 3;
  // Full loads so far; a PITR restore or remote bootstrap adds one.
  optional uint64 generation = 4;
  // Self-checks whose digest differed from a scan of the tablet.
  optional uint64 self_check_mismatches = 5;
  // Observed state: tablets with known replicas, and registered tservers by liveness.
  optional uint64 num_tablet_locations = 6;
  optional uint64 num_live_tservers = 7;
  optional uint64 num_tservers = 8;
  // Heartbeats answered with live_tservers_unchanged.
  optional uint64 live_tservers_unchanged_responses = 9;
  // Replicas over all tablets with known replicas.
  optional uint64 num_tablet_replicas = 10;
}

// The host's C++ steps of CatalogManager::CreateTable that a Rust leader asks for
// (MasterHost::HandleOnHost "PrepareTableSchema"): the schema checks, column ids, the default
// partition schema, the tablet count and the partitions. Not sent over the wire.
message PrepareTableSchemaRequestPB {
  optional CreateTableRequestPB request = 1;
  // Live tservers in the table's placement, for the default tablet count.
  optional uint64 num_live_tservers = 2;
}

message PrepareTableSchemaResponsePB {
  // A schema error; nothing else is set.
  optional MasterErrorPB error = 1;
  optional SchemaPB schema = 2;
  optional PartitionSchemaPB partition_schema = 3;
  optional int32 next_column_id = 4;
  // Before partitioning, which the tablet limits check.
  optional int32 num_tablets = 5;
  repeated PartitionPB partitions = 6;
  // A partitioning error, which C++ reports after the tablet limits.
  optional MasterErrorPB partitions_error = 7;
}

// CatalogManager::AlterTable's schema step for a Rust leader ("AlterTableSchema").
message AlterTableSchemaRequestPB {
  optional bytes table_id = 1;
  optional SysTablesEntryPB table = 2;
  optional AlterTableRequestPB request = 3;
}

message AlterTableSchemaResponsePB {
  optional MasterErrorPB error = 1;
  // Unset when the request has no schema change.
  optional SchemaPB schema = 2;
  optional int32 next_column_id = 3;
}

// The snapshot schedules that cover a namespace or table, from the host's snapshot coordinator
// ("SnapshotSchedules").
message SnapshotSchedulesRequestPB {
  optional SysRowEntryType entry_type = 1;
  optional bytes id = 2;
}

message SnapshotSchedulesResponsePB {
  optional MasterErrorPB error = 1;
  repeated bytes schedule_ids = 2;
}

service MasterRustPeer {
  rpc PushLocations(PushLocationsRequestPB) returns (PushLocationsResponsePB);
  rpc DumpCatalog(DumpCatalogRequestPB) returns (DumpCatalogResponsePB);
}
