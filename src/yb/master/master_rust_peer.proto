// Calls only the Rust master (src/yb/rust/master) serves: the location stream between Rust masters
// (src/yb/rust/master/docs/tablet-locations.md) and a dump of the in-memory catalog for tests. A
// C++ master does not register the service and answers "not registered"; C++ only uses the proxy.

syntax = "proto2";

package yb.master;

option java_package = "org.yb.master";

import "yb/cdc/cdc_consumer.proto";
import "yb/common/common_types.proto";
import "yb/consensus/metadata.proto";
import "yb/dockv/dockv.proto";
import "yb/common/common.proto";
import "yb/common/common_net.proto";
import "yb/common/opid.proto";
import "yb/common/version_info.proto";
import "yb/common/wire_protocol.proto";
import "yb/master/catalog_entity_info.proto";
import "yb/master/master_client.proto";
import "yb/master/master_ddl.proto";
import "yb/master/master_encryption.proto";
import "yb/master/master_heartbeat.proto";
import "yb/master/master_replication.proto";
import "yb/master/master_types.proto";

message ReplicaLocationPB {
  optional bytes ts_uuid = 1;
  optional PeerRole role = 2;
  optional consensus.PeerMemberType member_type = 3;
}

// The whole replica set of one tablet as the leader knows it; no replicas removes the tablet.
message TabletReplicasPB {
  optional bytes tablet_id = 1;
  repeated ReplicaLocationPB replicas = 2;
}

message TServerStatePB {
  optional TSInformationPB info = 1;
  optional bool live = 2;
}

// Deltas of the leader's observed state, sequence-numbered within the leader's term.
message PushLocationsRequestPB {
  optional bytes leader_uuid = 1;
  optional int64 term = 2;
  optional uint64 sequence = 3;
  // Replaces everything the follower holds instead of applying on top of it.
  optional bool full = 4;
  repeated TabletReplicasPB tablets = 5;
  repeated TServerStatePB tservers = 6;
}

message PushLocationsResponsePB {
  optional MasterErrorPB error = 1;
  // The follower missed a delta and needs a full push.
  optional bool needs_full = 2;
}

message DumpCatalogRequestPB {
}

message DumpCatalogResponsePB {
  optional MasterErrorPB error = 1;
  message Row {
    optional SysRowEntryType entry_type = 1;
    optional bytes id = 2;
    optional bytes data = 3;
  }
  // Every row of the in-memory catalog, as of `as_of`.
  repeated Row rows = 2;
  optional fixed64 as_of = 3;
  // Full loads so far; a PITR restore or remote bootstrap adds one.
  optional uint64 generation = 4;
  // Self-checks whose digest differed from a scan of the tablet.
  optional uint64 self_check_mismatches = 5;
  // Observed state: tablets with known replicas, and registered tservers by liveness.
  optional uint64 num_tablet_locations = 6;
  optional uint64 num_live_tservers = 7;
  optional uint64 num_tservers = 8;
  // Heartbeats answered with live_tservers_unchanged.
  optional uint64 live_tservers_unchanged_responses = 9;
  // Replicas over all tablets with known replicas.
  optional uint64 num_tablet_replicas = 10;
}

// The host's C++ steps of CatalogManager::CreateTable that a Rust leader asks for
// (MasterHost::HandleOnHost "PrepareTableSchema"): the schema checks, column ids, the default
// partition schema, the tablet count and the partitions. Not sent over the wire.
message PrepareTableSchemaRequestPB {
  optional CreateTableRequestPB request = 1;
  // Live tservers in the table's placement, for the default tablet count.
  optional uint64 num_live_tservers = 2;
  // The TOO_MANY_TABLETS limit the leader checks after; above it the partitions are not built,
  // since building them allocates per tablet. 0 for none.
  optional int64 max_num_tablets = 3;
  // When set, the response also has the new table's row (FillNewTableEntry), for a YSQL table.
  optional bytes namespace_id = 4;
  optional bytes namespace_name = 5;
  // A colocated table (CreateTable's `colocated`): one partition, and no hash columns.
  optional bool colocated = 6;
  // A tablegroup's parent table: the request's schema is replaced by the parent's
  // (CreateTablegroup's).
  optional bool tablegroup_parent = 7;
}

message PrepareTableSchemaResponsePB {
  // A schema error; nothing else is set.
  optional MasterErrorPB error = 1;
  optional SchemaPB schema = 2;
  optional PartitionSchemaPB partition_schema = 3;
  optional int32 next_column_id = 4;
  // Before partitioning, which the tablet limits check.
  optional int32 num_tablets = 5;
  repeated PartitionPB partitions = 6;
  // A partitioning error, which C++ reports after the tablet limits.
  optional MasterErrorPB partitions_error = 7;
  // The new table's row, PREPARING, when the request named the namespace.
  optional SysTablesEntryPB table = 8;
}

// CatalogManager::AlterTable's schema step for a Rust leader ("AlterTableSchema").
message AlterTableSchemaRequestPB {
  optional bytes table_id = 1;
  optional SysTablesEntryPB table = 2;
  optional AlterTableRequestPB request = 3;
}

message AlterTableSchemaResponsePB {
  optional MasterErrorPB error = 1;
  // Unset when the request has no schema change.
  optional SchemaPB schema = 2;
  optional int32 next_column_id = 3;
  // The DDL log entries the alter writes (one per step), and their row ids.
  repeated bytes ddl_log_entry_ids = 4;
  repeated DdlLogEntryPB ddl_log_entries = 5;
}

// A DDL log entry for a table at the current hybrid time, with its row id
// (MasterHost::HandleOnHost "NewDdlLogEntry", DdlLogEntry).
message NewDdlLogEntryRequestPB {
  optional bytes table_id = 1;
  optional SysTablesEntryPB table = 2;
  optional string action = 3;
}

message NewDdlLogEntryResponsePB {
  optional bytes id = 1;
  optional DdlLogEntryPB entry = 2;
  optional MasterErrorPB error = 3;
}

// The encoded (DocDB) keys of partition keys, as a split sends them to the tablet leader
// (MasterHost::HandleOnHost "EncodedPartitionKeys", PartitionSchema::GetEncodedPartitionKey).
message EncodedPartitionKeysRequestPB {
  optional PartitionSchemaPB partition_schema = 1;
  repeated bytes partition_keys = 2;
}

message EncodedPartitionKeysResponsePB {
  optional MasterErrorPB error = 1;
  repeated bytes encoded_keys = 2;
}

// A new YSQL universe's first leader restores the shipped initial sys catalog snapshot instead of
// running initdb (MasterHost::HandleOnHost "RestoreInitialSysCatalogSnapshot", as
// CatalogManager::MaybeRestoreInitialSysCatalogSnapshotAndReloadSysCatalog). The leader checks
// that initdb is not done; the host checks the flags and the instance metadata.
message RestoreInitialSysCatalogSnapshotRequestPB {
  optional int64 term = 1;
}

message RestoreInitialSysCatalogSnapshotResponsePB {
  optional MasterErrorPB error = 1;
  // False when this universe does not restore one: YSQL is off, there is no snapshot, or the
  // universe predates restoring it.
  optional bool restored = 2;
}

// The Rust leader tells its host the term in which it became ready, or -1 when it is not ready
// (MasterHost::HandleOnHost "SetLeaderReadyTerm"): the host serves YSQL's catalog reads and writes
// only in that term, as CatalogManager does in leader_ready_term_.
message SetLeaderReadyTermRequestPB {
  optional int64 term = 1;
}

message SetLeaderReadyTermResponsePB {
  optional MasterErrorPB error = 1;
}

// The Rust leader's AutoFlags config changes (MasterHost::HandleOnHost with the method's name:
// PromoteAutoFlags, RollbackAutoFlags, PromoteSingleAutoFlag or DemoteSingleAutoFlag), with what
// MasterAutoFlagsManager reads from the C++ Master on a C++ leader. The response is the method's.
message AutoFlagsChangeRequestPB {
  // The method's request, serialized.
  optional bytes request = 1;
  optional bool ysql_major_upgrade_in_progress = 2;
  message TserverVersion {
    optional string uuid = 1;
    optional VersionInfoPB version_info = 2;
  }
  // The live tservers, for TSManager::ValidateAllTserverVersions.
  repeated TserverVersion live_tservers = 3;
}

// The Rust leader's refresh of the host's heartbeat catalog versions cache
// (CatalogManager::RefreshPgCatalogVersionCache), ignored unless `term` is the ready term.
message RefreshPgCatalogVersionCacheRequestPB {
  optional int64 term = 1;
}

message RefreshPgCatalogVersionCacheResponsePB {
  optional MasterErrorPB error = 1;
  // False when the read failed; the leader retries sooner.
  optional bool refreshed = 2;
}

// The Rust leader's tablespace refresh (CatalogManager::DoRefreshTablespaceInfo): the host reads
// pg_tablespace and, for `databases`, pg_class and pg_yb_tablegroup.
message ReadYsqlTablespacesRequestPB {
  message Database {
    optional uint32 oid = 1;
    optional bool colocated = 2;
  }
  repeated Database databases = 1;
}

message ReadYsqlTablespacesResponsePB {
  optional MasterErrorPB error = 1;
  message Tablespace {
    optional bytes id = 1;
    // Absent: the tablespace has no placement.
    optional ReplicationInfoPB replication_info = 2;
  }
  repeated Tablespace tablespaces = 2;
  message Table {
    optional bytes table_id = 1;
    // Absent: the default tablespace.
    optional bytes tablespace_id = 2;
  }
  repeated Table tables = 3;
}

// The schema names of YSQL tables (YsqlManager::GetCachedPgSchemaName): pg_class.relnamespace's
// pg_namespace.nspname, for ListTables and GetTableSchema.
message GetPgSchemaNamesRequestPB {
  message Table {
    optional uint32 database_oid = 1;
    optional uint32 pg_table_oid = 2;
  }
  repeated Table tables = 1;
}

message GetPgSchemaNamesResponsePB {
  optional MasterErrorPB error = 1;
  // One per requested table; empty when not found (not committed, or dropped).
  repeated string names = 2;
}

// DDL verification of a transaction whose outcome PG did not report (TableSchemaVerificationTask's
// schema comparison): the host checks the PG catalog against `table`'s row.
message CheckYsqlDdlSchemaRequestPB {
  optional bytes table_id = 1;
  optional SysTablesEntryPB table = 2;
  // A table in the sys catalog tablet (TableInfo::is_system).
  optional bool is_system = 3;
}

message CheckYsqlDdlSchemaResponsePB {
  optional MasterErrorPB error = 1;
  // Absent: the PG catalog cannot tell (the DDL did not change the DocDB schema).
  optional bool committed = 2;
}

// NamespaceVerificationTask's check: whether pg_database has the database.
message YsqlDatabaseExistsRequestPB {
  optional bytes namespace_id = 1;
}

message YsqlDatabaseExistsResponsePB {
  optional MasterErrorPB error = 1;
  optional bool exists = 2;
}

// TableSchemaVerificationTask's check without DDL atomicity: whether PG still has the table.
message YsqlTableExistsRequestPB {
  optional bytes table_id = 1;
  optional SysTablesEntryPB table = 2;
}

message YsqlTableExistsResponsePB {
  optional MasterErrorPB error = 1;
  optional bool exists = 2;
}

// The cluster balancer's metrics, which C++ keeps in the "cluster" metric entity
// (MasterHost::HandleOnHost "SetClusterMetrics", ClusterLoadBalancer::ReportMetrics and
// UpdatePerRunMetrics). A field left unset keeps its value.
message SetClusterMetricsRequestPB {
  optional bool is_load_balancing_enabled = 1;
  optional uint32 tablets_in_wrong_placement = 2;
  optional uint32 blacklisted_leaders = 3;
  optional uint32 total_table_load_difference = 4;
  optional uint64 estimated_data_to_balance_bytes = 5;
  // CatalogManager::ReportMetrics; the host adds max_follower_heartbeat_delay from its sys
  // catalog consensus.
  optional uint32 num_tablet_servers_live = 6;
  optional uint32 num_tablet_servers_dead = 7;
}

message SetClusterMetricsResponsePB {
  optional MasterErrorPB error = 1;
}

// What a YCQL virtual table (SystemTableDefs) shows, from the Rust leader's catalog and tserver
// registry; the host formats the rows (MasterHost's virtual tables, as the C++ YQL*VTable classes
// format them). Only the fields the named table reads are set.
message YcqlVirtualTableInputPB {
  optional string namespace_name = 1;
  optional string table_name = 2;
  // Live tservers in uuid order (system.local, system.peers).
  repeated TSInformationPB tservers = 3;
  message Keyspace {
    optional string name = 1;
    optional uint32 replication_factor = 2;
  }
  repeated Keyspace keyspaces = 4;
  // YCQL tables and indexes visible to clients (GetTables(kVisibleToClient) with IsYcqlTable),
  // with the locations of their tablets for system.partitions and system.size_estimates.
  message Table {
    optional bytes id = 1;
    optional string namespace_name = 2;
    optional SysTablesEntryPB table = 3;
    repeated TabletLocationsPB tablets = 4;
  }
  repeated Table tables = 5;
  message Type {
    optional string namespace_name = 1;
    optional SysUDTypeEntryPB type = 2;
  }
  repeated Type types = 6;
  repeated SysRoleEntryPB roles = 7;
}

// A table row with its id.
message TableRowPB {
  optional bytes id = 1;
  optional SysTablesEntryPB table = 2;
}

// CREATE DATABASE's copy of its template's PG catalog tables (MasterHost::HandleOnHost
// "CopyPgsqlSysTables", CatalogManager::CopyPgsqlSysTables): the host adds the new database's
// tables to the sys catalog tablet and copies their rows; the Rust leader writes the rows it
// returns.
message CopyPgsqlSysTablesRequestPB {
  optional bytes namespace_id = 1;
  optional bytes namespace_name = 2;
  // The template database's PG catalog tables, in table id order.
  repeated TableRowPB source_tables = 3;
  optional int64 term = 4;
  optional TransactionMetadataPB transaction = 5;
}

message CopyPgsqlSysTablesResponsePB {
  optional MasterErrorPB error = 1;
  // The new tables' rows, RUNNING.
  repeated TableRowPB tables = 2;
}

// Removes PG catalog tables of a dropped database from the sys catalog tablet
// (SysCatalogTable::DeleteYsqlSystemTable). A table the tablet no longer has is skipped, so a new
// leader can repeat it.
message DeleteYsqlSystemTablesRequestPB {
  repeated bytes table_ids = 1;
  optional int64 term = 2;
}

message DeleteYsqlSystemTablesResponsePB {
  optional MasterErrorPB error = 1;
}

// A PG catalog table initdb creates (CatalogManager::CreateYsqlSysTable): the host adds it to the
// sys catalog tablet and returns its row, RUNNING; the leader writes the row.
message CreateYsqlSysTableRequestPB {
  optional CreateTableRequestPB request = 1;
  optional bytes namespace_name = 2;
  optional int64 term = 3;
}

message CreateYsqlSysTableResponsePB {
  optional MasterErrorPB error = 1;
  optional TableRowPB table = 2;
}

// What the host's YSQL catalog reads and writes need to know of a YSQL major upgrade
// (YsqlManager::IsMajorUpgradeInProgress and the persisted state). The leader sends it at the start
// of each term and after each state change.
message SetYsqlMajorUpgradeStateRequestPB {
  optional bool in_progress = 1;
  optional YsqlMajorCatalogUpgradeInfoPB.State state = 2;
}

message SetYsqlMajorUpgradeStateResponsePB {
  optional MasterErrorPB error = 1;
}

// PgWrapper::InitDbForYSQL on the leader. For a major upgrade, initdb keeps these databases'
// OIDs.
message RunYsqlInitDbRequestPB {
  message DatabaseOidPB {
    optional string name = 1;
    optional uint32 oid = 2;
  }
  repeated DatabaseOidPB database_oids = 1;
  optional bool is_major_upgrade = 2;
}

message RunYsqlInitDbResponsePB {
  optional MasterErrorPB error = 1;
}

// YsqlInitDBAndMajorUpgradeHandler::PerformPgUpgrade against the postgres of the closest of
// these live tservers (CatalogManager::GetClosestLiveTserver, which the host runs since it knows
// this master's registration).
message RunYsqlPgUpgradeRequestPB {
  repeated TSInformationPB live_tservers = 1;
}

message RunYsqlPgUpgradeResponsePB {
  optional MasterErrorPB error = 1;
}

// MasterAdmin.ClientUpgradeYsql: UpgradeYsql on the live tserver closest to this master, as
// pg_upgrade picks it.
message ForwardUpgradeYsqlRequestPB {
  repeated TSInformationPB live_tservers = 1;
  optional bool use_single_connection = 2;
  // The client's remaining deadline.
  optional uint64 timeout_ms = 3;
}

message ForwardUpgradeYsqlResponsePB {
  optional MasterErrorPB error = 1;
}

// TSManager::ValidateAllTserverVersions against this build's version.
message ValidateTserverVersionsRequestPB {
  enum Op {
    VERSION_EQ = 1;
    YSQL_MAJOR_VERSION_LT = 2;
  }
  optional Op op = 1;
  repeated AutoFlagsChangeRequestPB.TserverVersion live_tservers = 2;
}

message ValidateTserverVersionsResponsePB {
  optional MasterErrorPB error = 1;
}

// Steps of the major upgrade that work on the sys catalog tablet's YSQL rows.
message YsqlMajorUpgradeCatalogStepRequestPB {
  enum Step {
    // Abort every active sys catalog transaction (RunMajorVersionUpgradeImpl).
    ABORT_TRANSACTIONS = 1;
    // UpdateCatalogVersions: pg_yb_catalog_version from the prior version's table, and no
    // invalidation messages.
    UPDATE_CATALOG_VERSIONS = 2;
    // DeleteAllYsqlCatalogTableRows of table_ids (a rollback, before the tables are dropped).
    DELETE_ROWS = 3;
  }
  optional Step step = 1;
  optional int64 term = 2;
  repeated bytes table_ids = 3;
}

message YsqlMajorUpgradeCatalogStepResponsePB {
  optional MasterErrorPB error = 1;
}

// The host's hybrid clock (MasterHost::HandleOnHost "HybridTimeNow").
message HybridTimeNowRequestPB {
  // Clock::MaxGlobalNow rather than Now: the time the snapshot coordinator takes snapshots at.
  optional bool max_global = 1;
}

// ListSnapshots(prepare_for_backup): each YSQL table's PG schema name as of the snapshot, and for
// an index whether it was valid then (CatalogManager::RepackSnapshotsForBackup).
message GetBackupPgTableInfoRequestPB {
  message Table {
    optional bytes table_id = 1;
    optional SysTablesEntryPB table = 2;
  }
  repeated Table tables = 1;
  optional fixed64 read_time = 2;
}

// ChangeEncryptionInfo: the host's EncryptionManager rotates the universe key of `current`, the
// cluster config's encryption info, and returns the new info for the leader to write.
message ChangeEncryptionInfoOnHostRequestPB {
  optional ChangeEncryptionInfoRequestPB request = 1;
  optional EncryptionInfoPB current = 2;
}

message ChangeEncryptionInfoOnHostResponsePB {
  optional MasterErrorPB error = 1;
  optional EncryptionInfoPB updated = 2;
}

// ImportSnapshotMeta's schema check of a table found or made for a backup's table: Schema::Equals
// with names compared for tables, column ids for indexes (CatalogManager::ImportTableEntry).
message CompareImportSchemasRequestPB {
  optional SchemaPB persisted = 1;
  optional SchemaPB expected = 2;
  optional bool is_index = 3;
}

message CompareImportSchemasResponsePB {
  optional MasterErrorPB error = 1;
  optional bool matches = 2;
  optional bool column_ids_equal = 3;
  optional string persisted_string = 4;
  optional string expected_string = 5;
}

// SysCatalogTable::ReadPgYbTablegroupOid: 0 when the database has no such tablegroup.
message PgYbTablegroupOidRequestPB {
  optional uint32 database_oid = 1;
  optional string name = 2;
}

message PgYbTablegroupOidResponsePB {
  optional MasterErrorPB error = 1;
  optional uint32 oid = 2;
}

// AdvanceOidCounters after a PITR: the highest OID in each OID space of a YSQL database, from its
// PG catalog (ReadHighestPreservableOids) and the DocDB tables' OIDs, which include hidden tables.
message HighestPreservableOidsRequestPB {
  optional uint32 database_oid = 1;
  repeated uint32 table_oids = 2;
}

message HighestPreservableOidsResponsePB {
  optional MasterErrorPB error = 1;
  optional uint32 normal_space = 2;
  optional uint32 secondary_space = 3;
}

message GetBackupPgTableInfoResponsePB {
  message Table {
    optional bytes pg_schema_name = 1;
    // PG had not committed the table at read_time (DOCDB_TABLE_NOT_COMMITTED).
    optional bool not_committed = 2;
    // For an index: pg_index.indisvalid at read_time.
    optional bool index_valid = 3;
    // Any other failure.
    optional AppStatusPB status = 4;
  }
  optional MasterErrorPB error = 1;
  // One per requested table, in order.
  repeated Table tables = 2;
}

message HybridTimeNowResponsePB {
  optional MasterErrorPB error = 1;
  optional fixed64 hybrid_time = 2;
}

// A cdc_state row (cdc::CDCStateTableEntry): unset fields are not written; on a read, those not
// asked for are unset.
message CdcStateEntryPB {
  optional bytes tablet_id = 1;
  optional bytes stream_id = 2;
  optional bytes colocated_table_id = 3;
  optional OpIdPB checkpoint = 4;
  optional uint64 last_replication_time = 5;
  optional uint64 active_time = 6;
  optional uint64 cdc_sdk_safe_time = 7;
  optional bytes snapshot_key = 8;
  optional uint64 confirmed_flush_lsn = 9;
  optional uint64 restart_lsn = 10;
  optional uint32 xmin = 11;
  optional uint64 record_id_commit_time = 12;
  optional uint64 last_pub_refresh_time = 13;
  optional bytes pub_refresh_times = 14;
  optional bytes last_decided_pub_refresh_time = 15;
}

// CDCStateTable::UpsertEntries.
message CdcStateUpsertRequestPB {
  repeated CdcStateEntryPB entries = 1;
}

message CdcStateUpsertResponsePB {
  optional MasterErrorPB error = 1;
}

// The cdc_state rows of a stream with their checkpoints.
message CdcStateReadRequestPB {
  // Without it, every row.
  optional bytes stream_id = 1;
}

message CdcStateReadResponsePB {
  optional MasterErrorPB error = 1;
  repeated CdcStateEntryPB entries = 2;
}

// CDCStateTable::GenerateCreateCdcStateTableRequest: the request that creates system.cdc_state.
message CdcStateCreateTableRequestRequestPB {
}

message CdcStateCreateTableRequestResponsePB {
  optional MasterErrorPB error = 1;
  optional CreateTableRequestPB request = 2;
}

// SetAllInitialCDCSDKRetentionBarriersOnCatalogTable: a CHANGE_METADATA_OP on the sys catalog
// tablet sets a CDCSDK stream's retention barriers for a PG catalog table; once it applies, the
// tablet's cdc_state row gets the safe op id it was submitted at. Returns once submitted.
message SetCatalogRetentionBarrierRequestPB {
  optional bytes table_id = 1;
  optional bytes stream_id = 2;
  optional uint32 schema_version = 3;
  optional SchemaPB schema = 4;
  optional uint32 wal_retention_secs = 5;
}

message SetCatalogRetentionBarrierResponsePB {
  optional MasterErrorPB error = 1;
}

// CDCStateTable::DeleteEntries of the given keys (tablet, stream, colocated table).
message CdcStateDeleteRequestPB {
  repeated CdcStateEntryPB keys = 1;
}

message CdcStateDeleteResponsePB {
  optional MasterErrorPB error = 1;
}

// The cdc_state rows of the given streams are deleted (CleanUpDeletedXReplStreams).
message CdcStateDeleteStreamsRequestPB {
  repeated bytes stream_ids = 1;
}

message CdcStateDeleteStreamsResponsePB {
  optional MasterErrorPB error = 1;
  optional uint32 deleted = 2;
}

// CatalogManager::GetTableSchemaFromSysCatalog: the table's schema in the sys catalog as of
// read_time, and with the oids, its PG schema name then (YsqlManager::GetPgSchemaName). The
// response is GetTableSchemaFromSysCatalogResponsePB.
message ReadTableSchemaRequestPB {
  optional bytes table_id = 1;
  optional fixed64 read_time = 2;
  optional uint32 database_oid = 3;
  optional uint32 relfilenode_oid = 4;
  optional uint32 pg_table_oid = 5;
}

// MasterTabletServer::EnableCDCService: the master's CDC service serves GetChanges on the sys
// catalog tablet once a CDCSDK stream exists.
message EnableCdcServiceRequestPB {}

message EnableCdcServiceResponsePB {
  optional MasterErrorPB error = 1;
}

// TEST_SYNC_POINT_CALLBACK on the host, so tests that drive the leader through the C++ SyncPoint
// registry drive a Rust leader the same way. The callback gets a std::string* to string_arg when
// set, else a bool* whose value is returned as fail.
message TestSyncPointCallbackRequestPB {
  optional string name = 1;
  optional bytes string_arg = 2;
}

message TestSyncPointCallbackResponsePB {
  optional MasterErrorPB error = 1;
  optional bool fail = 2;
}

// tserver::CreateSequencesDataTable through the host's client: system_postgres.sequences_data,
// which xCluster's automatic mode replicates.
message CreateSequencesDataTableRequestPB {
}

message CreateSequencesDataTableResponsePB {
  optional MasterErrorPB error = 1;
}

// A call to the leader master of another universe, through the replication group's
// XClusterRemoteClientHolder (its certificates, from certs_for_cdc_dir). The error is a transport
// failure; the method's own error is in the response.
message XClusterRemoteCallRequestPB {
  optional string replication_group_id = 1;
  repeated HostPortPB master_addresses = 2;
  optional string service = 3;
  optional string method = 4;
  optional bytes request = 5;
  optional int64 timeout_ms = 6;
  // Ask the masters which one leads, rather than use the one last found.
  optional bool refresh_leader = 7;
}

message XClusterRemoteCallResponsePB {
  optional MasterErrorPB error = 1;
  optional bytes response = 2;
}

// ScanSequencesDataTable and EnsureSequenceUpdatesAreInWal through the host's client.
message EnsureSequenceUpdatesAreInWalRequestPB {
  repeated uint32 database_oids = 1;
}

message EnsureSequenceUpdatesAreInWalResponsePB {
  optional MasterErrorPB error = 1;
}

// CatalogManager::GetClosestLiveTserver among the given live tservers.
message ClosestLiveTserverRequestPB {
  repeated TSInformationPB live_tservers = 1;
}

message ClosestLiveTserverResponsePB {
  optional MasterErrorPB error = 1;
  optional bytes permanent_uuid = 2;
}

// SysCatalogTable::CountPgYbMigrationRows; without read_time, the latest.
message CountPgYbMigrationRowsRequestPB {
  optional uint32 database_oid = 1;
  optional fixed64 read_time = 2;
}

message CountPgYbMigrationRowsResponsePB {
  optional MasterErrorPB error = 1;
  optional int64 count = 2;
}

// The sys catalog rows of the given types as of read_time, read from the local checkpoint of a
// snapshot (GetBackupEntriesAsOfTime).
message ScanSnapshotSysCatalogRequestPB {
  optional bytes snapshot_id = 1;
  optional fixed64 read_time = 2;
  repeated int32 entry_types = 3;
}

message ScanSnapshotSysCatalogResponsePB {
  optional MasterErrorPB error = 1;
  repeated SysRowEntry rows = 2;
}

service MasterRustPeer {
  rpc PushLocations(PushLocationsRequestPB) returns (PushLocationsResponsePB);
  rpc DumpCatalog(DumpCatalogRequestPB) returns (DumpCatalogResponsePB);
}

// The target universe's xCluster steps the host keeps in C++ (K9).

// ValidateAutoFlagsConfig of the source universe against this one's config, through the
// replication group's XClusterRemoteClientHolder.
message XClusterValidateAutoFlagsRequestPB {
  optional string replication_group_id = 1;
  repeated HostPortPB master_addresses = 2;
}

message XClusterValidateAutoFlagsResponsePB {
  optional MasterErrorPB error = 1;
  // Unset when the source does not support the check yet.
  optional bool valid = 2;
  optional uint32 source_version = 3;
  // The version of this universe's config that was checked.
  optional uint32 local_version = 4;
}

// This universe's AutoFlags config version, which xCluster groups revalidate on change.
message LocalAutoFlagsConfigVersionRequestPB {
}

message LocalAutoFlagsConfigVersionResponsePB {
  optional MasterErrorPB error = 1;
  optional uint32 version = 2;
}

// PopulateXClusterStreamEntryTabletMapping: the consumer tablets each producer tablet maps to.
message XClusterTabletMappingRequestPB {
  message ConsumerTabletPB {
    optional bytes tablet_id = 1;
    optional PartitionPB partition = 2;
  }
  optional string producer_table_id = 1;
  optional string consumer_table_id = 2;
  repeated ConsumerTabletPB consumer_tablets = 3;
  repeated TabletLocationsPB producer_locations = 4;
  optional cdc.StreamEntryPB stream_entry = 5;
}

message XClusterTabletMappingResponsePB {
  optional MasterErrorPB error = 1;
  optional cdc.StreamEntryPB stream_entry = 2;
}

// Schema::EquivalentForDataCopy of the source table's schema and the target's.
message XClusterSchemasEquivalentRequestPB {
  optional SchemaPB source = 1;
  optional SchemaPB target = 2;
}

message XClusterSchemasEquivalentResponsePB {
  optional MasterErrorPB error = 1;
  optional bool equivalent = 2;
  // Schema::SchemaName of the source schema.
  optional string source_schema_name = 3;
}

// The CreateTable request of system.xcluster_safe_time
// (XClusterSafeTimeService::CreateXClusterSafeTimeTableIfNotFound).
message XClusterSafeTimeCreateTableRequestRequestPB {
}

message XClusterSafeTimeCreateTableRequestResponsePB {
  optional MasterErrorPB error = 1;
  optional CreateTableRequestPB request = 2;
}

// A row of system.xcluster_safe_time, its columns as written.
message XClusterSafeTimeRowPB {
  optional string replication_group_id = 1;
  optional string tablet_id = 2;
  optional int64 safe_time = 3;
}

message XClusterSafeTimeReadRequestPB {
}

message XClusterSafeTimeReadResponsePB {
  optional MasterErrorPB error = 1;
  repeated XClusterSafeTimeRowPB rows = 2;
}

message XClusterSafeTimeDeleteRequestPB {
  repeated XClusterSafeTimeRowPB rows = 1;
}

message XClusterSafeTimeDeleteResponsePB {
  optional MasterErrorPB error = 1;
}

// UpdateTabletMappingOnProducerSplit: a source tablet's split applied to a stream's tablet mapping.
message XClusterProducerSplitRequestPB {
  repeated XClusterTabletMappingRequestPB.ConsumerTabletPB consumer_tablets = 1;
  optional ProducerSplitTabletInfoPB split_info = 2;
  optional cdc.StreamEntryPB stream_entry = 3;
}

message XClusterProducerSplitResponsePB {
  optional MasterErrorPB error = 1;
  optional cdc.StreamEntryPB stream_entry = 2;
  optional bool found_source = 3;
  optional bool found_all_split_children = 4;
}

// UpdateTabletMappingOnConsumerSplit: a target tablet's split applied to a stream's tablet mapping.
message XClusterConsumerSplitRequestPB {
  repeated XClusterTabletMappingRequestPB.ConsumerTabletPB consumer_tablets = 1;
  optional bytes source_tablet_id = 2;
  repeated bytes child_tablet_ids = 3;
  optional cdc.StreamEntryPB stream_entry = 4;
}

message XClusterConsumerSplitResponsePB {
  optional MasterErrorPB error = 1;
  optional cdc.StreamEntryPB stream_entry = 2;
}

// AddHistoricalPackedSchemaForColocatedTable's packing step: the version of an equivalent packing
// already among `old_schema_packings`, else the schema's packing at the next version.
message XClusterHistoricalSchemaPackingRequestPB {
  repeated dockv.SchemaPackingPB old_schema_packings = 1;
  optional SchemaPB schema = 2;
}

message XClusterHistoricalSchemaPackingResponsePB {
  optional MasterErrorPB error = 1;
  optional uint32 existing_version = 2;
  optional dockv.SchemaPackingPB new_packing = 3;
}

// The web table page's C++-rendered parts (MasterPathHandlers::HandleTablePageJSON): the schema's
// columns and each partition's PartitionDebugString. A vector index's partitions are keyed by its
// indexed table's schema, which the caller passes as `partition_schema` and `partition_keys`.
message WebTableLayoutRequestPB {
  optional SchemaPB schema = 1;
  optional PartitionSchemaPB partition_schema = 2;
  // The schema the partition keys are encoded with; `schema` when absent.
  optional SchemaPB partition_keys = 3;
  repeated PartitionPB partitions = 4;
}

message WebTableLayoutResponsePB {
  message Column {
    optional bytes name = 1;
    optional bytes id = 2;
    optional bytes type = 3;
  }
  optional MasterErrorPB error = 1;
  repeated Column columns = 2;
  repeated bytes partitions = 3;
}
