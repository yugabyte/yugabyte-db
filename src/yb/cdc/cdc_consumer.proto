syntax = "proto3";

package yb.cdc;

option java_package = "org.yb.cdc";

import "yb/common/common_net.proto";

message ProducerTabletListPB {
  // List of tablet ids, start and end keys for a given producer table.
  repeated string tablets = 1;
  repeated bytes start_key = 2;
  repeated bytes end_key = 3;
}

message SchemaVersionsPB {
  uint32 current_producer_schema_version = 1;
  uint32 current_consumer_schema_version = 2;

  // This is a map of previous producer schema versions to their matching consumer schema versions.
  // This is ordered by increasing producer schema version.
  //
  // [packed = false] is intentional and required for cross-version wire-compatibility, since these
  // fields were changed from implicit optional singular fields in 11482d6 (see #31533).
  repeated uint32 old_producer_schema_versions = 3 [ packed = false ];
  repeated uint32 old_consumer_schema_versions = 4 [ packed = false ];
}

message StreamEntryPB {
  // Map from consumer to producer tablet id.
  map<string, ProducerTabletListPB> consumer_producer_tablet_map = 1;
  string consumer_table_id = 2;
  string producer_table_id = 3;
  bool local_tserver_optimized = 4;
  // ProducerSchemaPB producer_schema
  reserved 5;

  // Producer consumer schema versions
  SchemaVersionsPB schema_versions = 6;

  // Mapping of colocation_id to producer/consumer schema versions
  map<uint32, SchemaVersionsPB> colocated_schema_versions = 7;

  bool is_ddl_queue_table = 8;

  // See SysCDCStreamEntryPB.xcluster_use_target_applied_filter.
  bool xcluster_use_target_applied_filter = 9;
}

message ProducerEntryPB {
  // Map from stream id to metadata for that stream.
  map<string, StreamEntryPB> stream_map = 1;
  repeated HostPortPB master_addrs = 2;
  // Reserved for deprecated tserver_addrs. See issue #11989.
  reserved 3;
  bool disable_stream = 4; // [default = false] implicit in proto3
  uint32 compatible_auto_flag_config_version = 5; // [default = 0] implicit in proto3
  uint32 validated_auto_flags_config_version = 6; // [default = 0] implicit in proto3
  // Whether automatic ddl mode is enabled for all streams in this replication group.
  bool automatic_ddl_mode = 7;
}

// How far the poller of a tablet got. Every change before the checkpoint, and every change that
// commits up to the safe time, is in the CDC table.
message CdcTablePollerPositionPB {
  int64 term = 1;
  int64 index = 2;
  // -1 if not known.
  int64 safe_hybrid_time = 3;
}

// A tablet that came out of a split, and the position its poller starts from: the one that the
// poller of its parent reported. The parent's poller is told about the split wherever it is in the
// parent's WAL, and the rest of that WAL is only read through the children, which have a copy.
message CdcTableTabletStartPB {
  string tablet_id = 1;
  CdcTablePollerPositionPB position = 2;
}

// Sent by a tserver to the master while one of its pollers is being told by the CDC service that
// its tablet has been split.
message CdcTableSplitReportPB {
  string stream_id = 1;
  string tablet_id = 2;
  // What the poller has applied.
  CdcTablePollerPositionPB position = 3;
}

// One CDCSDK stream whose changes the CDC table pollers write into the CDC table of its database.
message CdcTableStreamEntryPB {
  string stream_id = 1;
  string namespace_id = 2;
  // DocDB table id of pg_yb_cdc_changes in this database.
  string cdc_table_id = 3;
  // Tables of the stream that belong to a publication. Changes of other tables are not written.
  repeated string published_table_ids = 4;
  // Tablets of the published tables. Each is polled by the tserver hosting its leader. A split
  // tablet stays here until its poller has reported the split, and both its children replace it in
  // the same registry version: the CDC safe time is the minimum over these tablets, and must not
  // be computed without the key range of either child.
  repeated string tablet_ids = 5;
  // Whether the sys catalog tablet is polled for this stream.
  bool poll_sys_catalog = 6;
  // For those of tablet_ids that replaced a split tablet.
  repeated CdcTableTabletStartPB tablet_starts = 7;
}

// Sent by the master to the tservers in the heartbeat response.
message CdcTablePollerRegistryPB {
  uint64 version = 1;
  repeated CdcTableStreamEntryPB streams = 2;
  // The sys catalog tablet has no leader on a tserver, so the master picks the tserver polling it.
  string sys_catalog_poller_ts_uuid = 3;
}

// NOTE: Deprecated
enum XClusterRole {
  ACTIVE = 0;
  STANDBY = 1;
}

message ConsumerRegistryPB {
  // Map from ReplicationGroupId to metadata for that ReplicationGroup.
  map<string, ProducerEntryPB> producer_map = 1;
  // Reserved for deprecated enable_replicate_transaction_status_table field.
  reserved 2;
  // Cannot remove the field, since we need to support rollbacks.
  XClusterRole DEPRECATED_role = 3;
  // Cannot remove the field, since we need to support rollbacks.
  bool DEPRECATED_transactional = 4;
}
