name: "bld-yba"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'managed/**'
      - '!managed/ui/**'
      - '!managed/yba-installer/**'

# Can be skipped if PR is draft or the commit message contains [skip ci] or [ci skip]
jobs:
  bld-yba:
    if: github.event.pull_request.draft == false
    runs-on: ybdbghr
    steps:
      - name: Build Trigger
        run: ybbld ${{ github.event.pull_request.number }} YBA
