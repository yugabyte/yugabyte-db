name: "bld-db"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # All files should be covered by one of the bld-* workflows.
    # If you add ignored paths here, make sure they are covered by one of the other bld-* workflows.
    paths-ignore:
      - '.agents/**'
      - '.arc*'
      - '.claude/**'
      - '.cursor/**'
      - '.git/**'
      - '.github/**'
      - '!.github/workflows/bld-db.yml'
      - '.gitignore'
      - 'architecture/**'
      - 'arcanist/**'
      - CONTRIBUTORS.md
      - 'cloud/**'
      - code_style
      - 'community/**'
      - java/yb-client
      - 'docs/**'
      - LICENSE.md
      - 'license/**'
      - 'managed/**'
      - '!managed/src/main/resources/ybc_version.conf'
      - NOTICE.txt
      - '**/*.md'
      - '**/README*'
      - 'sample/**'
      - 'src/lint/**'


jobs:
  # We want CSI-link posted only for DB changes, hence in this file,
  # but it only needs to run for the opened event.
  csi-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: CSI-status
        if: github.event.action == 'reopened'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const csiMD = `[[CSIweb](https://csiweb.dev.yugabyte.com/pull/${prNumber})]`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: csiMD
            });

  bld-db:
    environment: jenkins
    # The jenkins environment requires approval, so the job waits until a yugabyte-dev member
    # approves it. A newer run for the same PR cancels the older one, if it is still waiting.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ybdbghr
    steps:
      - name: Build Trigger
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: ybbld "$PR_NUMBER" "$PR_SHA" DB
