name: "bld-db"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - '.arc*'
      - '.claude/**'
      - '.cursor/**'
      - '.git/**'
      - 'architecture/**'
      - 'arcanist/**'
      - CONTRIBUTORS.md
      - 'cloud/**'
      - code_style
      - 'community/**'
      - java/README.md
      - java/yb-client
      - 'docs/**'
      - LICENSE.md
      - 'license/**'
      - NOTICE.txt
      - README.md
      - 'sample/**'
      - 'src/lint/**'

# Can be skipped if PR is draft or the commit message contains [skip ci] or [ci skip]
jobs:
  db-bld:
    if: github.event.pull_request.draft == false
    runs-on: ybdbghr
    steps:
      - name: DB Build Trigger
        run: ybbld ${{ github.event.pull_request.number }} DB