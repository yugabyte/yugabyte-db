name: "bld-docs"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'docs/**'
      - README.md

# Can be skipped if PR is draft or the commit message contains [skip ci] or [ci skip]
jobs:
  bld-docs:
    if: github.event.pull_request.draft == false
    runs-on: ybdbghr
    steps:
      - name: Build Trigger
        run: ybbld ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} DOCS
