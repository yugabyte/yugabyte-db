name: "bld-docs"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'docs/**'
      - README.md

# Can be skipped if PR is draft or the commit message contains [skip ci] or [ci skip]
# The jenkins environment requires approval, so the job waits until a yugabyte-dev member
# approves it. A newer run for the same PR (push, reopen, ready for review) cancels the older
# one, whether it is still waiting or already running ybbld for the older commit; a waiting
# run would otherwise hold the group and block the newer run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bld-docs:
    if: github.event.pull_request.draft == false
    environment: jenkins
    runs-on: ybdbghr
    steps:
      - name: Build Trigger
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: ybbld "$PR_NUMBER" "$PR_SHA" DOCS
