name: "bld"

# Jenkins builds are opt-in, so a push does not pay for a full test run. A build starts only on a
# "trigger jenkins" PR comment from a repo member. Merge requires the yb-required commit status,
# which Jenkins posts on the head SHA it built, so a push after the last build blocks merge until
# a new build passes.
#
# SECURITY: issue_comment runs from the default branch with repo secrets and feeds the
# self-hosted ybdbghr runner, so only members and collaborators can trigger, and no PR code is
# checked out or run here. Changed-file routing runs on a GitHub-hosted runner from master's copy
# of .github/scripts.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write  # reply to the trigger comment

jobs:
  route:
    # startsWith and contains are case-insensitive, so "Trigger Jenkins" works too.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'trigger jenkins') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.route.outputs.pr }}
      sha: ${{ steps.route.outputs.sha }}
      targets: ${{ steps.route.outputs.targets }}
    steps:
      - name: Checkout routing script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: Pick build targets
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          # Best-effort dedup of repeated triggers. A finished build can be re-triggered, e.g.
          # after a flaky failure. If the lookup fails, build anyway.
          # shellcheck disable=SC2016  # $owner etc. are GraphQL variables, not shell ones.
          query='query($owner: String!, $name: String!, $oid: GitObjectID!) {
            repository(owner: $owner, name: $name) {
              object(oid: $oid) { ... on Commit { status { context(name: "yb-required") {
                state } } } } } }'
          if ! state=$(gh api graphql -f query="$query" -f owner="${REPO%/*}" \
              -f name="${REPO#*/}" -f oid="$SHA" \
              --jq '.data.repository.object.status.context.state // empty'); then
            echo "::warning::Could not read the yb-required status of $SHA"
            state=
          fi
          if [[ $state == PENDING ]]; then
            echo "::notice::A Jenkins build is already running for $SHA"
            targets='[]'
          else
            # Include a renamed file's old path, so moving a file out of src/ still builds DB.
            targets=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' |
              python3 .github/scripts/ybbld_targets.py)
          fi
          echo "Targets for $SHA: $targets"
          {
            echo "pr=$PR"
            echo "sha=$SHA"
            echo "targets=$targets"
            echo "skipped=$([[ $state == PENDING ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Acknowledge trigger comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.route.outputs.pr }}
          SHA: ${{ steps.route.outputs.sha }}
          SKIPPED: ${{ steps.route.outputs.skipped }}
          TARGETS: ${{ steps.route.outputs.targets }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          if [[ $SKIPPED == true ]]; then
            gh api -X POST "repos/$REPO/issues/$PR/comments" \
              -f body="A Jenkins build is already running for $SHA, so this trigger was ignored."
          else
            reaction=$([[ $TARGETS == '[]' ]] && echo confused || echo rocket)
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
              -f content="$reaction"
          fi

  bld:
    needs: route
    if: needs.route.outputs.targets != '[]'
    name: bld-${{ matrix.target }}
    runs-on: ybdbghr
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.route.outputs.targets) }}
    steps:
      - name: Build Trigger
        env:
          PR_NUMBER: ${{ needs.route.outputs.pr }}
          PR_SHA: ${{ needs.route.outputs.sha }}
          TARGET: ${{ matrix.target }}
        run: ybbld "$PR_NUMBER" "$PR_SHA" "$TARGET"
