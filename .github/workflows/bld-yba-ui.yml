name: "bld-yba-ui"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'managed/ui/**'

# Can be skipped if PR is draft or the commit message contains [skip ci] or [ci skip]
jobs:
  bld-yba-ui:
    if: github.event.pull_request.draft == false
    runs-on: ybdbghr
    steps:
      - name: Build Trigger
        run: ybbld ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }} YBA-UI
