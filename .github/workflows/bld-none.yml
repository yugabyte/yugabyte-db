name: "bld-none"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Need to catch the case of PRs that have only non-build, non-docs files
    paths:
      - '.agents/**'
      - '.arc*'
      - '.claude/**'
      - '.cursor/**'
      - '.git/**'
      - '.github/**'
      - '.gitignore'
      - 'architecture/**'
      - 'arcanist/**'
      - CONTRIBUTORS.md
      - 'cloud/**'
      - code_style
      - 'community/**'
      - java/yb-client
      - LICENSE.md
      - 'license/**'
      - NOTICE.txt
      - '**/*.md'
      - '!docs/**'
      - '**/README*'
      - 'sample/**'
      - 'src/lint/**'

jobs:
  bld-none:
    # Runs on jenkins, but very light-weight, so no approval required.
    # environment: jenkins
    runs-on: ybdbghr
    steps:
      - name: Build Trigger
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: ybbld "$PR_NUMBER" "$PR_SHA" NO-BLD
