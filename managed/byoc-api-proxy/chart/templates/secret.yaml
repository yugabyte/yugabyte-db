{{- include "byoc-api-proxy.validateAuthType" . }}
{{- if not .Values.proxiedApp.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "byoc-api-proxy.fullname" . }}
  labels:
    {{- include "byoc-api-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.proxiedApp.auth.type "api_key" }}
  API_KEY: {{ required "proxiedApp.auth.apiKey or proxiedApp.auth.existingSecret is required" .Values.proxiedApp.auth.apiKey | quote }}
  {{- else }}
  SERVICE_ACCOUNT_EMAIL: {{ required "proxiedApp.auth.serviceAccount.email is required" .Values.proxiedApp.auth.serviceAccount.email | quote }}
  SERVICE_ACCOUNT_PASSWORD: {{ required "proxiedApp.auth.serviceAccount.password is required" .Values.proxiedApp.auth.serviceAccount.password | quote }}
  {{- end }}
{{- end }}
