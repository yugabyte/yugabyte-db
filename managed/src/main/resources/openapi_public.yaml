          type: boolean
          example: false
        networking_spec:
          $ref: '#/components/schemas/UniverseNetworkingSpec'
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterSpec'
          maxItems: 16
          minItems: 1
