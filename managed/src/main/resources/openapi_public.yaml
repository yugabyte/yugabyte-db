openapi: 3.0.0
info:
  title: YugabyteDB Anywhere V2 APIs
  description: An improved set of APIs for managing YugabyteDB Anywhere
  contact:
    name: YugabyteDB Anywhere Support
    url: https://docs.yugabyte.com
    email: support@yugabyte.com
  license:
    name: Polyform Free Trial License 1.0.0
    url: https://github.com/yugabyte/yugabyte-db/blob/master/licenses/POLYFORM-FREE-TRIAL-LICENSE-1.0.0.txt
  version: v2
servers:
- description: API endpoint of YBA server
  url: '{protocol}://{host_port}/api/v2'
  variables:
    protocol:
      enum:
      - http
      - https
      default: http
    host_port:
      default: localhost:9000
tags:
- name: Authentication
  description: Authentication operations on YBA
- name: Backup and Restore
  description: Operations related to universe backup and restore
- name: Continuous Backup
  description: CRUD operations for Continuous YBA Backups
- name: Customer Configuration
  description: Customer configuration management
- name: Disaster Recovery
  description: Disaster recovery configuration management
- name: Encryption at rest
  description: Encryption at rest management
- name: Image Bundle
  description: Image bundle management
- name: Isolated Backup
  description: Isolated backup/restore of YBA to local filesystem
- name: Job Scheduler
  description: Job Scheduler
- name: Metrics
  description: CRUD operations for YBA metrics
- name: Node Agent
  description: Node agent operations
- name: PITR
  description: Point-in-time recovery configuration management
- name: Perf Advisor Endpoint
  description: CRUD operations for external Perf Advisor destinations
- name: Support Bundle
  description: Support bundle management for universes
- name: Task
  description: Customer task management
- name: Telemetry Provider
  description: Operations for Telemetry Providers
- name: Universe
  description: CRUD operations for a Universe
- name: YBA Instance
  description: YBA Instance operations
paths:
  /customers/{cUUID}/auth/group-mappings:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    get:
      operationId: listMappings
      summary: List Group Mappings
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2024.2.0.0 that could change.</b></p>Get list of all OIDC and LDAP
        Group Mappings.'
      tags:
      - Authentication
      responses:
        '200':
          $ref: '#/components/responses/AuthGroupToRolesMappingResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
      x-yba-api-since: 2024.2.0.0
      x-yba-api-visibility: preview
    put:
      operationId: updateGroupMappings
      summary: Create Group Mappings
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2024.2.0.0 that could change.</b></p>Map LDAP and OIDC groups to YBA
        roles'
      tags:
      - Authentication
      requestBody:
        $ref: '#/components/requestBodies/AuthGroupToRolesMappingReq'
      responses:
        '200':
          description: Operation Successfull
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        auditTargetType: GroupMapping
        auditTargetId: cUUID.toString()
        auditActionType: Set
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: super_admin_actions
        resourceLocation:
          path: customers
          sourceType: endpoint
      x-yba-api-since: 2024.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/auth/group-mappings/{gUUID}:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: gUUID
      in: path
      description: Group UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    delete:
      operationId: deleteGroupMappings
      summary: Delete Group Mappings
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2024.2.0.0 that could change.</b></p>Delete LDAP and OIDC group mapping'
      tags:
      - Authentication
      responses:
        '200':
          description: OK
        '400':
          description: Invalid input
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        auditTargetType: GroupMapping
        auditTargetId: gUUID.toString()
        auditActionType: Delete
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: super_admin_actions
        resourceLocation:
          path: customers
          sourceType: endpoint
      x-yba-api-since: 2024.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/backups/page:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    post:
      operationId: pageListBackups
      summary: List universe backups.
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.2.0.0 that could change.</b></p>Returns universe backups for
        the specified customer with pagination and optional filters.

        Only full (base) backups are returned. Use `pageListIncrementalBackups` to
        list incrementals

        in a backup chain.

        WARNING: This is a preview API that could change.

        '
      tags:
      - Backup and Restore
      requestBody:
        $ref: '#/components/requestBodies/BackupPagedReq'
      responses:
        '200':
          $ref: '#/components/responses/BackupPagedResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
        checkOnlyPermission: true
      x-yba-api-since: 2026.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/backups/{bUUID}/increments/page:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: bUUID
      in: path
      description: Backup UUID of any backup in the incremental chain
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    post:
      operationId: pageListIncrementalBackups
      summary: List incremental backups for a backup chain.
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.2.0.0 that could change.</b></p>Returns backups in the incremental
        chain for the specified backup, including the full

        (base) backup. Pass either the full backup UUID or any incremental backup
        UUID in the chain.

        `pageListBackups` returns only full backups; use this API to retrieve incrementals.

        Rows are ordered by create time. The order is descending by default.

        WARNING: This is a preview API that could change.

        '
      tags:
      - Backup and Restore
      requestBody:
        $ref: '#/components/requestBodies/IncrementalBackupPagedReq'
      responses:
        '200':
          $ref: '#/components/responses/IncrementalBackupPagedResp'
        '400':
          description: Invalid input
        '404':
          description: Customer or backup not found
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
        checkOnlyPermission: true
      x-yba-api-since: 2026.2.0.0
      x-yba-api-visibility: preview
  /ybc/gflags-metadata:
    get:
      operationId: listYbcGflagsMetadata
      summary: List YBC Gflags metadata
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2024.2.0.0 that could change.</b></p>Get list of all YBC gflags and
        related metadata.'
      tags:
      - Backup and Restore
      responses:
        '200':
          $ref: '#/components/responses/YbcGflagsResp'
        '404':
          description: Not found
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
      x-yba-api-since: 2024.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/auto-yba-backups:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    get:
      operationId: GetContinuousBackup
      summary: Get Continuous Backup
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2024.2.0.0 that could change.</b></p>Get details of the continuous
        backup configuration'
      tags:
      - Continuous Backup
      responses:
        '200':
          description: successful operation
          $ref: '#/components/responses/ContinuousBackupResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
      x-yba-api-since: 2024.2.0.0
      x-yba-api-visibility: preview
    post:
      operationId: CreateContinuousBackup
      summary: Create Continous Backup
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2024.2.0.0 that could change.</b></p>Create a continuous backup configuration'
      tags:
      - Continuous Backup
      requestBody:
        $ref: '#/components/requestBodies/ContinuousBackupCreateReq'
      responses:
        '200':
          description: successful operation
          $ref: '#/components/responses/ContinuousBackupResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        auditTargetType: ContinuousBackup
        auditTargetId: 'null'
        auditActionType: Create
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: SUPER_ADMIN_ACTIONS
        resourceLocation:
          path: customers
          sourceType: endpoint
      x-yba-api-since: 2024.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/auto-yba-backups/restore:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    post:
      operationId: RestoreContinuousBackup
      summary: Restore Continuous Backup
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2024.2.0.0 that could change.</b></p>Restore a backup from a continuous
        backup configuration'
      tags:
      - Continuous Backup
      requestBody:
        $ref: '#/components/requestBodies/ContinuousBackupRestoreReq'
      responses:
        '202':
          $ref: '#/components/responses/YBATaskResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        auditTargetType: ContinuousBackup
        auditTargetId: 'null'
        auditActionType: Restore
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: SUPER_ADMIN_ACTIONS
        resourceLocation:
          path: customers
          sourceType: endpoint
      x-yba-api-since: 2024.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/auto-yba-backups/{bUUID}:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: bUUID
      in: path
      description: Continuous Backup UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    put:
      operationId: EditContinuousBackup
      summary: Edit Continuous Backup config
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2024.2.0.0 that could change.</b></p>Edit continuous backup config'
      tags:
      - Continuous Backup
      requestBody:
        $ref: '#/components/requestBodies/ContinuousBackupCreateReq'
      responses:
        '200':
          description: successful operation
          $ref: '#/components/responses/ContinuousBackupResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        auditTargetType: ContinuousBackup
        auditTargetId: bUUID.toString()
        auditActionType: Edit
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: SUPER_ADMIN_ACTIONS
        resourceLocation:
          path: customers
          sourceType: endpoint
      x-yba-api-since: 2024.2.0.0
      x-yba-api-visibility: preview
    delete:
      operationId: DeleteContinuousBackup
      summary: Delete Continuous Backup config
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2024.2.0.0 that could change.</b></p>Delete continuous backup config'
      tags:
      - Continuous Backup
      responses:
        '200':
          description: successful operation
          $ref: '#/components/responses/ContinuousBackupResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        auditTargetType: ContinuousBackup
        auditTargetId: bUUID.toString()
        auditActionType: Edit
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: SUPER_ADMIN_ACTIONS
        resourceLocation:
          path: customers
          sourceType: endpoint
      x-yba-api-since: 2024.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/customer-configs/page:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    post:
      operationId: pageListCustomerConfigs
      summary: List customer configurations (paged)
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.2.0.0 that could change.</b></p>Returns customer configurations
        for the specified customer with pagination.

        WARNING: This is a preview API that could change.

        '
      tags:
      - Customer Configuration
      requestBody:
        $ref: '#/components/requestBodies/CustomerConfigPagedReq'
      responses:
        '200':
          $ref: '#/components/responses/CustomerConfigPagedResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
        checkOnlyPermission: true
      x-yba-api-since: 2026.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/universes/{uniUUID}/dr-configs/page:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: uniUUID
      in: path
      description: Universe UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    post:
      operationId: pageListDrConfigs
      summary: List disaster recovery configurations.
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.2.0.0 that could change.</b></p>Returns disaster recovery configurations
        for the specified universe (as source or target)

        with pagination.

        WARNING: This is a preview API that could change.

        '
      tags:
      - Disaster Recovery
      requestBody:
        $ref: '#/components/requestBodies/DrConfigPagedReq'
      responses:
        '200':
          $ref: '#/components/responses/DrConfigPagedResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: universe
          action: READ
        resourceLocation:
          path: universes
          sourceType: endpoint
        checkOnlyPermission: true
      x-yba-api-since: 2026.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/dr-configs/{drUUID}/tables/page:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: drUUID
      in: path
      description: DR config UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    post:
      operationId: pageListDrConfigTables
      summary: List DR config table replication details.
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.2.0.0 that could change.</b></p>Returns paginated table replication
        details for the specified DR config.

        WARNING: This is a preview API that could change.

        '
      tags:
      - Disaster Recovery
      requestBody:
        $ref: '#/components/requestBodies/DrConfigTableDetailPagedReq'
      responses:
        '200':
          $ref: '#/components/responses/DrConfigTableDetailPagedResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: universe
          action: READ
        resourceLocation:
          path: source_universe_uuid
          sourceType: db
          dbClass: com.yugabyte.yw.models.XClusterConfig.class
          identifier: dr-configs
          columnName: dr_config_uuid
      - requiredPermission:
          resourceType: universe
          action: READ
        resourceLocation:
          path: target_universe_uuid
          sourceType: db
          dbClass: com.yugabyte.yw.models.XClusterConfig.class
          identifier: dr-configs
          columnName: dr_config_uuid
      x-yba-api-since: 2026.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/dr-configs/{drUUID}/databases/page:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: drUUID
      in: path
      description: DR config UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    post:
      operationId: pageListDrConfigDatabases
      summary: List DR config database replication details.
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.2.0.0 that could change.</b></p>Returns paginated database replication
        details for the specified DB-scoped DR config.

        WARNING: This is a preview API that could change.

        '
      tags:
      - Disaster Recovery
      requestBody:
        $ref: '#/components/requestBodies/DrConfigDbDetailPagedReq'
      responses:
        '200':
          $ref: '#/components/responses/DrConfigDbDetailPagedResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: universe
          action: READ
        resourceLocation:
          path: source_universe_uuid
          sourceType: db
          dbClass: com.yugabyte.yw.models.XClusterConfig.class
          identifier: dr-configs
          columnName: dr_config_uuid
      - requiredPermission:
          resourceType: universe
          action: READ
        resourceLocation:
          path: target_universe_uuid
          sourceType: db
          dbClass: com.yugabyte.yw.models.XClusterConfig.class
          identifier: dr-configs
          columnName: dr_config_uuid
      x-yba-api-since: 2026.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/kms-configs/page:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    post:
      operationId: pageListKmsConfigs
      summary: List KMS configurations (paged)
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.2.0.0 that could change.</b></p>Returns KMS configurations for
        the specified customer with pagination.

        WARNING: This is a preview API that could change.

        '
      tags:
      - Encryption at rest
      requestBody:
        $ref: '#/components/requestBodies/KmsConfigPagedReq'
      responses:
        '200':
          $ref: '#/components/responses/KmsConfigPagedResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
        checkOnlyPermission: true
      x-yba-api-since: 2026.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/providers/{providerUUID}/image-bundles/page:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: providerUUID
      in: path
      description: Provider UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    post:
      operationId: pageListImageBundles
      summary: List image bundles (paged)
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.2.0.0 that could change.</b></p>Returns image bundles for the
        specified provider with pagination.

        WARNING: This is a preview API that could change.

        '
      tags:
      - Image Bundle
      requestBody:
        $ref: '#/components/requestBodies/ImageBundlePagedReq'
      responses:
        '200':
          $ref: '#/components/responses/ImageBundlePagedResp'
        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        noAudit: true
      x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
        checkOnlyPermission: true
      x-yba-api-since: 2026.2.0.0
      x-yba-api-visibility: preview
  /customers/{cUUID}/providers/{providerUUID}/image-bundles/{iBUUID}:
    parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: providerUUID
      in: path
      description: Provider UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: iBUUID
      in: path
      description: Image Bundle UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    get:
