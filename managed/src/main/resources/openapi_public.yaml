          - Adding
          - BeingDecommissioned
          - Decommissioned
          - UpdateCert
          - ToggleTls
          - ConfigureDBApis
          - Resizing
          - SystemdUpgrade
          - Terminating
          - Terminated
          - Rebooting
          - HardRebooting
          - VMImageUpgrade
          - InstanceStopping
          - InstanceStopped
        yb_prebuilt_ami:
          description: True if this a custom YB AMI
          type: boolean
    UniverseResourceDetails:
      title: UniverseResourceDetails
      description: Universe resource details. Part of UniverseInfo.
