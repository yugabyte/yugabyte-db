        ycql_audit_config:
          $ref: '#/components/schemas/YCQLAuditConfig'
        exporters:
          description: List of exporters. Empty = no export.
          type: array
          items:
            $ref: '#/components/schemas/UniverseLogsExporterConfig'
    QueryLogsTelemetrySpec:
      x-yba-api-visibility: preview
      x-yba-api-since: 2026.1.2.0
      title: QueryLogsTelemetrySpec
      type: object
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.1.2.0 that could change.</b></p>Query logs (YSQL). Omit or set
        to null to disable.'
      properties:
        ysql_query_log_config:
          $ref: '#/components/schemas/YSQLQueryLogConfig'
        exporters:
          description: List of exporters. Empty = no export.
          type: array
          items:
            $ref: '#/components/schemas/UniverseQueryLogsExporterConfig'
    MetricsTelemetrySpec:
      x-yba-api-visibility: preview
      x-yba-api-since: 2026.1.2.0
      title: MetricsTelemetrySpec
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
