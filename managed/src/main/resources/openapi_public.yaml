          $ref: '#/components/schemas/AuditLogsTelemetrySpec'
        query_logs:
          description: YSQL query logs. null = disabled.
          $ref: '#/components/schemas/QueryLogsTelemetrySpec'
        metrics:
          description: Metrics export. null = disabled.
          $ref: '#/components/schemas/MetricsTelemetrySpec'
    ExportTelemetryUpgradeOptions:
      x-yba-api-visibility: preview
      x-yba-api-since: 2026.1.2.0
      title: ExportTelemetryUpgradeOptions
      type: object
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.1.2.0 that could change.</b></p>Upgrade options for applying
        telemetry config changes (rolling vs non-rolling, delays).'
      properties:
        rolling_upgrade:
          description: If true, perform rolling restart; otherwise non-rolling.
          type: boolean
          default: true
        delay_between_master_servers:
          description: Delay in seconds between restarting master servers during rolling
            upgrade.
          type: integer
          default: 0
        delay_between_tserver_servers:
          description: Delay in seconds between restarting tserver servers during
            rolling upgrade.
          type: integer
          default: 0
        sleep_after_tserver_restart_millis:
          description: Sleep duration in milliseconds after each tserver restart.
          type: integer
          default: 180000
        sleep_after_master_restart_millis:
          description: Sleep duration in milliseconds after each master restart.
          type: integer
          default: 180000
    ExportTelemetryConfigSpec:
      x-yba-api-since: 2026.1.2.0
      x-yba-api-visibility: preview
      type: object
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.1.2.0 that could change.</b></p>Request to configure all telemetry
        export configs for a universe'
      properties:
        upgrade_options:
          $ref: '#/components/schemas/ExportTelemetryUpgradeOptions'
        telemetry_config:
          description: Telemetry config. Omit a key or set to null to disable that
            config.
          $ref: '#/components/schemas/TelemetryConfig'
    UniverseOperatorImportReq:
      title: UniverseOperatorImportReq
      description: 'UniverseOperatorImportReq


        Payload to import a universe to the operator. Part of UniverseOperatorImportReq

        '
      type: object
      properties:
        namespace:
          description: The namespace in which the universe custom resource will be
            created in.
          type: string
    UniverseCrossCloudFederationSpec:
      title: UniverseCrossCloudFederationSpec
      description: 'UniverseCrossCloudFederationSpec


        Payload to enable or disable cross-cloud federated IAM on an existing universe.

        '
      type: object
      required:
      - enabled
      properties:
        enabled:
          description: When true, configure cross-cloud federated IAM on all nodes
            of the universe (the provider must have federated IAM enabled with an
            audience set). When false, tear it down on all nodes.
          type: boolean
    UpdateProxyConfigSpec:
      title: UpdateProxyConfigSpec
      description: 'Proxy settings for update_proxy_config.

        '
      type: object
      properties:
        proxy_config:
          $ref: '#/components/schemas/NodeProxyConfig'
        az_networking:
          description: Proxy settings overridden per Availability Zone identified
            by AZ uuid.
          additionalProperties:
            $ref: '#/components/schemas/NodeProxyConfig'
    PerProviderUpdateProxyConfigSpec:
      title: PerProviderUpdateProxyConfigSpec
      description: Proxy settings for a single provider when updating proxy configuration
        on a multicloud cluster.
      type: object
      required:
      - provider
      properties:
        provider:
          description: Cloud provider UUID.
          type: string
          format: uuid
        proxy_config:
          description: Default proxy settings for this provider.
          $ref: '#/components/schemas/NodeProxyConfig'
        region_networking:
          description: Proxy settings overridden per region identified by region code.
          additionalProperties:
            $ref: '#/components/schemas/NodeProxyConfig'
        az_networking:
          description: Proxy settings overridden per Availability Zone identified
            by AZ code.
          additionalProperties:
            $ref: '#/components/schemas/NodeProxyConfig'
    UniverseUpdateProxyConfig:
      title: UniverseUpdateProxyConfig
      description: 'UniverseUpdateProxyConfig


        Request payload to update proxy configuration for clusters in a universe.

        Part of UniverseUpdateProxyConfigReq.

        '
      type: object
      required:
      - clusters
      properties:
        clusters:
          description: Clusters whose proxy configuration should be updated.
          type: array
          items:
            type: object
            required:
            - uuid
            properties:
              uuid:
                description: The system generated cluster uuid to update. This can
                  be fetched from ClusterInfo.
                type: string
                format: uuid
                example: 19ebde21-d537-47dc-8fab-3edc243c6f68
              networking_spec:
                description: 'Deprecated: use provider_proxy_specs for multicloud
                  clusters. Proxy settings for a single-provider cluster.'
                $ref: '#/components/schemas/UpdateProxyConfigSpec'
                deprecated: true
              provider_proxy_specs:
                description: Proxy settings per provider for multicloud clusters.
                type: array
                items:
                  $ref: '#/components/schemas/PerProviderUpdateProxyConfigSpec'
          minItems: 1
    ClusterResizeStorageSpec:
      title: ClusterResizeStorageSpec
      description: Storage volume specification that is used for tserver nodes in
        this cluster. Part of ClusterSpec, ClusterAddSpec and ClusterEditSpec.
      type: object
      properties:
        volume_size:
          description: The size of each volume in each instance. Could be modified
            in payload for /resize_node API call
          type: integer
          format: int32
        disk_iops:
          description: Desired IOPS for the volumes mounted on this aws, gcp or azu
            instance
          type: integer
          format: int32
        throughput:
          description: Desired throughput for the volumes mounted on this aws, gcp
            or azu instance
          type: integer
          format: int32
    PerProcessResizeNodeSpec:
      title: PerProcessResizeNodeSpec
      description: Instance settings for each node in the cluster. The instances can
        be onprem nodes, VMs in GCP/AWS/Azure, or pods in k8s. Part of AvailabilityZoneNodeSpec
        and ClusterNodeSpec.
      type: object
      properties:
        instance_type:
          description: Instance type for tserver/master nodes of cluster that determines
            the cpu and memory resources.
          type: string
          example: c5.xlarge
        storage_spec:
          $ref: '#/components/schemas/ClusterResizeStorageSpec'
    AvailabilityZoneResizeNodeSpec:
      title: AvailabilityZoneResizeNodeSpec
      description: Properties for each node in the cluster. The settings can be configured
        at top-level for uniform node settings for both tserver and master nodes.
        Granular settings for tserver and master will be honored if provided (and
        dedicated_nodes is true or this is k8s cluster). Part of ClusterNodeSpec.
      type: object
      allOf:
      - $ref: '#/components/schemas/PerProcessResizeNodeSpec'
      - properties:
          tserver:
            description: Instance spec for tserver nodes of cluster.
            $ref: '#/components/schemas/PerProcessResizeNodeSpec'
          master:
            description: Instance spec for master nodes of cluster
            $ref: '#/components/schemas/PerProcessResizeNodeSpec'
    ClusterResizeNodeSpec:
      title: ClusterResizeNodeSpec
      description: Node settings (like CPU / memory) for each node in the cluster.
        The node settings configured at top-level are uniform settings for both tserver
        and master nodes. Granular settings for tserver and master (honoured if dedicated_nodes
        is true or this is k8s cluster) are available for certain node properties.
        Granular settings can also be overridden per Availability Zone. This is part
        of ClusterSpec.
      type: object
      allOf:
      - $ref: '#/components/schemas/AvailabilityZoneResizeNodeSpec'
      - properties:
          k8s_master_resource_spec:
            description: Used only for a k8s Universe. Required for k8s Universe if
              instance_type is not specified. Sets custom cpu and memory requests/limits
              for master pods of a cluster.
            $ref: '#/components/schemas/K8SNodeResourceSpec'
          k8s_tserver_resource_spec:
            description: Used only for a k8s Universe. Required for k8s Universe if
              instance_type is not specified. Sets custom cpu and memory requests/limits
              for tserver pods of a cluster.
            $ref: '#/components/schemas/K8SNodeResourceSpec'
          az_node_spec:
            description: Granular node settings overridden per Availability Zone identified
              by AZ uuid.
            additionalProperties:
              $ref: '#/components/schemas/AvailabilityZoneResizeNodeSpec'
    ResizeProviderNodeSpec:
      title: ResizeProviderNodeSpec
      description: Resize-specific node properties at a single level in the provider
        nodes specification hierarchy. A subset of ProviderNodeSpec. Part of ResizeProviderRootNodesSpec.
      type: object
      properties:
        instance_type:
          description: Instance type for tserver/master nodes that determines the
            cpu and memory resources.
          type: string
          example: c5.xlarge
        storage_spec:
          $ref: '#/components/schemas/ClusterResizeStorageSpec'
        k8s_node_resource_spec:
          description: Custom cpu and memory requests/limits for k8s pods.
          $ref: '#/components/schemas/K8SNodeResourceSpec'
    ResizeProviderNodesSpec:
      title: ResizeProviderNodesSpec
      description: Tserver and master resize node specs at a single level of the provider
        nodes specification hierarchy.
      type: object
      properties:
        tserver_specification:
          description: Node specification for tserver processes.
          $ref: '#/components/schemas/ResizeProviderNodeSpec'
        master_specification:
          description: Node specification for master processes.
          $ref: '#/components/schemas/ResizeProviderNodeSpec'
    ResizeProviderAzNodesSpec:
      title: ResizeProviderAzNodesSpec
      description: Availability-zone-level resize node specification (leaf of the
        provider nodes specification hierarchy).
      type: object
      allOf:
      - $ref: '#/components/schemas/ResizeProviderNodesSpec'
      - properties:
          az_code:
            description: Availability zone code within the region.
            type: string
        required:
        - az_code
    ResizeProviderRegionNodesSpec:
      title: ResizeProviderRegionNodesSpec
      description: Region-level resize node specification, optionally containing per-AZ
        overrides.
      type: object
      allOf:
      - $ref: '#/components/schemas/ResizeProviderNodesSpec'
      - properties:
          region_code:
            description: Region code within the cloud provider.
            type: string
          az_nodes_specs:
            description: Per-availability-zone resize node specification overrides.
            type: array
            items:
              $ref: '#/components/schemas/ResizeProviderAzNodesSpec'
        required:
        - region_code
    ResizeProviderRootNodesSpec:
      title: ResizeProviderRootNodesSpec
      description: Root-level resize node specification for a provider, optionally
        containing per-region and per-AZ overrides.
      type: object
      allOf:
      - $ref: '#/components/schemas/ResizeProviderNodesSpec'
      - properties:
          region_nodes_specs:
            description: Per-region resize node specification overrides.
            type: array
            items:
              $ref: '#/components/schemas/ResizeProviderRegionNodesSpec'
    PerProviderResizeNodesSpec:
      title: PerProviderResizeNodesSpec
      description: Proposed resize node settings for a single provider when checking
        resize options for a multicloud cluster.
      type: object
      required:
      - provider
      - nodes_spec
      properties:
        provider:
          description: Cloud provider UUID.
          type: string
          format: uuid
        nodes_spec:
          description: Proposed resize node settings for this provider.
          $ref: '#/components/schemas/ResizeProviderRootNodesSpec'
    UniverseResizeNodesCluster:
      title: UniverseResizeNodesCluster
      description: 'UniverseResizeNodesCluster


        A single cluster for UniverseResizeNodes.

        '
      type: object
      required:
      - uuid
      properties:
        uuid:
          description: Cluster UUID
          type: string
          format: uuid
        node_spec:
          description: 'Deprecated: use provider_nodes_specs for multicloud clusters.
            Proposed node settings for a single-provider cluster.'
          $ref: '#/components/schemas/ClusterResizeNodeSpec'
          deprecated: true
        provider_nodes_specs:
          description: Proposed resize node settings per provider for multicloud clusters.
          type: array
          items:
            $ref: '#/components/schemas/PerProviderResizeNodesSpec'
        gflags:
          $ref: '#/components/schemas/ClusterGFlags'
    UniverseResizeNodes:
      title: UniverseResizeNodes
      description: 'UniverseResizeNodes


        Request payload to update the size of nodes in a universe. Update the instance
        type and storage

        spec of the nodes. Part of UniverseResizeNodesReq

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/SleepAfterRestartSchema'
      - type: object
        properties:
          clusters:
            items:
              $ref: '#/components/schemas/UniverseResizeNodesCluster'
    CheckResizeOptionsSpec:
      title: CheckResizeOptionsSpec
      description: 'Request to check which resize-related operations are available
        for a cluster.

        Part of CheckResizeOptionsReq.

        '
      type: object
      required:
      - cluster_uuid
      properties:
        cluster_uuid:
          description: Cluster UUID to evaluate.
          type: string
          format: uuid
        node_spec:
          description: 'Deprecated: use provider_nodes_specs for multicloud clusters.
            Proposed node settings for a single-provider cluster.'
          $ref: '#/components/schemas/ClusterNodeSpec'
          deprecated: true
        provider_nodes_specs:
          description: Proposed node settings per provider for multicloud clusters.
          type: array
          items:
            $ref: '#/components/schemas/PerProviderResizeNodesSpec'
    ResizeUpdateOption:
      title: ResizeUpdateOption
      description: Available operation when changing cluster node settings.
      type: string
      enum:
      - FULL_MOVE
      - SMART_RESIZE
      - SMART_RESIZE_NON_RESTART
    CheckResizeOptionsResp:
      title: CheckResizeOptionsResp
      description: 'Response listing available resize-related operations for the proposed
        node settings.

        Part of CheckResizeOptionsResponse.

        '
      type: object
      required:
      - options
      properties:
        options:
          description: Available operations for applying the proposed node settings.
          type: array
          items:
            $ref: '#/components/schemas/ResizeUpdateOption'
    VMImageClusterSpec:
      title: VMImageClusterSpec
      description: Information about the VM image for particular provider in particular
        cluster.
      required:
      - cluster_uuid
      - provider_uuid
      - image_bundle_uuid
      type: object
      properties:
        cluster_uuid:
          description: cluster uuid
          type: string
          format: uuid
          example: 19ebde21-d537-47dc-8fab-3edc243c6f68
        provider_uuid:
          description: provider uuid
          type: string
          format: uuid
          example: 36ebde21-ab14-47dc-8fab-3edc243c6f68
        image_bundle_uuid:
          description: image bundle uuid
          type: string
          format: uuid
          example: 914aa5a8-febc-44ba-9b60-ea3e22127218
    UniverseVMImageUpgradeSpec:
      title: VMImageUpgradeSpec
      description: 'VMImageUpgradeSpec


        Request payload to edit vm images of a Universe nodes.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/SleepAfterRestartSchema'
      - type: object
        properties:
          image_bundles:
            type: array
            items:
              $ref: '#/components/schemas/VMImageClusterSpec'
          force_upgrade:
            description: Whether to skip checking current OS for each node.
            type: boolean
          yb_software_version:
            description: The YugabyteDB software version to install during os upgrade.
            type: string
            example: 2024.2.0.0-b600
