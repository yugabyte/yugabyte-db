          type: array
          items:
            enum:
            - READ
            - WRITE
            - FUNCTION
            - ROLE
            - DDL
            - MISC
            - MISC_SET
            type: string
          uniqueItems: true
        enabled:
          description: Enabled
          type: boolean
          readOnly: true
        log_catalog:
          description: Log catalog
          type: boolean
        log_client:
          description: Log client
          type: boolean
        log_level:
          description: Log level
          type: string
          enum:
          - DEBUG1
          - DEBUG2
          - DEBUG3
          - DEBUG4
          - DEBUG5
          - INFO
          - NOTICE
          - WARNING
          - LOG
        log_parameter:
          description: Log parameter
          type: boolean
        log_parameter_max_size:
          description: Log parameter max size
          type: integer
          format: int32
        log_relation:
          description: Log relation
          type: boolean
        log_rows:
          description: Log row
          type: boolean
        log_statement:
          description: Log statement
          type: boolean
        log_statement_once:
          description: Log statement once
