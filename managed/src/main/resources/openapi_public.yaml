      allOf:
      - $ref: '#/components/schemas/MetricsExportConfigBase'
      - type: object
        properties:
          exporters:
            description: List of exporters. Empty = no export.
            type: array
            items:
              $ref: '#/components/schemas/UniverseMetricsExporterConfig'
    UniverseServerLogsExporterConfig:
      title: UniverseServerLogsExporterConfig
      type: object
      description: 'UniverseServerLogsExporterConfig


        Universe Server Logs Exporter Config. Part of MasterLogConfig.

        '
      allOf:
      - $ref: '#/components/schemas/UniverseExporterConfig'
      - $ref: '#/components/schemas/BatchedExporterConfig'
      - $ref: '#/components/schemas/MemoryLimitedExporterConfig'
    TelemetryConfig:
      x-yba-api-visibility: preview
      x-yba-api-since: 2026.1.2.0
      title: TelemetryConfig
