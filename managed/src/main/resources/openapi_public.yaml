          resourceType: universe
          action: UPDATE
        resourceLocation:
          path: universes
          sourceType: endpoint
        checkOnlyPermission: false
      x-yba-api-block-operator-resource: universe
      x-yba-api-since: 2026.2.0.0
      x-yba-api-visibility: preview
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      name: X-AUTH-YW-API-TOKEN
      in: header
  schemas:
    ResourceDefinition:
      title: ResourceDefinition
      description: Resource definition containing the resource type and resource set.
      type: object
      required:
      - resource_type
      - allow_all
      properties:
        resource_type:
          description: Resource Type
          type: string
          enum:
          - UNIVERSE
          - ROLE
          - USER
          - OTHER
        allow_all:
          description: Select all resources (including future resources)
          type: boolean
        resource_uuid_set:
          description: Set of resource UUIDs
          type: array
          items:
            type: string
            format: uuid
          default: []
    ResourceGroup:
      title: ResourceGroup
      description: Resource group definition for the role. Only applicable for custom
        roles.
      type: object
      required:
      - resource_definition_set
      properties:
        resource_definition_set:
          type: array
          items:
            $ref: '#/components/schemas/ResourceDefinition'
    RoleResourceDefinition:
      title: RoleResourceDefinition.
      description: Defines the association of Role to Resource Groups. Part of AuthGroupToRolesMapping.
      type: object
      required:
      - role_uuid
      properties:
        role_uuid:
          description: UUID of the role to attach resource group to.
          type: string
          format: uuid
        resource_group:
          $ref: '#/components/schemas/ResourceGroup'
    AuthGroupToRolesMapping:
      title: AuthGroupToRolesMapping
      description: 'AuthGroupToRolesMapping


        Group mapping properties. This is used to map LDAP and OIDC group to YBA roles.

        '
      type: object
      required:
      - group_identifier
      - type
      - role_resource_definitions
      properties:
        group_identifier:
          description: Group name incase of OIDC. Group DN incase of LDAP.
          type: string
        uuid:
          description: System generated UUID for this group mapping.
          type: string
          format: uuid
          readOnly: true
        type:
          description: The type of group. Can be either LDAP/OIDC.
          type: string
          enum:
          - LDAP
          - OIDC
        creation_date:
          description: Group mapping creation date.
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
          readOnly: true
        role_resource_definitions:
          type: array
          items:
            $ref: '#/components/schemas/RoleResourceDefinition'
    PaginationSpec:
      title: PaginationSpec
      description: Pagination spec in page API requests.
      type: object
      x-parent: true
      properties:
        offset:
          description: Start offset of the records.
          type: integer
          format: int32
          default: 0
          minimum: 0
        limit:
          description: Maximum number of records to be fetched.
          type: integer
          format: int32
          default: 10
          maximum: 500
          minimum: 1
        direction:
          description: Sort order of the records.
          type: string
          enum:
          - ASC
          - DESC
    BackupState:
      title: BackupState
      description: Backup lifecycle state.
      type: string
      enum:
      - InProgress
      - Completed
      - Failed
      - Deleted
      - Skipped
      - FailedToDelete
      - Stopping
      - Stopped
      - QueuedForDeletion
      - QueuedForForcedDeletion
      - DeleteInProgress
      x-enum-varnames:
      - BackupInProgress
      - BackupCompleted
      - BackupFailed
      - BackupDeleted
      - BackupSkipped
      - BackupFailedToDelete
      - BackupStopping
      - BackupStopped
      - BackupQueuedForDeletion
      - BackupQueuedForForcedDeletion
      - BackupDeleteInProgress
    BackupApiFilter:
      title: BackupApiFilter
      description: Optional filter for listing backups.
      type: object
      properties:
        date_range_start:
          description: Include backups created on or after this time.
          type: string
          format: date-time
        date_range_end:
          description: Include backups created on or before this time.
          type: string
          format: date-time
        states:
          description: Backup states to include.
          type: array
          items:
            $ref: '#/components/schemas/BackupState'
        keyspace_list:
          description: Keyspace names to include.
          type: array
          items:
            type: string
        universe_name_list:
          description: Universe names to include.
          type: array
          items:
            type: string
        storage_config_uuid_list:
          description: Storage config UUIDs to include.
          type: array
          items:
            type: string
            format: uuid
        schedule_uuid_list:
          description: Backup schedule UUIDs to include.
          type: array
          items:
            type: string
            format: uuid
        universe_uuid_list:
          description: Universe UUIDs to include.
          type: array
          items:
            type: string
            format: uuid
        backup_uuid_list:
          description: Backup UUIDs to include.
          type: array
          items:
            type: string
            format: uuid
        only_show_deleted_universes:
          description: When true, include backups whose universe has been deleted.
          type: boolean
        only_show_deleted_configs:
          description: When true, include backups whose storage config has been deleted.
          type: boolean
        show_hidden:
          description: When true, include hidden backups.
          type: boolean
    BackupPagedQuerySpec:
      title: BackupPagedQuerySpec
      description: 'Paged list of universe backups.

        Rows are ordered by create time. The order is descending by default.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/PaginationSpec'
      properties:
        filter:
          $ref: '#/components/schemas/BackupApiFilter'
    PaginationResp:
      title: PaginationResp
      description: Pagination information in page API responses.
      type: object
      x-parent: true
      properties:
        has_next:
          description: There are more next records if true.
          type: boolean
        has_prev:
          description: There are more previous records if true.
          type: boolean
        total_count:
          description: Total number of records.
          type: integer
          format: int32
    TableType:
      title: TableType
      description: YugabyteDB table type.
      type: string
      enum:
      - YQL_TABLE_TYPE
      - REDIS_TABLE_TYPE
      - PGSQL_TABLE_TYPE
      - TRANSACTION_STATUS_TABLE_TYPE
    BackupRegionLocation:
      title: BackupRegionLocation
      description: Per-region backup storage location.
      type: object
      properties:
        region:
          description: Cloud region name.
          type: string
          readOnly: true
        location:
          description: Backup storage location path or URI.
          type: string
          readOnly: true
        host_base:
          description: Host base path for the backup location.
          type: string
          readOnly: true
    BackupPointInTimeRestoreWindow:
      title: BackupPointInTimeRestoreWindow
      description: Point-in-time restore window for a keyspace backup.
      type: object
      properties:
        timestamp_retention_window_start_millis:
          description: Start of the PITR retention window, in milliseconds since epoch.
          type: integer
          format: int64
          readOnly: true
        timestamp_retention_window_end_millis:
          description: End of the PITR retention window, in milliseconds since epoch.
          type: integer
          format: int64
          readOnly: true
    BackupKeyspaceTables:
      title: BackupKeyspaceTables
      description: Keyspace and table selection included in a backup.
      type: object
      properties:
        keyspace:
          description: Keyspace or namespace name.
          type: string
          readOnly: true
        all_tables:
          description: Whether all tables in the keyspace are included.
          type: boolean
          readOnly: true
        tables_list:
          description: Table names included in the backup.
          type: array
          items:
            type: string
          readOnly: true
        table_uuid_list:
          description: Table UUIDs included in the backup.
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
        backup_size_in_bytes:
          description: Backup size for this keyspace, in bytes.
          type: integer
          format: int64
          readOnly: true
        default_location:
          description: Default storage location for this keyspace backup.
          type: string
          readOnly: true
        per_region_locations:
          description: Per-region storage locations for this keyspace backup.
          type: array
          items:
            $ref: '#/components/schemas/BackupRegionLocation'
          readOnly: true
        backup_point_in_time_restore_window:
          description: Point-in-time restore window for this keyspace backup.
          $ref: '#/components/schemas/BackupPointInTimeRestoreWindow'
    BackupSpec:
      title: BackupSpec
      description: 'User-provided and configuration attributes for a universe backup.

        '
      type: object
      properties:
        customer_uuid:
          description: Customer UUID that owns the backup.
          type: string
          format: uuid
        universe_uuid:
          description: Universe UUID that was backed up.
          type: string
          format: uuid
        universe_name:
          description: Universe name at backup time.
          type: string
        schedule_uuid:
          description: Backup schedule UUID, when created by a schedule.
          type: string
          format: uuid
        schedule_name:
          description: Backup schedule name, when created by a schedule.
          type: string
        backup_type:
          description: Table type for the backup.
          $ref: '#/components/schemas/TableType'
        category:
          description: Backup implementation category.
          type: string
          enum:
          - YB_BACKUP_SCRIPT
          - YB_CONTROLLER
        storage_config_type:
          description: Storage provider type for the backup.
          type: string
          enum:
          - S3
          - NFS
          - AZ
          - GCS
          - OCI
          - FILE
        is_full_backup:
          description: Whether this is a full backup rather than incremental.
          type: boolean
        on_demand:
          description: True when the backup was not created by a schedule.
          type: boolean
        use_tablespaces:
          description: Whether tablespaces were included in the backup.
          type: boolean
        use_roles:
          description: Whether database roles were included in the backup.
          type: boolean
        expiry_time:
          description: Time when the backup expires.
          type: string
          format: date-time
        expiry_time_unit:
          description: Unit used for backup expiry configuration.
          type: string
          enum:
          - NanoSeconds
          - MicroSeconds
          - MilliSeconds
          - Seconds
          - Minutes
          - Hours
          - Days
          - Months
          - Years
        keyspace_tables:
          description: Keyspaces and tables included in the backup.
          type: array
          items:
            $ref: '#/components/schemas/BackupKeyspaceTables'
    BackupInfo:
      title: BackupInfo
      description: System-generated backup metadata and status.
      type: object
      properties:
        uuid:
          description: Backup UUID.
          type: string
          format: uuid
          readOnly: true
        base_backup_uuid:
          description: Base backup UUID for incremental chains.
          type: string
          format: uuid
          readOnly: true
        state:
          description: Current backup state.
          $ref: '#/components/schemas/BackupState'
          readOnly: true
        storage_config_uuid:
          description: Storage config UUID used for the backup.
          type: string
          format: uuid
          readOnly: true
        kms_config_uuid:
          description: KMS config UUID used to encrypt the backup.
          type: string
          format: uuid
          readOnly: true
        task_uuid:
          description: Task UUID for the backup operation.
          type: string
          format: uuid
          readOnly: true
        create_time:
          description: Time when the backup was created.
          type: string
          format: date-time
          readOnly: true
        update_time:
          description: Time when the backup was last updated.
          type: string
          format: date-time
          readOnly: true
        completion_time:
          description: Time when the backup completed.
          type: string
          format: date-time
          readOnly: true
        total_backup_size_in_bytes:
          description: Total backup size, in bytes.
          type: integer
          format: int64
          readOnly: true
        sse:
          description: Whether server-side encryption is enabled for the backup.
          type: boolean
          readOnly: true
        table_by_table_backup:
          description: Whether the backup was taken table by table.
          type: boolean
          readOnly: true
        has_incremental_backups:
          description: Whether incremental backups exist for this backup chain.
          type: boolean
          readOnly: true
        last_incremental_backup_time:
          description: Time of the most recent incremental backup in the chain.
          type: string
          format: date-time
          readOnly: true
        last_backup_state:
          description: State of the most recent backup in the incremental chain.
          $ref: '#/components/schemas/BackupState'
          readOnly: true
        is_storage_config_present:
          description: Whether the storage config still exists.
          type: boolean
          readOnly: true
        is_universe_present:
          description: Whether the source universe still exists.
          type: boolean
          readOnly: true
        full_chain_size_in_bytes:
          description: Total size of the full backup chain, in bytes.
          type: integer
          format: int64
          readOnly: true
    Backup:
      title: Backup
      description: Universe backup resource.
      type: object
      properties:
        spec:
          $ref: '#/components/schemas/BackupSpec'
        info:
          $ref: '#/components/schemas/BackupInfo'
    BackupPagedResp:
      title: BackupPagedResp
      description: Paged list response for universe backups.
      type: object
      x-data-container: PaginationResp
      x-data-item: Backup
      x-data-entities-description: Universe backups for this page.
      allOf:
      - $ref: '#/components/schemas/PaginationResp'
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Backup'
          description: Universe backups for this page.
    IncrementalBackupPagedQuerySpec:
      title: IncrementalBackupPagedQuerySpec
      description: 'Paged list of backups in an incremental backup chain.

        Rows are ordered by create time. The order is descending by default.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/PaginationSpec'
    IncrementalBackupPagedResp:
      title: IncrementalBackupPagedResp
      description: Paged list response for backups in an incremental backup chain.
      type: object
      x-data-container: PaginationResp
      x-data-item: Backup
      x-data-entities-description: Backups in the incremental chain for this page.
      allOf:
      - $ref: '#/components/schemas/PaginationResp'
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Backup'
          description: Backups in the incremental chain for this page.
    GflagMetadata:
      title: GflagMetadata
      description: Metadata for Gflags of YB Controller.
      type: object
      properties:
        name:
          description: The name of the flag.
          type: string
        meaning:
          description: A brief description of what the flag does.
          type: string
        default:
          description: The default value of the flag.
          type: string
        type:
          description: The data type of the flag.
          type: string
    ContinuousBackupInfo:
      title: ContinuousBackupInfo
      description: 'ContinuousBackupInfo


        These are read-only system generated properties of a continuous backup configuration.
        Returned as part of the Continuous Backup resource.

        '
      type: object
      required:
      - uuid
      properties:
        uuid:
          description: UUID of the Continuous Backup Config
          type: string
          format: uuid
          example: f33e3c9b-75ab-4c30-80ad-cba85646ea39
          readOnly: true
        storage_location:
          description: bucket or directory where backups are stored
          type: string
          example: s3://backup_storage_path/YBA_1.2.3.4
          readOnly: true
        last_backup:
          description: time of last backup stored
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
          readOnly: true
    TimeUnitType:
      title: TimeUnitType
      description: 'TimeUnitType


        Time units that correspond to TimeUnit.java enum. Used for variable frequencies.

        '
      type: string
      enum:
      - NANOSECONDS
      - MICROSECONDS
      - MILLISECONDS
      - SECONDS
      - MINUTES
      - HOURS
      - DAYS
      - MONTHS
      - YEARS
    ContinuousBackupSpec:
      title: ContinuousBackupSpec
      description: 'ContinuousBackupSpec


        User specification for a continuous backup of YBA. All these properties can
        be edited.

        '
      type: object
      required:
      - backup_dir
      - frequency
      - frequency_time_unit
      - storage_config_uuid
      properties:
        storage_config_uuid:
          description: UUID of the storage config to use
          type: string
          format: uuid
          example: f33e3c9b-75ab-4c30-80ad-cba85646ea39
          readOnly: false
        frequency:
          description: Interval between two backups.
          type: integer
          format: int64
        frequency_time_unit:
          description: 'The time unit for the interval between backups. Must be SECONDS
            or larger; NANOSECONDS, MICROSECONDS, and MILLISECONDS are rejected.

            '
          allOf:
          - $ref: '#/components/schemas/TimeUnitType'
        num_backups:
          description: The number of historical backups to retain in the storage bucket.
          type: integer
          format: int32
          default: 5
        backup_dir:
          description: The name of the directory in the storage config to use for
            YBA backups.
          type: string
          example: yba_backups
    ContinuousBackup:
      title: ContinuousBackup
      description: 'ContinuousBackup


        Continuous Backup object which contains the info for a configuration.

        '
      type: object
      properties:
        info:
          $ref: '#/components/schemas/ContinuousBackupInfo'
        spec:
          $ref: '#/components/schemas/ContinuousBackupSpec'
    ContinuousRestoreSpec:
      title: ContinuousRestoreSpec
      description: 'ContinuousRestoreSpec


        Continuous Backup Restore time properties. Used to Restore from continuous
        backup configuration.

        '
      type: object
      required:
      - backup_dir
      - storage_config_uuid
      properties:
        storage_config_uuid:
          description: UUID of the storage config to use
          type: string
          format: uuid
          example: f33e3c9b-75ab-4c30-80ad-cba85646ea39
          readOnly: false
        backup_dir:
          description: The name of the directory to restore the most recent back from.
          type: string
          example: YBA.1.2.3.4
    YBATask:
      title: YBATask
      description: 'YBATask


        YugabyteDB Anywhere Task object is used to represent a task that is being
        executed on a resource. This Task object can be polled for progress and status
        of the task. This object is returned as a response to most of the YugabyteDB
        Anywhere API calls.

        '
      type: object
      properties:
        resource_uuid:
          description: UUID of the resource being modified by the task
          type: string
          format: uuid
          example: f33e3c9b-75ab-4c30-80ad-cba85646ea39
          readOnly: true
        task_uuid:
          description: Task UUID
          type: string
          format: uuid
          example: 89a46d52-4edd-4736-922a-35177a0b990c
          readOnly: true
    CustomerConfigPagedQuerySpec:
      title: CustomerConfigPagedQuerySpec
      description: 'Paged list of customer configurations (storage, alerts, call-home,
        password policy, etc.)

        for a customer. Rows are ordered by config name (case-insensitive), then UUID.
        The order is ascending by default.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/PaginationSpec'
    CustomerConfigSpec:
      title: CustomerConfigSpec
      description: 'User-provided customer configuration.

        Payload shape depends on `type` and `name`.

        '
      type: object
      properties:
        config_name:
          description: Configuration name.
          type: string
          example: production-storage
        type:
          description: Configuration category (storage, alerts, call-home, password
            policy, etc.).
          type: string
          enum:
          - STORAGE
          - ALERTS
          - CALLHOME
          - PASSWORD_POLICY
        name:
          description: Configuration key or subtype within the category.
          type: string
          example: preferences
        data:
          description: Masked configuration payload (opaque structure depends on type/name).
          type: object
          additionalProperties: true
    CustomerConfigInfo:
      title: CustomerConfigInfo
      description: 'System-generated customer configuration metadata.

        '
      type: object
      properties:
        uuid:
          description: Unique identifier of the customer configuration row.
          type: string
          format: uuid
          example: f33e3c9b-75ab-4c30-80ad-cba85646ea39
          readOnly: true
        customer_uuid:
          description: Customer that owns this configuration.
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          readOnly: true
        state:
          description: Lifecycle state of the configuration.
          type: string
          enum:
          - Active
          - QueuedForDeletion
          readOnly: true
        is_kubernetes_operator_controlled:
          description: Whether this configuration is managed by the Kubernetes operator.
          type: boolean
          readOnly: true
    CustomerConfig:
      title: CustomerConfig
      description: 'Customer configuration.


        Contains the user-provided `spec` and system-generated `info`.

        Returned as response payload for customer configuration list APIs.

        '
      type: object
      properties:
        spec:
          $ref: '#/components/schemas/CustomerConfigSpec'
        info:
          $ref: '#/components/schemas/CustomerConfigInfo'
    CustomerConfigPagedResp:
      title: CustomerConfigPagedResp
      description: Paged list response for customer configurations.
      type: object
      x-data-container: PaginationResp
      x-data-item: CustomerConfig
      x-data-entities-description: Customer configurations for this page.
      allOf:
      - $ref: '#/components/schemas/PaginationResp'
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/CustomerConfig'
          description: Customer configurations for this page.
    DrConfigPagedQuerySpec:
      title: DrConfigPagedQuerySpec
      description: 'Paged list of disaster recovery configs for a universe.

        Rows are ordered by config name (case-insensitive), then UUID. The order is
        ascending by default.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/PaginationSpec'
    XClusterTableType:
      title: XClusterTableType
      description: YSQL or YCQL table/namespace type.
      type: string
      enum:
      - UNKNOWN
      - YSQL
      - YCQL
    DrConfigBootstrapBackupParams:
      title: DrConfigBootstrapBackupParams
      description: 'Backup and restore parameters used when bootstrapping a DR config.

        '
      type: object
      required:
      - storage_config_uuid
      properties:
        storage_config_uuid:
          description: Storage configuration UUID for bootstrap backup.
          type: string
          format: uuid
        parallelism:
          description: 'Number of concurrent commands used by yb_backup (not YBC)
            on nodes over SSH.

            '
          type: integer
          format: int32
          default: 8
          minimum: 1
    DrConfigBootstrapParams:
      title: DrConfigBootstrapParams
      description: 'Bootstrap flow parameters for a DR config, including backup/restore
        settings.

        '
      type: object
      required:
      - backup_request_params
      properties:
        backup_request_params:
          description: Parameters used to run bootstrap backup and restore.
          $ref: '#/components/schemas/DrConfigBootstrapBackupParams'
    DrConfigWebhook:
      title: DrConfigWebhook
      description: Webhook registered on a DR config.
      type: object
      properties:
        uuid:
          description: Webhook UUID.
          type: string
          format: uuid
          readOnly: true
        url:
          description: Webhook URL.
          type: string
          example: https://example.com/hooks/dr
    DrConfigSpec:
      title: DrConfigSpec
      description: 'User-provided disaster recovery configuration.

        Defines replication topology, scope, and optional PITR and webhook settings.

        '
      type: object
      required:
      - name
      - primary_universe_uuid
      - dr_replica_universe_uuid
      - table_type
      - type
      properties:
        name:
          description: Disaster recovery config name.
          type: string
          example: dr-prod-to-dr-replica
        primary_universe_uuid:
          description: UUID of the primary (source) universe.
          type: string
          format: uuid
          example: f33e3c9b-75ab-4c30-80ad-cba85646ea39
        dr_replica_universe_uuid:
          description: UUID of the DR replica (target) universe.
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        table_type:
          description: Type of tables being replicated.
          $ref: '#/components/schemas/XClusterTableType'
        type:
          description: DR config type.
          type: string
          enum:
          - BASIC
          - TXN
          - DB
          - AUTO_DDL
        bootstrap_params:
          description: Bootstrap backup parameters for the DR config.
          $ref: '#/components/schemas/DrConfigBootstrapParams'
        pitr_retention_period_sec:
          description: PITR retention period in seconds for the DR config.
          type: integer
          format: int64
        pitr_snapshot_interval_sec:
          description: PITR snapshot interval in seconds for the DR config.
          type: integer
          format: int64
        tables:
          description: Table IDs included in replication for transaction-scoped (Txn)
            DR configs.
          type: array
          items:
            type: string
        dbs:
          description: Database (namespace) IDs included in replication for DB-scoped
            DR configs.
