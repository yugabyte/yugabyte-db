      properties:
        component_name:
          description: 'Logical component name; used as output file label.

            Must be a single file name of up to 128 characters from [A-Za-z0-9._-].

            '
          type: string
        keyspace:
          description: Optional keyspace for ycqlsh -k.
          type: string
        queries:
          description: 'YCQL statements to execute (each runs as ycqlsh -e).

            Support bundles are read-only, so each entry must be a single statement
            beginning

            with SELECT, DESCRIBE, DESC, SHOW or LIST (case-insensitive). Entries
            holding more

            than one statement are rejected.

            '
          type: array
          items:
            type: string
          minItems: 1
        output_file_name:
          description: 'Output file name written under the per-node bundle directory.

            Must be a single file name of up to 128 characters from [A-Za-z0-9._-].

            '
          type: string
        timeout_secs:
          description: Command timeout in seconds.
          type: integer
          format: int64
    YbAdminComponentSpec:
      title: YbAdminComponentSpec
      description: Spec driving the node-level YbAdminComponent.
      type: object
      properties:
        component_name:
          description: 'Logical component name; used as output file label.

            Must be a single file name of up to 128 characters from [A-Za-z0-9._-].

            '
          type: string
        yb_admin_commands:
          description: 'yb-admin subcommands to run, each executed separately (e.g.
            list_tables).

            Support bundles only run read-only subcommands, so anything that mutates
            cluster

            state is rejected. Operators can add to the allowed set through the

            yb.support_bundle.extra_yb_admin_commands runtime config.

            '
          type: array
          items:
            type: string
          minItems: 1
        yb_admin_args:
          description: Additional arguments after the subcommand.
          type: array
          items:
            type: string
        output_file_name:
          description: 'Output file name written under the per-node bundle directory.

            Must be a single file name of up to 128 characters from [A-Za-z0-9._-].

            '
          type: string
        timeout_secs:
          description: Command timeout in seconds.
          type: integer
          format: int64
    YbaComponentSpec:
      title: YbaComponentSpec
      description: Spec driving the global-level YBAComponent (local script execution
        on the YBA host).
      type: object
      properties:
        component_name:
          description: 'Logical component name; used as a label/sub-directory.

            Must be a single file name of up to 128 characters from [A-Za-z0-9._-].

            '
          type: string
        script_path:
          description: 'Path on the YBA host to the script file to execute locally.

            Must resolve to one of the shipped support bundle scripts, node_utils.sh
            or

            yba_utils.sh, under the platform devops directory. A relative path is
            resolved

            against that directory. Any other path is rejected.

            '
          type: string
        params:
          description: Arguments appended after the script (entrypoint + flags).
          type: array
          items:
            type: string
        remote_tar_path:
          description: 'Path on the YBA host where the script writes the tar before
            it is untarred.

            Must be an absolute path without ''..'', built only from letters, digits,
            ''.'', ''_'',

            ''-'', ''/'' and the ${nodeName} / ${bundleUuid} tokens.

            '
          type: string
        linux_user:
          description: 'Ignored for local YBA execution; accepted for API parity with
            node-level specs.

            It is still validated, so only yugabyte is accepted when set.

            '
          type: string
        timeout_secs:
          description: Script execution timeout in seconds.
          type: integer
          format: int64
    PrometheusMetricsFormat:
      title: PrometheusMetricsFormat
      description: Serialization format for a Prometheus or Perf Advisor metrics dump.
      type: string
      enum:
      - PROMQL_JSON
      - PROM_CHUNK
    PromExportType:
      title: PromExportType
      description: 'How to export Prometheus metrics: PROMQL (query_range) or REMOTE_READ.'
      type: string
      enum:
      - PROMQL
      - REMOTE_READ
    PrometheusMetricsType:
      title: PrometheusMetricsType
      description: Prometheus export to include in a support bundle metrics dump.
      type: string
      enum:
      - MASTER_EXPORT
      - NODE_EXPORT
      - PLATFORM
      - PROMETHEUS
      - TSERVER_EXPORT
      - CQL_EXPORT
      - YSQL_EXPORT
      - KUBERNETES
      x-enum-varnames:
      - PROMETHEUS_METRICS_MASTER_EXPORT
      - PROMETHEUS_METRICS_NODE_EXPORT
      - PROMETHEUS_METRICS_PLATFORM
      - PROMETHEUS_METRICS_PROMETHEUS
      - PROMETHEUS_METRICS_TSERVER_EXPORT
      - PROMETHEUS_METRICS_CQL_EXPORT
      - PROMETHEUS_METRICS_YSQL_EXPORT
      - PROMETHEUS_METRICS_KUBERNETES
    SupportBundleCreateSpec:
      title: SupportBundleCreateSpec
      description: 'Support bundle collection request.


        Differs from `SupportBundleSpec` in that it carries input-only knobs that
        are resolved

        server side and not persisted with the bundle.

        '
      type: object
      required:
      - components
      properties:
        components:
          description: 'List of components to be included in the support bundle. On
            Kubernetes universes the server

            drops what a yb-master / yb-tserver pod cannot produce (see the component
            spec fields below),

            and a component type is dropped once every one of its sub-components has
            been dropped. The

            persisted `SupportBundleSpec` and the bundle''s manifest name only what
            was kept. Rejected with

            a 400 when nothing collectable remains. K8sInfo is dropped on non-Kubernetes
            universes.

            '
          items:
            $ref: '#/components/schemas/SupportBundleComponentType'
          type: array
        start_date:
          description: Start date to filter logs from. Defaults to 24 hours before
            end_date.
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
        end_date:
          description: End date to filter logs till. Defaults to now.
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
        node_names:
          description: 'Names of the universe nodes to collect node-level components
            from. When omitted or empty,

            every node in the universe is considered. Global-level components (PrometheusMetrics,

            YbaMetadata, TabletReport, ClusterConfig, PerfAdvisor, K8sInfo, ApplicationLogs)
            are collected once for the

            universe and are not scoped by this list. Rejected with a 400 when none
            of the given names

            exist in the universe; names that do not exist are ignored when at least
            one matches. Not

            applicable to YBA-only support bundles.

            '
          type: array
          items:
            type: string
          example:
          - yb-15-universe-n1
          - yb-15-universe-n2
        files_component_specs:
          description: 'Specs driving the generic node-level FilesComponent. Required
            when components contains

            FilesComponent. On Kubernetes universes the SystemLogs and NodeAgent specs
            are dropped, since

            a pod has neither the host''s /var/log nor a node agent, and the YbcLogs
            spec is collected from

            tserver pods only.

            '
          type: array
          items:
            $ref: '#/components/schemas/FilesComponentSpec'
        bash_component_specs:
          description: 'Specs driving the node-level BashComponent. Required when
            components contains BashComponent.

            On Kubernetes universes the collect_cdc_state and collect_threadz_memz_rpcz_stats
            specs are

            collected from tserver pods only, and collect_heap_snapshot skips its
            tserver endpoints on a

            master pod.

            '
          type: array
          items:
            $ref: '#/components/schemas/BashComponentSpec'
        ysql_component_specs:
          description: 'Specs driving the node-level YSQLComponent. Required when
            components contains YSQLComponent.

            Collected from tserver pods only on Kubernetes universes.

            '
          type: array
          items:
            $ref: '#/components/schemas/YSQLComponentSpec'
        ycql_component_specs:
          description: 'Specs driving the node-level YCQLComponent. Required when
            components contains YCQLComponent.

            Collected from tserver pods only on Kubernetes universes.

            '
          type: array
          items:
            $ref: '#/components/schemas/YCQLComponentSpec'
        yb_admin_component_specs:
          description: Specs driving the node-level YbAdminComponent. Required when
            components contains YbAdminComponent.
          type: array
          items:
            $ref: '#/components/schemas/YbAdminComponentSpec'
        yba_component_specs:
          description: Specs driving the global-level YBAComponent. Required when
            components contains YBAComponent.
          type: array
          items:
            $ref: '#/components/schemas/YbaComponentSpec'
        filter_pg_audit_logs:
          description: Specifies if Postgres audit logs should be filtered out when
            collecting universe logs.
          type: boolean
        max_core_file_size:
          description: Max size in bytes of the recent collected cores (if any).
          type: integer
          format: int64
        max_num_recent_cores:
          description: Max number of the most recent cores to collect (if any).
          type: integer
          format: int32
        pa_dump_start_date:
          description: Start date to filter Perf Advisor data.
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
        pa_dump_end_date:
          description: End date to filter Perf Advisor data.
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
        pa_metrics_format:
          description: Specifies Perf Advisor dump metrics format.
          $ref: '#/components/schemas/PrometheusMetricsFormat'
        prom_dump_down_sample:
          description: Whether to downsample Prometheus remote-read export data points.
          type: boolean
        prom_dump_start_date:
          description: Start date to filter prometheus metrics from.
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
        prom_dump_end_date:
          description: End date to filter prometheus metrics till.
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
        prom_export_type:
          description: How to export Prometheus metrics.
          $ref: '#/components/schemas/PromExportType'
        prom_metrics_format:
          description: Format for Prometheus remote read export.
          $ref: '#/components/schemas/PrometheusMetricsFormat'
        prom_queries:
          description: Map of query names to custom PromQL queries to collect in promdump.
          type: object
          additionalProperties:
            type: string
        prometheus_metrics_types:
          description: 'List of exports to be included in the prometheus dump. NODE_EXPORT
            is dropped on Kubernetes

            universes, where node_exporter is not scraped.

            '
          type: array
          items:
            $ref: '#/components/schemas/PrometheusMetricsType'
        batch_duration_prom_dump_mins:
          description: Batch duration for the prometheus dump (in minutes).
          type: integer
          format: int32
        step_prom_dump_secs:
          description: Metrics downsample step (in seconds) for the prometheus dump.
          type: integer
          format: int32
    SupportBundlePagedQuerySpec:
      title: SupportBundlePagedQuerySpec
      description: 'Paged list of support bundles.

        Rows are ordered by creation date, then bundle UUID. The order is ascending
