        access_key_code:
          description: One of the SSH access keys defined in Cloud Provider to be
            configured on nodes VMs. Required for AWS, Azure and GCP Cloud Providers.
          type: string
          example: aws-ssh-key
        aws_instance_profile:
          description: The AWS IAM instance profile ARN to use for the nodes in this
            cluster. Applicable only for nodes on AWS Cloud Provider. If specified,
            YugabyteDB Anywhere will use this instance profile instead of the access
            key.
          type: string
          example: arn:aws:iam::myorg:instance-profile/testco-ec2-role
        image_bundle_uuid:
          description: Image bundle UUID to use for node VM image. Refers to one of
            the image bundles defined in the cloud provider.
          type: string
          format: uuid
          example: 914aa5a8-febc-44ba-9b60-ea3e22127218
        helm_overrides:
          description: Helm overrides for this cluster. Applicable only for a k8s
            cloud provider. Refer https://github.com/yugabyte/charts/blob/master/stable/yugabyte/values.yaml
            for the list of supported overrides.
          type: string
          example: "tserver:\n  resources:\n    requests:\n      cpu: 1\n      memory:\
            \ 1Gi\n    limits:\n      cpu: 2\n      memory: 2Gi\n"
        az_helm_overrides:
          description: Helm overrides per availability zone of this cluster. Applicable
            only if this is a k8s cloud provider. Refer https://github.com/yugabyte/charts/blob/master/stable/yugabyte/values.yaml
            for the list of supported overrides.
          additionalProperties:
            type: string
    ClusterStorageType:
      title: ClusterStorageType
      description: Storage type used for this instance, if this is a aws (IO1, GP2,
        GP3), gcp (Scratch, Persistent, Hyperdisk_Balanced, Hyperdisk_Extreme) or
        azu (StandardSSD_LRS, Premium_LRS, PremiumV2_LRS, UltraSSD_LRS) or oci (OCI_BALANCED,
        OCI_HIGHERPERFORMANCE, OCI_LOWERCOST) cluster.
      type: string
      enum:
      - IO1
      - IO2
      - GP2
      - GP3
      - Scratch
      - Persistent
      - Hyperdisk_Balanced
      - Hyperdisk_Extreme
      - StandardSSD_LRS
      - PremiumV2_LRS
      - Premium_LRS
      - UltraSSD_LRS
      - OCI_BALANCED
      - OCI_HIGHERPERFORMANCE
      - OCI_LOWERCOST
      - Local
    CloudVolumeEncryption:
      title: CloudVolumeEncryption
      description: Volume encryption settings for cloud volumes (currently AWS EBS
        volumes only)
      type: object
      properties:
        enable_volume_encryption:
          description: To enable volume encryption or not
          type: boolean
          default: false
        kms_config_uuid:
          description: KMS config UUID to be used for volume encryption
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
    ClusterStorageBase:
      title: ClusterStorageBase
      description: Storage volume properties. All fields are optional so this schema
        can describe partial overrides (for example per-AZ). Part of PerProcessNodeSpec.
      type: object
      properties:
        volume_size:
          description: The size of each volume in each instance. Could be modified
            in payload for /resize_node API call
          type: integer
          format: int32
        num_volumes:
          description: Number of volumes to be mounted on this instance at the default
            path
          type: integer
          format: int32
        mount_points:
          description: Comma-separated list of mount points for the volumes in each
            instance. Required for an onprem cluster.
          type: string
        storage_class:
          description: Name of the storage class, if this is a kubernetes cluster
          type: string
        storage_type:
          $ref: '#/components/schemas/ClusterStorageType'
        disk_iops:
          description: Desired IOPS for the volumes mounted on this aws, gcp or azu
            instance
          type: integer
          format: int32
        throughput:
          description: Desired throughput for the volumes mounted on this aws, gcp
            or azu instance
          type: integer
          format: int32
        cloud_volume_encryption:
          description: Volume encryption settings for cloud volumes (currently AWS
            EBS volumes only)
          $ref: '#/components/schemas/CloudVolumeEncryption'
    ClusterStorageSpec:
      title: ClusterStorageSpec
      description: Complete storage volume specification used at the cluster (non-override)
        node level. Requires volume_size and num_volumes. Part of ClusterNodeSpec.
      allOf:
      - $ref: '#/components/schemas/ClusterStorageBase'
      - type: object
        required:
        - volume_size
        - num_volumes
    NodeProxyConfig:
      title: NodeProxyConfig
      description: The Proxy Settings for the nodes in the Universe. NodeProxyConfig
        is part of NodeSpec.
      type: object
      properties:
        http_proxy:
          description: The HTTP_PROXY to use
          type: string
          example: http://10.9.131.7:3128
        https_proxy:
          description: The HTTPS_PROXY to use
          type: string
          example: http://10.9.131.7:3128
        no_proxy_list:
          description: The NO_PROXY settings. Should follow cURL no_proxy format
          type: array
          items:
            type: string
          example:
          - 10.150.0.26
          - .amazonaws.com
    K8SNodeResourceSpec:
      title: K8SNodeResourceSpec
      description: 'K8SNodeResourceSpec


        Custom k8s resource spec is used to specify custom cpu and memory requests/limits
        for tserver and master pods of a cluster. Specified as part of ClusterCustomInstanceSpec.

        '
      type: object
      properties:
        cpu_core_count:
          description: Number of CPU cores for tserver/master pods
          type: number
          format: double
          example: 2
          default: 2
          maximum: 100
          minimum: 0.5
        memory_gib:
          description: Memory in GiB for tserver/master pods
          type: number
          format: double
          example: 4
          default: 4
          maximum: 1000
          minimum: 2
    ProviderNodeSpec:
      title: ProviderNodeSpec
      description: Node properties at a specific level in the provider nodes specification
        hierarchy. Part of ProviderRootNodesSpec.
      type: object
      properties:
        instance_type:
          description: Instance type for tserver/master nodes that determines the
            cpu and memory resources.
          type: string
          example: c5.xlarge
        storage_spec:
          $ref: '#/components/schemas/ClusterStorageSpec'
        backup_proxy_config:
          description: Proxy configuration for backup operations on this node. Should
            be set only for tserver configuration
          $ref: '#/components/schemas/NodeProxyConfig'
        k8s_node_resource_spec:
          description: Custom cpu and memory requests/limits for k8s pods.
          $ref: '#/components/schemas/K8SNodeResourceSpec'
    ProviderNodesSpec:
      title: ProviderNodesSpec
      description: Tserver and master node specs at a single level of the provider
        nodes specification hierarchy.
      type: object
      properties:
        tserver_specification:
          description: Node specification for tserver processes.
          $ref: '#/components/schemas/ProviderNodeSpec'
        master_specification:
          description: Node specification for master processes.
          $ref: '#/components/schemas/ProviderNodeSpec'
    ProviderAzNodesSpec:
      title: ProviderAzNodesSpec
      description: Availability-zone-level node specification (leaf of the provider
        nodes specification hierarchy).
      type: object
      allOf:
      - $ref: '#/components/schemas/ProviderNodesSpec'
      - properties:
          az_code:
            description: Availability zone code within the region.
            type: string
        required:
        - az_code
    ProviderRegionNodesSpec:
      title: ProviderRegionNodesSpec
      description: Region-level node specification, optionally containing per-AZ overrides.
      type: object
      allOf:
      - $ref: '#/components/schemas/ProviderNodesSpec'
      - properties:
          region_code:
            description: Region code within the cloud provider.
            type: string
          az_nodes_specs:
            description: Per-availability-zone node specification overrides.
            type: array
            items:
              $ref: '#/components/schemas/ProviderAzNodesSpec'
        required:
        - region_code
    ProviderRootNodesSpec:
      title: ProviderRootNodesSpec
      description: Root-level node specification for a provider, optionally containing
        per-region and per-AZ overrides. Matches ProviderSpecification.nodesSpecs.
      type: object
      allOf:
      - $ref: '#/components/schemas/ProviderNodesSpec'
      - properties:
          region_nodes_specs:
            description: Per-region node specification overrides.
            type: array
            items:
              $ref: '#/components/schemas/ProviderRegionNodesSpec'
    PerProcessNetworking:
      title: PerProcessNetworking
      description: (Place holder for) Network settings that can be overridden per
        tserver or master process for nodes in the cluster. The node instances can
        be onprem nodes, VMs in GCP/AWS/Azure, or pods in k8s. Part of AvailabilityZoneNetworking.
      type: object
    AvailabilityZoneNetworking:
      title: AvailabilityZoneNetworking
      description: Networking properties for each node in the cluster. The settings
        can be configured at top-level for uniform node settings for both tserver
        and master nodes. Granular settings for tserver and master will be honored
        if provided (and dedicated_nodes is true or this is k8s cluster). Part of
        ClusterNetworkingSpec.
      type: object
      properties:
        tserver:
          description: Network properties overridden for tserver nodes of cluster.
          $ref: '#/components/schemas/PerProcessNetworking'
        master:
          description: Network properties overridden for master nodes of cluster.
          $ref: '#/components/schemas/PerProcessNetworking'
        proxy_config:
          $ref: '#/components/schemas/NodeProxyConfig'
    ExposingServiceState:
      title: ExposingServiceState
      description: "Whether to create a load balancer service for this cluster.\n\
        Allowed values are:\n  - NONE: Not explicitly set\n  - EXPOSED: Create a load\
        \ balancer service\n  - UNEXPOSED: Do not create a load balancer service\n"
      type: string
      enum:
      - NONE
      - EXPOSED
      - UNEXPOSED
    ManagedLoadBalancerSpec:
      x-yba-api-visibility: preview
      x-yba-api-since: 2.31.0.0
      title: ManagedLoadBalancerSpec
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2.31.0.0 that could change.</b></p>Load balancers that YBA creates,
        manages and deletes for the cluster. Each enabled kind gives one L4 load balancer
        in every region of the cluster, serving all zones of the region. When set,
        this object must enable at least one load balancer. ClusterInfo.load_balancers
        lists them with their scheme and address. The settings are fixed when the
        universe is created. Part of ClusterNetworkingSpec.'
      type: object
      properties:
        enable_private:
          description: Whether YBA creates a private load balancer in each region.
            Clients in the VPC of the universe, or in a network peered with it, can
            reach it.
          type: boolean
          example: true
          default: false
        enable_public:
          description: Whether YBA creates a public load balancer in each region,
            which clients on the internet can reach. Not supported yet. YBA rejects
            true.
          type: boolean
          example: false
          default: false
    ClusterNetworkingSpec:
      title: ClusterNetworkingSpec
      description: The network settings configured at top-level are uniform settings
        for both tserver and master nodes. Granular settings for tserver and master
        (honoured if dedicated_nodes is true or this is k8s cluster) are available
        for certain network settings. Granular settings can also be overridden per
        Availability Zone. Part of ClusterSpec.
      type: object
      allOf:
      - $ref: '#/components/schemas/AvailabilityZoneNetworking'
      - properties:
          enable_exposing_service:
            description: Whether to create a load balancer service for this cluster.
              Defaults to NONE.
            default: NONE
            allOf:
            - $ref: '#/components/schemas/ExposingServiceState'
          managed_load_balancer:
            description: Load balancers that YBA creates, manages and deletes. Set
              when the universe is created. Do not combine with enable_lb.
            $ref: '#/components/schemas/ManagedLoadBalancerSpec'
            x-yba-api-since: 2.31.0.0
            x-yba-api-visibility: preview
          az_networking:
            description: Granular network settings overridden per Availability Zone
              identified by AZ uuid.
            additionalProperties:
              $ref: '#/components/schemas/AvailabilityZoneNetworking'
    ClusterPerProviderSpec:
      title: ClusterPerProviderSpec
      description: Cloud Provider settings for the cluster. Part of ClusterSpec.
      type: object
      allOf:
      - $ref: '#/components/schemas/ClusterProviderSpec'
      - properties:
          nodes_specs:
            description: Hierarchical node specification for this provider. Matches
              ProviderSpecification.nodesSpecs.
            $ref: '#/components/schemas/ProviderRootNodesSpec'
          networking_spec:
            $ref: '#/components/schemas/ClusterNetworkingSpec'
          instance_tags:
            description: A map of strings representing a set of Tags and Values to
              apply on nodes in the aws/gcp/azu cloud. See https://docs.yugabyte.com/preview/yugabyte-platform/manage-deployments/instance-tags/.
            type: object
            additionalProperties:
              type: string
    ClusterPerProcessNodeSpec:
      title: ClusterPerProcessNodeSpec
      description: Instance settings for cluster-level (non-override) node specs.
        Storage requires volume_size and num_volumes. Part of ClusterNodeSpec.
      type: object
      properties:
        instance_type:
          description: Instance type for tserver/master nodes of cluster that determines
            the cpu and memory resources.
          type: string
          example: c5.xlarge
        storage_spec:
          $ref: '#/components/schemas/ClusterStorageSpec'
    PerProcessNodeSpec:
      title: PerProcessNodeSpec
      description: Instance settings for nodes, including partial overrides. Storage
        fields are all optional. Part of AvailabilityZoneNodeSpec.
      type: object
      properties:
        instance_type:
          description: Instance type for tserver/master nodes of cluster that determines
            the cpu and memory resources.
          type: string
          example: c5.xlarge
        storage_spec:
          $ref: '#/components/schemas/ClusterStorageBase'
    AvailabilityZoneNodeSpec:
      title: AvailabilityZoneNodeSpec
      description: Properties for each node in the cluster, including per-AZ overrides
        where storage may be partial. The settings can be configured at top-level
        for uniform node settings for both tserver and master nodes. Granular settings
        for tserver and master will be honored if provided (and dedicated_nodes is
        true or this is k8s cluster). Part of ClusterNodeSpec.
      type: object
      allOf:
      - $ref: '#/components/schemas/PerProcessNodeSpec'
      - properties:
          tserver:
            description: Instance spec for tserver nodes of cluster.
            $ref: '#/components/schemas/PerProcessNodeSpec'
          master:
            description: Instance spec for master nodes of cluster
            $ref: '#/components/schemas/PerProcessNodeSpec'
    ClusterNodeSpec:
      title: ClusterNodeSpec
      description: Node settings (like CPU / memory) for each node in the cluster.
        The node settings configured at top-level are uniform settings for both tserver
        and master nodes and require complete storage_spec (volume_size and num_volumes).
        Granular settings for tserver and master (honoured if dedicated_nodes is true
        or this is k8s cluster) are available for certain node properties. Granular
        settings can also be overridden per Availability Zone with partial storage.
        This is part of ClusterSpec.
      type: object
      allOf:
      - $ref: '#/components/schemas/ClusterPerProcessNodeSpec'
      - properties:
          tserver:
            description: Instance spec for tserver nodes of cluster.
            $ref: '#/components/schemas/ClusterPerProcessNodeSpec'
          master:
            description: Instance spec for master nodes of cluster
            $ref: '#/components/schemas/ClusterPerProcessNodeSpec'
          dedicated_nodes:
            description: 'Deprecated: use dedicated_nodes on ClusterSpec / ClusterEditSpec
              / ClusterAddSpec. Whether to run tserver and master processes in dedicated
              nodes in this cluster.'
            type: boolean
            example: false
            deprecated: true
          k8s_master_resource_spec:
            description: Used only for a k8s Universe. Required for k8s Universe if
              instance_type is not specified. Sets custom cpu and memory requests/limits
              for master pods of a cluster.
            $ref: '#/components/schemas/K8SNodeResourceSpec'
          k8s_tserver_resource_spec:
            description: Used only for a k8s Universe. Required for k8s Universe if
              instance_type is not specified. Sets custom cpu and memory requests/limits
              for tserver pods of a cluster.
            $ref: '#/components/schemas/K8SNodeResourceSpec'
          az_node_spec:
            description: 'Granular node settings overridden per Availability Zone
              identified by AZ uuid.

              When provided, this map fully replaces existing AZ node overrides; omit
              the field to

              leave them unchanged. An empty map clears all AZ node overrides.

              '
            additionalProperties:
              $ref: '#/components/schemas/AvailabilityZoneNodeSpec'
    PlacementAZ:
      title: PlacementAZ
      description: YBA Placement Availability Zone within Placement Region. Part of
        PlacementRegion.
      type: object
      required:
      - uuid
      - name
      - replication_factor
      - num_nodes_in_az
      properties:
        uuid:
          description: The AZ id
          type: string
          format: uuid
        name:
          description: The AZ name
          type: string
        replication_factor:
          description: The minimum number of copies of data we should place into this
            AZ.
          type: integer
          format: int32
        subnet:
          description: The subnet in the AZ.
          type: string
        secondary_subnet:
          description: The secondary subnet in the AZ.
          type: string
        num_nodes_in_az:
          description: Number of nodes in each AZ.
          type: integer
          format: int32
        leader_affinity:
          description: Affinitizes raft leaders to this AZ.
          type: boolean
        leader_preference:
          description: Priority of zone (for leaders placement). Values have to be
            contiguous non-negative integers. Zero means non-prioritized. Multiple
            zones can have the same value. A lower value indicates higher zone priority.
          type: integer
          format: int32
        lb_name:
          description: The Load Balancer id.
          type: string
    PlacementRegion:
      title: PlacementRegion
      description: YBA Placement Region. Part of PlacementCloud.
      type: object
      required:
      - uuid
      - code
      - az_list
      properties:
        uuid:
          description: The region provider id.
          type: string
          format: uuid
        code:
          description: The actual provider given region code.
          type: string
        name:
          description: The region name.
          type: string
        az_list:
          description: The list of AZs inside this region into which we want to place
            data.
          type: array
          items:
            $ref: '#/components/schemas/PlacementAZ'
        lb_fqdn:
          description: The Load Balancer FQDN.
          type: string
    PlacementCloud:
      title: PlacementCloud
      description: YBA Placement Cloud. Part of ClusterPlacementSpec.
      type: object
      required:
      - uuid
      - code
      - region_list
      properties:
        uuid:
          description: The cloud provider id.
          type: string
          format: uuid
        code:
          description: The cloud provider code.
          type: string
        region_list:
          description: The list of region in this cloud we want to place data in.
          type: array
          items:
            $ref: '#/components/schemas/PlacementRegion'
        default_region:
          description: <b style="color:#ff0000">Deprecated since YBA version 2025.2.0.0.</b></p>UUID
            of default region. For universes with more AZs than RF, the default placement
            for user tables will be RF AZs in the default region. This is commonly
            encountered in geo-partitioning use cases. Deprecated, replaced with default
            partition.
          type: string
          format: uuid
          x-yba-api-since: 2025.2.0.0
          x-yba-api-visibility: deprecated
          deprecated: true
        masters_in_default_region:
          description: <b style="color:#ff0000">Deprecated since YBA version 2025.2.0.0.</b></p>Whether
            to place all masters in the default region. Defaults to true.
          type: boolean
          example: true
          default: true
          x-yba-api-since: 2025.2.0.0
          x-yba-api-visibility: deprecated
          deprecated: true
    ClusterPlacementSpec:
      title: ClusterPlacementSpec
      description: 'Data Placement Specification for the cluster. Part of ClusterSpec.


        Note that this is optional to configure. YugabyteDB Anywhere will automatically
        place the data based on the available resources. If this data placement is
        configured, then YugabyteDB Anywhere will use this as a "hint" and the data
        will be placed based on this configuration on a best-effort basis.

        '
      type: object
      required:
      - cloud_list
      properties:
        cloud_list:
          type: array
          items:
            $ref: '#/components/schemas/PlacementCloud'
    ClusterPartitionSpec:
      title: ClusterPartitionSpec
      description: Cluster Partition specification. Part of ClusterSpec, ClusterAddSpec
        and ClusterEditSpec. Future substitute for placement_spec. Cluster should
        contain one or more geo partitions (one of them should be default partition).
        Readonly replicas now can have only single partition.
      type: object
      required:
      - placement
      - default_partition
      - replication_factor
      properties:
        uuid:
          description: System generated partition uuid used to lookup corresponding
            GeoPartitionSpec. This is not a user input.
          type: string
          format: uuid
          example: 19ebde21-d537-47dc-8fab-3edc243c6f68
          readOnly: true
        name:
          description: The name of geo partition
          type: string
        default_partition:
          description: Whether the partition is default (all masters are put only
            into this partition)
          type: boolean
          example: false
        replication_factor:
          description: The replication factor for the partition.
          type: integer
          format: int32
        tablespace_name:
          description: The name of corresponding tablespace.
          type: string
        placement:
          $ref: '#/components/schemas/ClusterPlacementSpec'
    AvailabilityZoneGFlags:
      title: AvailabilityZoneGFlags
      description: GFlags for tserver and master. Part of ClusterGFlags.
      type: object
      properties:
        tserver:
          description: GFlags applied on TServer process
          additionalProperties:
            type: string
        master:
          description: GFlags applied on Master process
          additionalProperties:
            type: string
    ClusterGFlags:
      title: ClusterGFlags
      description: GFlags for a single cluster of a YugabyteDB Universe. Used as part
        of ClusterSpec at Universe create time, and as part of UniverseEditGFlags
        to edit GFlags for a Universe.
      type: object
      allOf:
      - $ref: '#/components/schemas/AvailabilityZoneGFlags'
      - properties:
          az_gflags:
            description: GFlags per availability zone uuid
            type: object
            additionalProperties:
              $ref: '#/components/schemas/AvailabilityZoneGFlags'
    ClusterSpec:
      title: ClusterSpec
      description: Universe Cluster Spec. Part of UniverseSpec.
      type: object
      required:
      - cluster_type
      - num_nodes
      properties:
        uuid:
          description: System generated cluster uuid used to lookup corresponding
            ClusterInfo. This is not a user input.
          type: string
          format: uuid
          example: 19ebde21-d537-47dc-8fab-3edc243c6f68
          readOnly: true
        cluster_type:
          description: Cluster type can be one of PRIMARY, ASYNC (for ReadOnly), ADDON
          type: string
          example: PRIMARY
          enum:
          - PRIMARY
          - ASYNC
          - ADDON
        num_nodes:
          description: The number of nodes (tservers) to provision in this cluster
          type: integer
          format: int32
          example: 3
          minimum: 1
        replication_factor:
          description: The number of copies of data to maintain in this cluster. Defaults
            to 3.
          type: integer
          format: int32
          example: 3
          default: 3
          minimum: 1
        dedicated_nodes:
          description: 'Whether to run tserver and master processes in dedicated nodes
            in this cluster.

            Prefer this over deprecated node_spec.dedicated_nodes. If omitted, falls
            back to

            node_spec.dedicated_nodes when present; otherwise defaults to false on
            create and

            leaves the existing value unchanged on edit.

            '
          type: boolean
          example: false
        provider_specs:
          description: Per-provider specs for multicloud clusters. For single-provider
            clusters use provider_spec and node_spec.
          type: array
          items:
            $ref: '#/components/schemas/ClusterPerProviderSpec'
        node_spec:
          $ref: '#/components/schemas/ClusterNodeSpec'
        networking_spec:
          $ref: '#/components/schemas/ClusterNetworkingSpec'
        provider_spec:
          $ref: '#/components/schemas/ClusterProviderSpec'
        placement_spec:
          description: Overall placement for cluster.
          $ref: '#/components/schemas/ClusterPlacementSpec'
        partitions_spec:
          type: array
          items:
            $ref: '#/components/schemas/ClusterPartitionSpec'
        instance_tags:
          description: A map of strings representing a set of Tags and Values to apply
            on nodes in the aws/gcp/azu cloud. See https://docs.yugabyte.com/preview/yugabyte-platform/manage-deployments/instance-tags/.
          type: object
          additionalProperties:
            type: string
        audit_log_config:
          $ref: '#/components/schemas/AuditLogConfig'
        query_log_config:
          $ref: '#/components/schemas/QueryLogConfig'
        metrics_export_config:
          $ref: '#/components/schemas/MetricsExportConfig'
        gflags:
          description: The set of user defined gflags for tserver and master processes
            running on nodes. Can be changed using API /customers/:cUUID/universes/:uniUUID/upgrade/gflags.
          $ref: '#/components/schemas/ClusterGFlags'
          nullable: true
    UniverseSpec:
      title: UniverseSpec
      description: These are user configured properties of a Universe. Part of create
        Universe request payload. Returned as part of a Universe resource.
      type: object
      required:
      - name
      - yb_software_version
      - clusters
      properties:
        name:
          description: Name of the Universe
          type: string
          example: my-yb-universe
          readOnly: false
        yb_software_version:
          description: The YugabyteDB software version to install. This can be upgraded
            using API /customers/:cUUID/universes/:uniUUID/upgrade/software
          type: string
          example: 2024.2.0.0-b600
        encryption_at_rest_spec:
          $ref: '#/components/schemas/EncryptionAtRestSpec'
        encryption_in_transit_spec:
          $ref: '#/components/schemas/EncryptionInTransitSpec'
        ysql:
          $ref: '#/components/schemas/YSQLSpec'
        ycql:
          $ref: '#/components/schemas/YCQLSpec'
        use_time_sync:
          description: Whether to use time sync services like chrony on DB nodes of
            this cluster
          type: boolean
          example: false
        networking_spec:
          $ref: '#/components/schemas/UniverseNetworkingSpec'
        universe_settings:
          $ref: '#/components/schemas/UniverseSettings'
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterSpec'
          maxItems: 16
          minItems: 1
    UserSpec:
      title: UserSpec
      description: A user associated with a customer
      type: object
      required:
      - email
      properties:
        email:
          description: User email address
          type: string
          example: username1@example.com
        role:
          description: User role
          type: string
          enum:
          - ConnectOnly
          - ReadOnly
          - BackupAdmin
          - Admin
          - SuperAdmin
    UserInfo:
      title: UserInfo
      description: System generated properties of a User. Part of User.
      type: object
      properties:
        uuid:
          description: User UUID
          type: string
          format: uuid
          readOnly: true
        user_type:
          description: User Type
          type: string
          enum:
          - local
          - ldap
          - oidc
        creation_date:
          description: User creation date
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
          readOnly: true
        customer_uuid:
          description: Customer account to which this User belongs to
          type: string
          format: uuid
          readOnly: true
        is_primary:
          description: True if the user is the primary local user in this YBA
          type: boolean
          readOnly: true
        ldap_specified_role:
          description: Whether the user's role is inherited from LDAP
          type: boolean
        timezone:
          description: User timezone
          type: string
    User:
      title: User
      description: 'User


        Contains the user provided `spec` and system generated `info` of a User. Returned
        as response payload for a GET request on a User. Also part of User property
        in UniverseInfo.

        '
      type: object
      properties:
        spec:
          $ref: '#/components/schemas/UserSpec'
        info:
          $ref: '#/components/schemas/UserInfo'
    EncryptionAtRestInfo:
      title: EncryptionAtRestInfo
      description: Encryption At Rest specification for the Universe. Part of UniverseInfo.
      type: object
      readOnly: true
      properties:
        encryption_at_rest_status:
          description: Whether a Universe is currently encrypted at rest
          type: boolean
    YbSoftwareDetails:
      title: YbSoftwareDetails
      description: 'YbSoftwareDetails


        YugabyteDB Software Details object is used to represent the software version
        of YugabyteDB running on a Universe.

        '
      type: object
      properties:
        yb_software_version:
          description: YugabyteDB Software version installed in DB nodes of this Universe
          type: string
          example: 2024.2.0.0-b6
    AllowedTasksOnFailure:
      title: AllowedTasksOnFailure
      description: When the last Universe operation has failed, YB Anywhere prevents
        most Universe operations until this failure is first fixed. This property
        lists all the allowed tasks on such a Universe. Part of UniverseInfo.
      type: object
      properties:
        restricted:
          description: Whether the Universe is restricted from performing other operations
          type: boolean
          readOnly: true
        task_types:
          description: If restricted, this is the list of task types that are allowed
            to be retried on this Universe. This  is in the format <taskType>_<targetResource>.
            Eg. Create_Backup, Delete_Universe, etc.
          type: array
          items:
            type: string
          readOnly: true
          uniqueItems: true
    XClusterInfo:
      title: XClusterInfo
      description: XCluster related states in this universe. Part of UniverseInfo.
      type: object
      properties:
        source_root_cert_dir_path:
          description: The value of certs_for_cdc_dir gflag
          type: string
          example: /mnt/disk0/yw-data/yugabyte-tls
        source_x_cluster_configs:
          description: The source universe's xcluster replication relationships
          type: array
          items:
            type: string
            format: uuid
        target_x_cluster_configs:
          description: The target universe's xcluster replication relationships
          type: array
          items:
            type: string
            format: uuid
    ManagedLoadBalancerScheme:
      x-yba-api-visibility: preview
      x-yba-api-since: 2.31.0.0
      title: ManagedLoadBalancerScheme
      description: "<b style=\"color:#FFA500\">WARNING: This is a preview API in YBA\
        \ version 2.31.0.0 that could change.</b></p>Who can reach a load balancer\
        \ that YBA manages.\n  - PRIVATE: clients in the VPC of the universe, or in\
        \ a network peered with it.\n  - PUBLIC: clients on the internet. YBA does\
        \ not create public load balancers yet and rejects ManagedLoadBalancerSpec.enable_public.\n"
      type: string
      enum:
      - PRIVATE
      - PUBLIC
      example: PRIVATE
    ManagedLoadBalancerInfo:
      x-yba-api-visibility: preview
      x-yba-api-since: 2.31.0.0
      title: ManagedLoadBalancerInfo
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2.31.0.0 that could change.</b></p>A load balancer that YBA created
        for the cluster. It serves a set of availability zones in one region. Part
        of ClusterInfo.'
      type: object
      properties:
        scheme:
          description: Who can reach the load balancer. Today always PRIVATE.
          allOf:
          - $ref: '#/components/schemas/ManagedLoadBalancerScheme'
          readOnly: true
        region_code:
          description: The region of the load balancer.
          type: string
          example: us-west-2
          readOnly: true
        az_uuids:
          description: The availability zones that the load balancer serves, as the
            UUIDs of the provider zones. Today every zone of the region. A later release
            can give a region several load balancers that each serve some of its zones.
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
        name:
          description: The name of the load balancer in the cloud.
          type: string
          example: lbi-h6uf6zcxc5cwfm74fsld6zvpuy
          readOnly: true
        address:
          description: The address that the cloud gives the load balancer. A DNS name
            on AWS, an IP address on GCP and Azure. Empty until the load balancer
            is created.
          type: string
          example: lbi-h6uf6zcxc5cwfm74fsld6zvpuy-0123456789abcdef.elb.us-west-2.amazonaws.com
          readOnly: true
    ClusterInfo:
      title: ClusterInfo
      description: Universe Cluster Info. Part of the Response payload UniverseInfo
        that describes system generated properties of a Cluster.
      type: object
      properties:
        uuid:
          description: cluster uuid
          type: string
          format: uuid
          example: 19ebde21-d537-47dc-8fab-3edc243c6f68
        load_balancers:
          description: '<b style="color:#FFA500">WARNING: This is a preview API in
            YBA version 2.31.0.0 that could change.</b></p>The load balancers that
            YBA created for this cluster.'
          type: array
          items:
            $ref: '#/components/schemas/ManagedLoadBalancerInfo'
          readOnly: true
          x-yba-api-since: 2.31.0.0
          x-yba-api-visibility: preview
    CloudSpecificInfo:
