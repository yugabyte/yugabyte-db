        '400':
          description: Invalid input
        '500':
          description: Server error
      security:
      - apiKeyAuth: []
      x-yba-api-audit:
        auditTargetType: Universe
        auditTargetId: uniUUID.toString()
        auditActionType: Update
        taskUuid: obj.getTaskUuid()
      x-yba-api-authz:
      - requiredPermission:
          resourceType: universe
          action: UPDATE
        resourceLocation:
          path: UNIVERSES
          sourceType: ENDPOINT
        checkOnlyPermission: false
