components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      name: X-AUTH-YW-API-TOKEN
      in: header
  schemas:
    ResourceDefinition:
      title: ResourceDefinition
      description: Resource definition containing the resource type and resource set.
      type: object
      required:
      - resource_type
      - allow_all
      properties:
        resource_type:
          description: Resource Type
          type: string
          enum:
          - UNIVERSE
          - ROLE
          - USER
          - OTHER
        allow_all:
          description: Select all resources (including future resources)
          type: boolean
        resource_uuid_set:
          description: Set of resource UUIDs
          type: array
          items:
            type: string
            format: uuid
          default: []
    ResourceGroup:
      title: ResourceGroup
      description: Resource group definition for the role. Only applicable for custom
        roles.
      type: object
      required:
      - resource_definition_set
      properties:
        resource_definition_set:
          type: array
          items:
            $ref: '#/components/schemas/ResourceDefinition'
    RoleResourceDefinition:
      title: RoleResourceDefinition.
      description: Defines the association of Role to Resource Groups. Part of AuthGroupToRolesMapping.
      type: object
      required:
      - role_uuid
      properties:
        role_uuid:
          description: UUID of the role to attach resource group to.
          type: string
          format: uuid
        resource_group:
          $ref: '#/components/schemas/ResourceGroup'
    AuthGroupToRolesMapping:
      title: AuthGroupToRolesMapping
      description: 'AuthGroupToRolesMapping


        Group mapping properties. This is used to map LDAP and OIDC group to YBA roles.

        '
      type: object
      required:
      - group_identifier
      - type
      - role_resource_definitions
      properties:
        group_identifier:
          description: Group name incase of OIDC. Group DN incase of LDAP.
          type: string
        uuid:
          description: System generated UUID for this group mapping.
          type: string
          format: uuid
          readOnly: true
        type:
          description: The type of group. Can be either LDAP/OIDC.
          type: string
          enum:
          - LDAP
          - OIDC
        creation_date:
          description: Group mapping creation date.
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
          readOnly: true
        role_resource_definitions:
          type: array
          items:
            $ref: '#/components/schemas/RoleResourceDefinition'
    GflagMetadata:
      title: GflagMetadata
      description: Metadata for Gflags of YB Controller.
      type: object
      properties:
        name:
          description: The name of the flag.
          type: string
        meaning:
          description: A brief description of what the flag does.
          type: string
        default:
          description: The default value of the flag.
          type: string
        type:
          description: The data type of the flag.
          type: string
    ContinuousBackupInfo:
      title: ContinuousBackupInfo
      description: 'ContinuousBackupInfo


        These are read-only system generated properties of a continuous backup configuration.
        Returned as part of the Continuous Backup resource.

        '
      type: object
      required:
      - uuid
      properties:
        uuid:
          description: UUID of the Continuous Backup Config
          type: string
          format: uuid
          example: f33e3c9b-75ab-4c30-80ad-cba85646ea39
          readOnly: true
        storage_location:
          description: bucket or directory where backups are stored
          type: string
          example: s3://backup_storage_path/YBA_1.2.3.4
          readOnly: true
        last_backup:
          description: time of last backup stored
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
          readOnly: true
    TimeUnitType:
      title: TimeUnitType
      description: 'TimeUnitType


        Time units that correspond to TimeUnit.java enum. Used for variable frequencies.

        '
      type: string
      enum:
      - NANOSECONDS
      - MICROSECONDS
      - MILLISECONDS
      - SECONDS
      - MINUTES
      - HOURS
      - DAYS
      - MONTHS
      - YEARS
    ContinuousBackupSpec:
      title: ContinuousBackupSpec
      description: 'ContinuousBackupSpec


        User specification for a continuous backup of YBA. All these properties can
        be edited.

        '
      type: object
      required:
      - backup_dir
      - frequency
      - frequency_time_unit
      - storage_config_uuid
      properties:
        storage_config_uuid:
          description: UUID of the storage config to use
          type: string
          format: uuid
          example: f33e3c9b-75ab-4c30-80ad-cba85646ea39
          readOnly: false
        frequency:
          description: Interval between two backups.
          type: integer
          format: int64
        frequency_time_unit:
          description: The time unit for the interval between backups.
          $ref: '#/components/schemas/TimeUnitType'
        num_backups:
          description: The number of historical backups to retain in the storage bucket.
          type: integer
          format: int32
          default: 5
        backup_dir:
          description: The name of the directory in the storage config to use for
            YBA backups.
          type: string
          example: yba_backups
    ContinuousBackup:
      title: ContinuousBackup
      description: 'ContinuousBackup


        Continuous Backup object which contains the info for a configuration.

        '
      type: object
      properties:
        info:
          $ref: '#/components/schemas/ContinuousBackupInfo'
        spec:
          $ref: '#/components/schemas/ContinuousBackupSpec'
    ContinuousRestoreSpec:
      title: ContinuousRestoreSpec
      description: 'ContinuousRestoreSpec


        Continuous Backup Restore time properties. Used to Restore from continuous
        backup configuration.

        '
      type: object
      required:
      - backup_dir
      - storage_config_uuid
      properties:
        storage_config_uuid:
          description: UUID of the storage config to use
          type: string
          format: uuid
          example: f33e3c9b-75ab-4c30-80ad-cba85646ea39
          readOnly: false
        backup_dir:
          description: The name of the directory to restore the most recent back from.
          type: string
          example: YBA.1.2.3.4
    YBATask:
      title: YBATask
      description: 'YBATask


        YugabyteDB Anywhere Task object is used to represent a task that is being
        executed on a resource. This Task object can be polled for progress and status
        of the task. This object is returned as a response to most of the YugabyteDB
        Anywhere API calls.

        '
      type: object
      properties:
        resource_uuid:
          description: UUID of the resource being modified by the task
          type: string
          format: uuid
          example: f33e3c9b-75ab-4c30-80ad-cba85646ea39
          readOnly: true
        task_uuid:
          description: Task UUID
          type: string
          format: uuid
          example: 89a46d52-4edd-4736-922a-35177a0b990c
          readOnly: true
    YbaComponent:
      title: YbaComponent
      description: 'Individual YBA components to be backed up

        '
      type: string
      enum:
      - YBA
      - PROMETHEUS
      - RELEASES
    IsolatedBackupCreateSpec:
      title: IsolatedBackupCreateSpec
      description: 'IsolatedBackupCreateSpec


        User provided details to trigger a one time backup of YBA to a particular
        local directory.

        '
      type: object
      required:
      - local_dir
      - components
      properties:
        local_dir:
          description: local directory to store backup
          type: string
          example: /opt/yba_backups
        components:
          description: the components to include in YBA backup
          items:
            $ref: '#/components/schemas/YbaComponent'
          type: array
    IsolatedBackupRestoreSpec:
      title: IsolatedBackupRestoreSpec
      description: 'IsolatedBackupRestoreSpec


        User provided details to trigger a restore of YBA from a local filepath.

        '
      type: object
      required:
      - local_path
      properties:
        local_path:
          description: full path to YBA backup file on host
          type: string
          example: /opt/yba_backups/yba_backup.tar.gz
    JobConfigSpec:
      title: JobConfigSpec
      description: Job config spec for a schedule that is a part of JobScheduleSpec
      type: object
      properties:
        classname:
          description: Class name of the job config.
          type: string
          readOnly: true
        config:
          description: Additional custom configuration.
          type: object
          additionalProperties:
            type: object
      required:
      - classname
    JobScheduleType:
      title: JobScheduleType
      description: 'Job schedule type which is a part of JobScheduleConfigSpec. Fixed
        delay keeps a fixed interval between the end and start of previous and next
        job executions respectively. Fixed rate tries to keep a fixed interval between
        the job execution start times. If a previous job is still running, the next
        job waits.

        '
      type: string
      enum:
      - FIXED_DELAY
      - FIXED_RATE
    JobScheduleConfigSpec:
      title: JobScheduleConfigSpec
      description: Job schedule config spec for a job schedule.
      type: object
      properties:
        disabled:
          description: Disable or enable the job schedule.
          type: boolean
        interval_secs:
          description: Delay interval between two jobs.
          type: integer
          format: int64
        snooze_until:
          description: Time until the job should be snoozed.
          type: string
          format: date-time
          example: '2024-07-25T13:07:18Z'
        type:
          description: Type of the job schedule.
          $ref: '#/components/schemas/JobScheduleType'
      required:
      - disabled
      - interval_secs
      - type
    JobScheduleSpec:
      title: JobScheduleSpec
      description: Spec of a job schedule that is a part of JobSchedule.
      type: object
      properties:
        name:
          description: Job schedule name
          type: string
          readOnly: true
        job_config:
          description: Job config spec
          $ref: '#/components/schemas/JobConfigSpec'
        schedule_config:
          description: Schedule config spec
          $ref: '#/components/schemas/JobScheduleConfigSpec'
      required:
      - name
      - job_config
      - schedule_config
    JobScheduleState:
      title: JobScheduleState
      description: Job schedule state of a schedule that is a part of JobScheduleInfo.
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    JobScheduleInfo:
      title: JobScheduleInfo
      description: Job schedule info which is a part of JobSchedule.
      type: object
      properties:
        created_at:
          description: Creation time
          type: string
          format: date-time
          example: '2024-07-25T13:07:18Z'
          readOnly: true
        customer_uuid:
          description: Customer UUID
          type: string
          format: uuid
          readOnly: true
        execution_count:
          description: Total execution count
          type: integer
          format: int64
          readOnly: true
        failed_count:
          description: Total failed count
          type: integer
          format: int64
          readOnly: true
        last_end_time:
          description: Last end time
          type: string
          format: date-time
          example: '2024-07-25T13:07:18Z'
          readOnly: true
        last_job_instance_uuid:
          description: Last job instance UUID
          type: string
          format: uuid
          readOnly: true
        last_start_time:
          description: Last start time
          type: string
          format: date-time
          example: '2024-07-25T13:07:18Z'
          readOnly: true
        next_start_time:
          description: Next start time
          type: string
          format: date-time
          example: '2024-07-25T13:07:18Z'
          readOnly: true
        state:
          description: Job schedule state
          $ref: '#/components/schemas/JobScheduleState'
          readOnly: true
        updated_at:
          description: Updated time
          type: string
          format: date-time
          example: '2024-07-25T13:07:18Z'
          readOnly: true
        uuid:
          description: Job schedule UUID
          type: string
          format: uuid
          readOnly: true
    JobSchedule:
      title: JobSchedule
      description: Job schedule which contains the spec and execution info for a schedule.
      type: object
      properties:
        spec:
          $ref: '#/components/schemas/JobScheduleSpec'
        info:
          $ref: '#/components/schemas/JobScheduleInfo'
    JobScheduleUpdateSpec:
      title: JobScheduleUpdateSpec
      description: 'JobScheduleUpdateSpec


        Request payload for updating schedule config of a job.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/JobScheduleConfigSpec'
    PaginationSpec:
      title: PaginationSpec
      description: Pagination spec in page API requests.
      type: object
      properties:
        offset:
          description: Start offset of the records.
          type: integer
          format: int32
        limit:
          description: Maximum number of records to be fetched.
          type: integer
          format: int32
        direction:
          description: Sort order of the records.
          type: string
          enum:
          - ASC
          - DESC
    JobScheduleApiFilter:
      title: JobScheduleApiFilter
      description: API filter for job schedule that is a part of JobSchedulePagedQuerySpec.
      type: object
      properties:
        config_class:
          description: Filter by config class of the job.
          type: string
        enabled_only:
          description: Filter out disabled job schedules if true.
          type: boolean
        name_regex:
          description: Filter by name regex.
          type: string
        next_start_window_secs:
          description: Filter by next start time window from now.
          type: integer
          format: int64
        type:
          description: Filter by type of the job schedule.
          $ref: '#/components/schemas/JobScheduleType'
    JobSchedulePagedQuerySpec:
      title: JobSchedulePagedQuerySpec
      description: 'JobSchedulePagedQuerySpec


        Paged API query params for job schedule.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/PaginationSpec'
      properties:
        filter:
          $ref: '#/components/schemas/JobScheduleApiFilter'
        sort_by:
          description: Sort fields of the records.
          type: string
          enum:
          - uuid
          - name
          - enabled
          - state
          - type
          - nextStartTime
          - createdAt
          - updatedAt
    PaginationResp:
      title: PaginationResp
      description: Pagination information in page API responses.
      type: object
      properties:
        has_next:
          description: There are more next records if true.
          type: boolean
        has_prev:
          description: There are more previous records if true.
          type: boolean
        total_count:
          description: Total number of records.
          type: integer
          format: int32
    JobSchedulePagedResp:
      title: JobSchedulePagedResp
      description: Paged API query response for job schedule.
      type: object
      allOf:
      - $ref: '#/components/schemas/PaginationResp'
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/JobSchedule'
    JobInstanceState:
      title: JobInstanceState
      description: State of a job instance that is a part of JobInstance.
      type: string
      enum:
      - FAILED
      - RUNNING
      - SUCCESS
      - SCHEDULED
      - SKIPPED
    JobInstanceApiFilter:
      title: JobInstanceApiFilter
      description: API filter for job instance that is a part of JobInstancePagedQuerySpec.
      type: object
      properties:
        start_window_secs:
          description: Filter by start time falling within the time window from now.
          type: integer
          format: int64
        state:
          description: Filter by state of the job instance.
          $ref: '#/components/schemas/JobInstanceState'
    JobInstancePagedQuerySpec:
      title: JobInstancePagedQuerySpec
      description: 'JobInstancePagedQuerySpec


        Paged API query params for job instance.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/PaginationSpec'
      properties:
        filter:
          $ref: '#/components/schemas/JobInstanceApiFilter'
        sort_by:
          description: Sort fields of the records.
          type: string
          enum:
          - uuid
          - jobScheduleUuid
          - state
          - createdAt
          - startTime
          - endTime
    JobInstanceInfo:
      title: JobInstanceInfo
      description: Job instance info representing the execution instance of a JobSchedule.
      type: object
      properties:
        created_at:
          description: Creation time
          type: string
          format: date-time
          example: '2024-07-25T13:07:18Z'
          readOnly: true
        end_time:
          description: End time
          type: string
          format: date-time
          example: '2024-07-25T13:07:18Z'
          readOnly: true
        job_schedule_uuid:
          description: Job schedule UUID
          type: string
          format: uuid
          readOnly: true
        start_time:
          description: Start time
          type: string
          format: date-time
          example: '2024-07-25T13:07:18Z'
          readOnly: true
        state:
          description: Job instance state
          $ref: '#/components/schemas/JobInstanceState'
          readOnly: true
        uuid:
          description: Job instance UUID
          type: string
          format: uuid
          readOnly: true
    JobInstancePagedResp:
      title: JobInstancePagedResp
      description: Paged API query response for job instance.
      type: object
      allOf:
      - $ref: '#/components/schemas/PaginationResp'
      properties:
        entities:
          type: array
          items:
            $ref: '#/components/schemas/JobInstanceInfo'
    JobScheduleSnoozeSpec:
      title: JobScheduleSnoozeSpec
      description: 'JobScheduleSnoozeSpec


        Request payload to put off the next schedule by snooze secs.

        '
      type: object
      properties:
        snooze_secs:
          description: Schedule the next job after the sum of snooze time and interval
            from now.
          type: integer
          format: int64
      required:
      - snooze_secs
    TelemetryProviderTypeInfo:
      type: object
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2025.2.0.0 that could change.</b></p>Telemetry Provider Type Information'
      x-yba-api-since: 2025.2.0.0
      x-yba-api-visibility: preview
      properties:
        provider_type:
          description: Provider type name
          type: string
          example: DATA_DOG
          enum:
          - DATA_DOG
          - SPLUNK
          - AWS_CLOUDWATCH
          - GCP_CLOUD_MONITORING
          - LOKI
          - DYNATRACE
          - S3
          - OTLP
        is_allowed_for_logs:
          description: Whether this provider supports logs export
          type: boolean
          example: true
        is_allowed_for_metrics:
          description: Whether this provider supports metrics export
          type: boolean
          example: true
    EncryptionAtRestSpec:
      title: EncryptionAtRestSpec
      description: Encryption At Rest specification for the Universe. Part of UniverseSpec.
      type: object
      properties:
        kms_config_uuid:
          description: The KMS Configuration associated with the encryption keys being
            used on this Universe
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
    EncryptionInTransitSpec:
      title: EncryptionInTransitSpec
      description: Specification of node-to-node and client-to-node TLS encryption.
        Part of UniverseSpec.
      type: object
      properties:
        enable_node_to_node_encrypt:
          description: Whether to enable encryption for communication among DB nodes
          type: boolean
          example: false
        enable_client_to_node_encrypt:
          description: Whether to enable encryption for client connection to DB nodes
          type: boolean
          example: false
        root_ca:
          description: The UUID of the rootCA to be used to generate node certificates
            and facilitate TLS communication between database nodes.
          type: string
          format: uuid
          example: fce99806-03f0-4b17-9483-297ccfaa368d
        client_root_ca:
          description: The UUID of the clientRootCA to be used to generate client
            certificates and facilitate TLS communication between server and client.
            Can be set to same as root_CA.
          type: string
          format: uuid
          example: 1711b83b-af74-416b-84b9-e9f66b532c82
    YSQLSpec:
      title: YSQLSpec
      description: YSQL Spec for the Universe. Part of UniverseSpec.
      type: object
      properties:
        enable:
          description: Whether to enable YSQL API on this Universe
          type: boolean
          example: true
        enable_auth:
          description: Whether to enable authentication to access YSQL on this Universe
          type: boolean
          example: false
        password:
          description: Password to set for the YSQL database in this universe. Required
            if enable_auth is true.
          type: string
          format: password
          example: password
          writeOnly: true
        enable_connection_pooling:
          description: Use built-in YSQL service for maximizing the number of simultaneous
            connections to database.
          type: boolean
          example: true
          default: false
    YCQLSpec:
      title: YCQLSpec
      description: YCQL Spec for the Universe. Part of UniverseSpec.
      type: object
      properties:
        enable:
          description: Whether to enable YCQL API on this Universe
          type: boolean
          example: true
        enable_auth:
          description: Whether to enable authentication to access YCQL on this Universe
          type: boolean
          example: false
        password:
          description: Password to set for the YCQL database in this universe. Required
            if enable_auth is true.
          type: string
          format: password
          example: password
          writeOnly: true
    CommunicationPortsSpec:
      title: CommunicationPortsSpec
      description: Communication Ports used by nodes of this Universe. Part of UniverseNetworkingSpec.
      type: object
      readOnly: false
      properties:
        master_http_port:
          description: Master table HTTP port
          type: integer
          format: int32
          example: 7000
          default: 7000
        master_rpc_port:
          description: Master table RCP port
          type: integer
          format: int32
          example: 7100
          default: 7100
        node_exporter_port:
          description: Node exporter port
          type: integer
          format: int32
          example: 9300
          default: 9300
        otel_collector_metrics_port:
          description: Otel Collector metrics port
          type: integer
          format: int32
          example: 8889
          default: 8889
        redis_server_http_port:
          description: Redis HTTP port
          type: integer
          format: int32
          example: 11000
          default: 11000
        redis_server_rpc_port:
          description: Redis RPC port
          type: integer
          format: int32
          example: 6379
          default: 6379
        tserver_http_port:
          description: Tablet server HTTP port
          type: integer
          format: int32
          example: 9000
          default: 9000
        tserver_rpc_port:
          description: Tablet server RPC port
          type: integer
          format: int32
          example: 9100
          default: 9100
        yb_controller_http_port:
          description: Yb controller HTTP port
          type: integer
          format: int32
          example: 14000
          default: 14000
        yb_controller_rpc_port:
          description: Yb controller RPC port
          type: integer
          format: int32
          example: 18018
          default: 18018
        yql_server_http_port:
          description: YQL HTTP port
          type: integer
          format: int32
          example: 12000
          default: 12000
        yql_server_rpc_port:
          description: YQL RPC port
          type: integer
          format: int32
          example: 9042
          default: 9042
        ysql_server_http_port:
          description: YSQL HTTP port
          type: integer
          format: int32
          example: 13000
          default: 13000
        ysql_server_rpc_port:
          description: YSQL RPC port
          type: integer
          format: int32
          example: 5433
          default: 5433
        internal_ysql_server_rpc_port:
          description: Internal YSQL RPC port used when connection pooling is enabled
          type: integer
          format: int32
          example: 6433
          default: 6433
    UniverseNetworkingSpec:
      title: UniverseNetworkingSpec
      description: Networking specification that is used for nodes in this Universe.
        Part of UniverseSpec.
      type: object
      properties:
        communication_ports:
          $ref: '#/components/schemas/CommunicationPortsSpec'
        assign_public_ip:
          description: Whether to assign a public IP for nodes in this Universe.
          type: boolean
          example: true
          default: true
        assign_static_public_ip:
          description: Whether to assign a static public IP for nodes in this Universe.
          type: boolean
          example: false
          default: false
        enable_ipv6:
          description: Whether to enable IPv6 on nodes in this cluster. Defaults to
            false.
          type: boolean
          example: false
    CloudVolumeEncryption:
      title: CloudVolumeEncryption
      description: Volume encryption settings for cloud volumes (currently AWS EBS
        volumes only)
      type: object
      properties:
        enable_volume_encryption:
          description: To enable volume encryption or not
          type: boolean
          default: false
        kms_config_uuid:
          description: KMS config UUID to be used for volume encryption
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
    ClusterStorageSpec:
      title: ClusterStorageSpec
      description: Storage volume specification that is used for tserver nodes in
        this cluster. Part of ClusterSpec, ClusterAddSpec and ClusterEditSpec.
      type: object
      required:
      - volume_size
      - num_volumes
      properties:
        volume_size:
          description: The size of each volume in each instance. Could be modified
            in payload for /resize_node API call
          type: integer
          format: int32
        num_volumes:
          description: Number of volumes to be mounted on this instance at the default
            path
          type: integer
          format: int32
        mount_points:
          description: Comma-separated list of mount points for the volumes in each
            instance. Required for an onprem cluster.
          type: string
        storage_class:
          description: Name of the storage class, if this is a kubernetes cluster
          type: string
        storage_type:
          description: Storage type used for this instance, if this is a aws (IO1,
            GP2, GP3), gcp (Scratch, Persistent, Hyperdisk_Balanced, Hyperdisk_Extreme)
            or azu (StandardSSD_LRS, Premium_LRS, PremiumV2_LRS, UltraSSD_LRS) cluster.
          type: string
          enum:
          - IO1
          - IO2
          - GP2
          - GP3
          - Scratch
          - Persistent
          - Hyperdisk_Balanced
          - Hyperdisk_Extreme
          - StandardSSD_LRS
          - PremiumV2_LRS
          - Premium_LRS
          - UltraSSD_LRS
          - Local
        disk_iops:
          description: Desired IOPS for the volumes mounted on this aws, gcp or azu
            instance
          type: integer
          format: int32
        throughput:
          description: Desired throughput for the volumes mounted on this aws, gcp
            or azu instance
          type: integer
          format: int32
        cloud_volume_encryption:
          description: Volume encryption settings for cloud volumes (currently AWS
            EBS volumes only)
          $ref: '#/components/schemas/CloudVolumeEncryption'
    PerProcessNodeSpec:
      title: PerProcessNodeSpec
      description: Instance settings for each node in the cluster. The instances can
        be onprem nodes, VMs in GCP/AWS/Azure, or pods in k8s. Part of AvailabilityZoneNodeSpec
        and ClusterNodeSpec.
      type: object
      properties:
        instance_type:
          description: Instance type for tserver/master nodes of cluster that determines
            the cpu and memory resources.
          type: string
          example: c5.xlarge
        storage_spec:
          $ref: '#/components/schemas/ClusterStorageSpec'
    AvailabilityZoneNodeSpec:
      title: AvailabilityZoneNodeSpec
      description: Properties for each node in the cluster. The settings can be configured
        at top-level for uniform node settings for both tserver and master nodes.
        Granular settings for tserver and master will be honored if provided (and
        dedicated_nodes is true or this is k8s cluster). Part of ClusterNodeSpec.
      type: object
      allOf:
      - $ref: '#/components/schemas/PerProcessNodeSpec'
      - properties:
          tserver:
            description: Instance spec for tserver nodes of cluster.
            $ref: '#/components/schemas/PerProcessNodeSpec'
          master:
            description: Instance spec for master nodes of cluster
            $ref: '#/components/schemas/PerProcessNodeSpec'
    K8SNodeResourceSpec:
      title: K8SNodeResourceSpec
      description: 'K8SNodeResourceSpec


        Custom k8s resource spec is used to specify custom cpu and memory requests/limits
        for tserver and master pods of a cluster. Specified as part of ClusterCustomInstanceSpec.

        '
      type: object
      properties:
        cpu_core_count:
          description: Number of CPU cores for tserver/master pods
          type: number
          format: double
          example: 2
          default: 2
          maximum: 100
          minimum: 0.5
        memory_gib:
          description: Memory in GiB for tserver/master pods
          type: number
          format: double
          example: 4
          default: 4
          maximum: 1000
          minimum: 2
    ClusterNodeSpec:
      title: ClusterNodeSpec
      description: Node settings (like CPU / memory) for each node in the cluster.
        The node settings configured at top-level are uniform settings for both tserver
        and master nodes. Granular settings for tserver and master (honoured if dedicated_nodes
        is true or this is k8s cluster) are available for certain node properties.
        Granular settings can also be overridden per Availability Zone. This is part
        of ClusterSpec.
      type: object
      allOf:
      - $ref: '#/components/schemas/AvailabilityZoneNodeSpec'
      - properties:
          dedicated_nodes:
            description: Whether to run tserver and master processes in dedicated
              nodes in this cluster. Defaults to false where master and tserver processes
              share the same node.
            type: boolean
            example: false
            default: false
          k8s_master_resource_spec:
            description: Used only for a k8s Universe. Required for k8s Universe if
              instance_type is not specified. Sets custom cpu and memory requests/limits
              for master pods of a cluster.
            $ref: '#/components/schemas/K8SNodeResourceSpec'
          k8s_tserver_resource_spec:
            description: Used only for a k8s Universe. Required for k8s Universe if
              instance_type is not specified. Sets custom cpu and memory requests/limits
              for tserver pods of a cluster.
            $ref: '#/components/schemas/K8SNodeResourceSpec'
          az_node_spec:
            description: Granular node settings overridden per Availability Zone identified
              by AZ uuid.
            additionalProperties:
              $ref: '#/components/schemas/AvailabilityZoneNodeSpec'
    PerProcessNetworking:
      title: PerProcessNetworking
      description: (Place holder for) Network settings that can be overridden per
        tserver or master process for nodes in the cluster. The node instances can
        be onprem nodes, VMs in GCP/AWS/Azure, or pods in k8s. Part of AvailabilityZoneNetworking.
      type: object
    NodeProxyConfig:
      title: NodeProxyConfig
      description: The Proxy Settings for the nodes in the Universe. NodeProxyConfig
        is part of NodeSpec.
      type: object
      properties:
        http_proxy:
          description: The HTTP_PROXY to use
          type: string
          example: http://10.9.131.7:3128
        https_proxy:
          description: The HTTPS_PROXY to use
          type: string
          example: http://10.9.131.7:3128
        no_proxy_list:
          description: The NO_PROXY settings. Should follow cURL no_proxy format
          type: array
          items:
            type: string
          example:
          - 10.150.0.26
          - .amazonaws.com
    AvailabilityZoneNetworking:
      title: AvailabilityZoneNetworking
      description: Networking properties for each node in the cluster. The settings
        can be configured at top-level for uniform node settings for both tserver
        and master nodes. Granular settings for tserver and master will be honored
        if provided (and dedicated_nodes is true or this is k8s cluster). Part of
        ClusterNetworkingSpec.
      type: object
      properties:
        tserver:
          description: Network properties overridden for tserver nodes of cluster.
          $ref: '#/components/schemas/PerProcessNetworking'
        master:
          description: Network properties overridden for master nodes of cluster.
          $ref: '#/components/schemas/PerProcessNetworking'
        proxy_config:
          $ref: '#/components/schemas/NodeProxyConfig'
    ClusterNetworkingSpec:
      title: ClusterNetworkingSpec
      description: The network settings configured at top-level are uniform settings
        for both tserver and master nodes. Granular settings for tserver and master
        (honoured if dedicated_nodes is true or this is k8s cluster) are available
        for certain network settings. Granular settings can also be overridden per
        Availability Zone. Part of ClusterSpec.
      type: object
      allOf:
      - $ref: '#/components/schemas/AvailabilityZoneNetworking'
      - properties:
          enable_exposing_service:
            description: Whether to create a load balancer service for this cluster.
              Defaults to NONE.
            type: string
            default: NONE
            enum:
            - NONE
            - EXPOSED
            - UNEXPOSED
          az_networking:
            description: Granular network settings overridden per Availability Zone
              identified by AZ uuid.
            additionalProperties:
              $ref: '#/components/schemas/AvailabilityZoneNetworking'
    ClusterProviderSpec:
      title: ClusterProviderSpec
      description: Cloud Provider settings for the cluster. Part of ClusterSpec.
      type: object
      required:
      - provider
      properties:
        provider:
          description: Cloud provider UUID
          type: string
          format: uuid
          example: 89a46d52-4edd-4736-922a-35177a0b990c
        region_list:
          description: The list of regions in the cloud provider to place data replicas
          type: array
          items:
            type: string
            format: uuid
        preferred_region:
          description: The region to nominate as the preferred region in a geo-partitioned
            multi-region cluster
          type: string
          format: uuid
        access_key_code:
          description: One of the SSH access keys defined in Cloud Provider to be
            configured on nodes VMs. Required for AWS, Azure and GCP Cloud Providers.
          type: string
          example: aws-ssh-key
        aws_instance_profile:
          description: The AWS IAM instance profile ARN to use for the nodes in this
            cluster. Applicable only for nodes on AWS Cloud Provider. If specified,
            YugabyteDB Anywhere will use this instance profile instead of the access
            key.
          type: string
          example: arn:aws:iam::myorg:instance-profile/testco-ec2-role
        image_bundle_uuid:
          description: Image bundle UUID to use for node VM image. Refers to one of
            the image bundles defined in the cloud provider.
          type: string
          format: uuid
          example: 914aa5a8-febc-44ba-9b60-ea3e22127218
        helm_overrides:
          description: Helm overrides for this cluster. Applicable only for a k8s
            cloud provider. Refer https://github.com/yugabyte/charts/blob/master/stable/yugabyte/values.yaml
            for the list of supported overrides.
          type: string
          example: "tserver:\n  resources:\n    requests:\n      cpu: 1\n      memory:\
            \ 1Gi\n    limits:\n      cpu: 2\n      memory: 2Gi\n"
        az_helm_overrides:
          description: Helm overrides per availability zone of this cluster. Applicable
            only if this is a k8s cloud provider. Refer https://github.com/yugabyte/charts/blob/master/stable/yugabyte/values.yaml
            for the list of supported overrides.
          additionalProperties:
            type: string
    PlacementAZ:
      title: PlacementAZ
      description: YBA Placement Availability Zone within Placement Region. Part of
        PlacementRegion.
      type: object
      properties:
        uuid:
          description: The AZ id
          type: string
          format: uuid
        name:
          description: The AZ name
          type: string
        replication_factor:
          description: The minimum number of copies of data we should place into this
            AZ.
          type: integer
          format: int32
        subnet:
          description: The subnet in the AZ.
          type: string
        secondary_subnet:
          description: The secondary subnet in the AZ.
          type: string
        num_nodes_in_az:
          description: Number of nodes in each AZ.
          type: integer
          format: int32
        leader_affinity:
          description: Affinitizes raft leaders to this AZ.
          type: boolean
        lb_name:
          description: The Load Balancer id.
          type: string
        leader_preference:
          description: Priority of zone (for leaders placement). Values have to be
            contiguous non-negative integers. Zero means non-prioritized. Multiple
            zones can have the same value. A lower value indicates higher zone priority.
          type: integer
          format: int32
    PlacementRegion:
      title: PlacementRegion
      description: YBA Placement Region. Part of PlacementCloud.
      type: object
      properties:
        uuid:
          description: The region provider id.
          type: string
          format: uuid
        code:
          description: The actual provider given region code.
          type: string
        name:
          description: The region name.
          type: string
        az_list:
          description: The list of AZs inside this region into which we want to place
            data.
          type: array
          items:
            $ref: '#/components/schemas/PlacementAZ'
        lb_fqdn:
          description: The Load Balancer FQDN.
          type: string
    PlacementCloud:
      title: PlacementCloud
      description: YBA Placement Cloud. Part of ClusterPlacementSpec.
      type: object
      properties:
        uuid:
          description: The cloud provider id.
          type: string
          format: uuid
        code:
          description: The cloud provider code.
          type: string
        region_list:
          description: The list of region in this cloud we want to place data in.
          type: array
          items:
            $ref: '#/components/schemas/PlacementRegion'
        default_region:
          description: UUID of default region. For universes with more AZs than RF,
            the default placement for user tables will be RF AZs in the default region.
            This is commonly encountered in geo-partitioning use cases.
          type: string
          format: uuid
        masters_in_default_region:
          description: Whether to place all masters in the default region. Defaults
            to true.
          type: boolean
          example: true
          default: true
    ClusterPlacementSpec:
      title: ClusterPlacementSpec
      description: 'Data Placement Specification for the cluster. Part of ClusterSpec.


        Note that this is optional to configure. YugabyteDB Anywhere will automatically
        place the data based on the available resources. If this data placement is
        configured, then YugabyteDB Anywhere will use this as a "hint" and the data
        will be placed based on this configuration on a best-effort basis.

        '
      type: object
      required:
      - cloud_list
      properties:
        cloud_list:
          type: array
          items:
            $ref: '#/components/schemas/PlacementCloud'
    UniverseExporterConfig:
      title: UniverseExporterConfig
      type: object
      description: 'UniverseExporterConfig

        Universe Exporter Config. Base configuration for exporters in the Universe.
        Used for AuditLogConfig, QueryLogConfig, MetricsExportConfig.

        '
      required:
      - exporter_uuid
      properties:
        additional_tags:
          description: Additional tags
          type: object
          additionalProperties:
            type: string
        exporter_uuid:
          description: Exporter uuid
          type: string
          format: uuid
    UniverseLogsExporterConfig:
      title: UniverseLogsExporterConfig
      type: object
      description: 'UniverseLogsExporterConfig

        Universe Logs Exporter Config. Part of AuditLogConfig.

        '
      allOf:
      - $ref: '#/components/schemas/UniverseExporterConfig'
    YCQLAuditConfig:
      title: YCQLAuditConfig
      description: YCQL Audit Logging Configuration. Part of AuditLogConfig.
      type: object
      required:
      - enabled
      - excluded_categories
      - excluded_keyspaces
      - excluded_users
      - included_categories
      - included_keyspaces
      - included_users
      - log_level
      properties:
        enabled:
