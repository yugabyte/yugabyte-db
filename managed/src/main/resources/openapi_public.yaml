    AuditLogConfig:
      title: AuditLogConfig
      description: Audit Log Configuration Specification for the Universe. Part of
        Clusterspec.
      required:
      - universe_logs_exporter_config
      type: object
      properties:
        export_active:
          description: Universe logs export active
          type: boolean
        universe_logs_exporter_config:
          description: Universe logs exporter config
          type: array
          items:
            $ref: '#/components/schemas/UniverseLogsExporterConfig'
        ycql_audit_config:
          description: YCQL audit config
          $ref: '#/components/schemas/YCQLAuditConfig'
        ysql_audit_config:
          description: YSQL audit config
          $ref: '#/components/schemas/YSQLAuditConfig'
    UniverseQueryLogsExporterConfig:
      title: UniverseQueryLogsExporterConfig
      type: object
      description: 'UniverseQueryLogsExporterConfig


        Universe Logs Exporter Config. Part of QueryLogConfig.

        '
      allOf:
      - $ref: '#/components/schemas/UniverseExporterConfig'
      - type: object
        properties:
          send_batch_max_size:
            description: Send batch max size
            type: integer
            format: int32
            default: 1000
          send_batch_size:
            description: Send batch max size
            type: integer
            format: int32
            default: 100
          send_batch_timeout_seconds:
            description: Send batch timeout in seconds
            type: integer
            format: int32
            default: 10
          memory_limit_mib:
            description: Memory limit in MiB for the OpenTelemetry Collector process
              in the config file.
            type: integer
            example: 2048
            default: 2048
          memory_limit_check_interval_seconds:
            description: Check interval in seconds for the MemoryLimiterProcessor.
            type: integer
            example: 10
            default: 10
    YSQLQueryLogConfig:
      title: YSQLQueryLogConfig
      description: YSQL Query Logging Configuration. Part of QueryLogConfig.
      type: object
      required:
      - enabled
      - log_statement
      - log_min_error_statement
      - log_error_verbosity
      - log_duration
      - debug_print_plan
      - log_connections
      - log_disconnections
      - log_min_duration_statement
      properties:
        enabled:
          description: Enabled
          type: boolean
          readOnly: true
        log_statement:
          description: Log statement, controls which SQL statements are logged.
          type: string
          default: NONE
          enum:
          - ALL
          - NONE
          - DDL
          - MOD
        log_min_error_statement:
          description: Log min error statement, controls which SQL statements that
            cause an error condition are recorded.
          type: string
          default: ERROR
          enum:
          - ERROR
        log_error_verbosity:
          description: Log error verbosity, controls the amount of detail written
            in the server log for each message that is logged.
          type: string
          default: DEFAULT
          enum:
          - VERBOSE
          - TERSE
          - DEFAULT
        log_duration:
          description: Log duration, causes the duration of every completed statement
            to be logged
          type: boolean
          default: false
        debug_print_plan:
          description: Debug print plan, these parameters enable various debugging
            output to be emitted. When set, they print the resulting parse tree, the
            query rewriter output, or the execution plan for each executed query.
          type: boolean
          default: false
        log_connections:
          description: Log connections, causes each attempted connection to the server
            to be logged, as well as successful completion of both client authentication
            (if necessary) and authorization
          type: boolean
          default: false
        log_disconnections:
          description: Log disconnections, causes session terminations to be logged.
            The log output provides information similar to log_connections, plus the
            duration of the session.
          type: boolean
          default: false
        log_min_duration_statement:
          description: Log min duration statement, causes the duration of each completed
            statement to be logged if the statement ran for at least the specified
            amount of time.
          type: integer
          format: int32
          default: -1
    QueryLogConfig:
      title: QueryLogConfig
      description: Query Log Configuration Specification for the Universe. Part of
        Clusterspec.
      required:
      - universe_logs_exporter_config
      type: object
      properties:
        export_active:
          description: Universe logs export active
          type: boolean
        universe_logs_exporter_config:
          description: Universe logs exporter config
          type: array
          items:
            $ref: '#/components/schemas/UniverseQueryLogsExporterConfig'
        ysql_query_log_config:
          description: YSQL query log config
          $ref: '#/components/schemas/YSQLQueryLogConfig'
    ScrapeConfigTargetType:
      title: ScrapeConfigTargetType
      description: 'Enum for target types that support metrics export scrape configuration.

        '
      type: string
      enum:
      - MASTER_EXPORT
      - TSERVER_EXPORT
      - YSQL_EXPORT
      - CQL_EXPORT
      - NODE_EXPORT
      - NODE_AGENT_EXPORT
      - OTEL_EXPORT
      example: MASTER_EXPORT
    UniverseMetricsExporterConfig:
      title: UniverseMetricsExporterConfig
      type: object
      description: 'UniverseMetricsExporterConfig

        Individual Metrics Exporter Configuration Specification.

        '
      allOf:
      - $ref: '#/components/schemas/UniverseExporterConfig'
      - type: object
        properties:
          send_batch_max_size:
            description: Maximum batch size for sending metrics. Can be customised
              to each exporter differently.
            type: integer
            example: 1000
            default: 1000
          send_batch_size:
            description: Batch size for sending metrics. Can be customised to each
              exporter differently.
            type: integer
            example: 100
            default: 100
          send_batch_timeout_seconds:
            description: Batch timeout in seconds for sending metrics. Can be customised
              to each exporter differently.
            type: integer
            example: 10
            default: 10
          metrics_prefix:
            description: Custom prefix to be added to all the metrics. Can be customised
              to each exporter differently.
            type: string
            example: ybdb.
            default: ''
          memory_limit_mib:
            description: Memory limit in MiB for the OpenTelemetry Collector process
              in the config file.
            type: integer
            example: 2048
            default: 2048
          memory_limit_check_interval_seconds:
            description: Check interval in seconds for the MemoryLimiterProcessor.
            type: integer
            example: 10
            default: 10
    MetricsExportConfig:
      title: MetricsExportConfig
      description: Metrics Export Configuration Specification for the Universe. Part
        of Clusterspec.
      required:
      - universe_metrics_exporter_config
      type: object
      properties:
        scrape_interval_seconds:
          description: Scrape interval in seconds. Applied on all scrape jobs commonly.
          type: integer
          example: 30
          default: 30
        scrape_timeout_seconds:
          description: Scrape timeout in seconds. Applied on all scrape jobs commonly.
          type: integer
          example: 20
          default: 20
        collection_level:
          description: "The level of metrics collection. Allowed values are:\n  -\
            \ ALL: Collect all available metrics.\n  - NORMAL: Collect standard set\
            \ of metrics.\n  - TABLE_OFF: Disable table level metrics collection.\n\
            \  - MINIMAL: Collect minimal set of metrics.\n  - OFF: Disable metrics\
            \ collection.\n"
          type: string
          example: NORMAL
          default: NORMAL
          enum:
          - ALL
          - NORMAL
          - TABLE_OFF
          - MINIMAL
          - 'OFF'
        scrape_config_targets:
          description: "Set of target types to include in scrape configuration. If\
            \ not specified, all supported target types will be included.\nAllowed\
            \ values are:\n  - MASTER_EXPORT: Master server metrics\n  - TSERVER_EXPORT:\
            \ Tserver metrics  \n  - YSQL_EXPORT: YSQL server metrics\n  - CQL_EXPORT:\
            \ YCQL server metrics\n  - NODE_EXPORT: Node exporter metrics\n  - NODE_AGENT_EXPORT:\
            \ Node agent metrics\n  - OTEL_EXPORT: OpenTelemetry collector internal\
            \ metrics\n"
          type: array
          items:
            $ref: '#/components/schemas/ScrapeConfigTargetType'
          example:
          - MASTER_EXPORT
          - TSERVER_EXPORT
          - YSQL_EXPORT
          - CQL_EXPORT
          - NODE_EXPORT
          - NODE_AGENT_EXPORT
          - OTEL_EXPORT
          default:
          - MASTER_EXPORT
          - TSERVER_EXPORT
          - YSQL_EXPORT
          - CQL_EXPORT
          - NODE_EXPORT
          - NODE_AGENT_EXPORT
          - OTEL_EXPORT
        universe_metrics_exporter_config:
          description: List of universe metrics exporter configurations. If empty,
            no metrics will be sent anywhere.
          type: array
          items:
            $ref: '#/components/schemas/UniverseMetricsExporterConfig'
    AvailabilityZoneGFlags:
