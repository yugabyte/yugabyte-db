            type: object
            properties:
              field:
                description: 'The property the operator has to fix, so a caller can
                  attach the message to the right

                  input.

                  '
                type: string
                example: collectionEndpoint
              ok:
                type: boolean
              message:
                description: What went wrong, written for the operator. Unset when
                  the check passed.
                type: string
                example: The Collection API at https://byoc.cloud.yugabyte.com rejected
                  these credentials
          readOnly: true
