      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2026.1.2.0 that could change.</b></p>Telemetry config. Each property
        is optional.

        Set to null or omit to disable that config. Empty object = disable all.

        '
      properties:
