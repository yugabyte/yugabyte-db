          type: string
          format: uuid
          example: f33e3c9b-75ab-4c30-80ad-cba85646ea39
          readOnly: true
        version:
          description: Universe version
          type: integer
          format: int32
          readOnly: true
        creation_date:
          description: Universe creation date
          type: string
          format: date-time
          example: '2022-12-12T13:07:18Z'
          readOnly: true
        creating_user:
          description: User who created the Universe
          type: object
          $ref: '#/components/schemas/User'
        arch:
          description: CPU Arch of DB nodes.
          type: string
          example: x86_64
          enum:
          - x86_64
          - aarch64
          readOnly: true
        dns_name:
          description: DNS name
          type: string
          example: dbnode1.dev.universe.company.com
          readOnly: true
        ybc_software_version:
          description: YBC Software version installed in DB nodes of this Universe
          type: string
          example: 2.1.0.0-b6
          readOnly: true
        yba_url:
          description: YBAnywhere host name that is managing this Universe
          type: string
          example: yba.dev.company.com
          readOnly: true
        platform_version:
          description: YugabyteDB Anywhere platform software version for this YBA
            instance
          type: string
          example: 2.29.0.0-b0
          readOnly: true
        node_prefix:
          description: A globally unique name generated as a combination of the customer
            id and the universe name. This is used as the prefix of node names in
            the universe. Can be configured at the time of universe creation.
          type: string
          example: yb-dev-universe-name
          readOnly: true
        encryption_at_rest_info:
          $ref: '#/components/schemas/EncryptionAtRestInfo'
        update_in_progress:
          description: Whether a create/edit/destroy intent on the universe is currently
            running.
          type: boolean
          example: false
          readOnly: true
        updating_task:
          description: Type of task which set updateInProgress flag.
          type: string
          example: CreateUniverse
          readOnly: true
        updating_task_uuid:
          description: UUID of task which set updateInProgress flag.
          type: string
          format: uuid
          example: 489a0632-2d6c-460f-b3d3-d8413b8559c0
          readOnly: true
        update_succeeded:
          description: Whether the latest operation on this universe has successfully
            completed. Is updated for each operation on the universe.
          type: boolean
          example: true
          readOnly: true
        previous_task_uuid:
          description: UUID of the last task that will be retried on this Universe
          type: string
          format: uuid
          example: 489a0632-2d6c-460f-b3d3-d8413b8559c0
          readOnly: true
        universe_paused:
          description: Whether the universe is in the paused state
          type: boolean
          example: false
          readOnly: true
        placement_modification_task_uuid:
          description: UUID of last failed task that applied modification to cluster
            state
          type: string
          format: uuid
          example: 18d9e569-5e01-49ef-88a3-eff0804bad4a
          readOnly: true
        software_upgrade_state:
          description: The state of the last YugabyteDB software upgrade operation
            on this universe
          type: string
          example: Ready
          enum:
          - Ready
          - Upgrading
          - UpgradeFailed
          - PreFinalize
          - Finalizing
          - FinalizeFailed
          - RollingBack
          - RollbackFailed
          readOnly: true
        is_software_rollback_allowed:
          description: Whether a rollback of the last YugabyteDB upgrade operation
            is allowed
          type: boolean
          example: true
          readOnly: true
        previous_yb_software_details:
          description: The YugabyteDB software details that was running before the
            last software upgrade operation
          type: object
          $ref: '#/components/schemas/YbSoftwareDetails'
          readOnly: true
        allowed_tasks_on_failure:
          description: '<b style="color:#FFA500">WARNING: This is a preview API in
            YBA version 2024.1.0.0 that could change.</b></p>Allowed tasks when the
            last Universe operation has failed'
          $ref: '#/components/schemas/AllowedTasksOnFailure'
          x-yba-api-since: 2024.1.0.0
          x-yba-api-visibility: preview
        nodes_resize_available:
          description: Set to true if nodes of this Universe can be resized without
            a full move
          type: boolean
          example: true
          readOnly: true
        is_kubernetes_operator_controlled:
          description: Whether this Universe is created and controlled by the Kubernetes
            Operator
          type: boolean
          example: true
          readOnly: true
        x_cluster_info:
          $ref: '#/components/schemas/XClusterInfo'
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterInfo'
          maxItems: 16
          minItems: 1
        node_details_set:
          description: Node details
          type: array
          items:
            $ref: '#/components/schemas/NodeDetails'
        dr_config_uuids_as_source:
          description: UUIDs of DR configs where this universe is the source (primary)
          type: array
          items:
            format: uuid
            type: string
          uniqueItems: true
        dr_config_uuids_as_target:
          description: UUIDs of DR configs where this universe is the target (secondary)
          type: array
          items:
            format: uuid
            type: string
          uniqueItems: true
        resources:
          description: Universe resource details
          $ref: '#/components/schemas/UniverseResourceDetails'
        sample_app_command_txt:
          description: Sample command
          type: string
    Universe:
      title: Universe
      description: 'Universe


        Contains the user provided `spec` and system generated `info` of a Universe.
        Returned as response payload for a GET request on a Universe.

        '
      type: object
      properties:
        spec:
          $ref: '#/components/schemas/UniverseSpec'
        info:
          $ref: '#/components/schemas/UniverseInfo'
    ClusterProviderEditSpec:
      title: ClusterProviderEditSpec
      description: Edit Cloud Provider settings for the cluster. Part of ClusterAddSpec
        and ClusterEditSpec.
      type: object
      required:
      - region_list
      properties:
        region_list:
          description: Edit the list of regions in the cloud provider to place data
            replicas
          type: array
          items:
            type: string
            format: uuid
    ClusterEditSpec:
      title: ClusterEditSpec
      description: Edit Cluster Spec. Part of UniverseEditSpec.
      type: object
      required:
      - uuid
      properties:
        uuid:
          description: The system generated cluster uuid to edit. This can be fetched
            from ClusterInfo.
          type: string
          format: uuid
          example: 19ebde21-d537-47dc-8fab-3edc243c6f68
        num_nodes:
          description: Set the number of nodes (tservers) to provision in this cluster
          type: integer
          format: int32
          example: 3
          minimum: 1
        node_spec:
          $ref: '#/components/schemas/ClusterNodeSpec'
        provider_spec:
          $ref: '#/components/schemas/ClusterProviderEditSpec'
        placement_spec:
          $ref: '#/components/schemas/ClusterPlacementSpec'
        instance_tags:
          description: A map of strings representing a set of Tags and Values to apply
            on nodes in the aws/gcp/azu cloud. See https://docs.yugabyte.com/preview/yugabyte-platform/manage-deployments/instance-tags/.
          type: object
          additionalProperties:
            type: string
    UniverseEditSpec:
      title: UniverseEditSpec
      description: 'UniverseEditSpec


        Request payload to edit an existing Universe.

        Not all properties of a UniverseSpec can be updated.

        This is a partial update. Only the fields that are provided will be updated.

        '
      type: object
      required:
      - clusters
      - expected_universe_version
      properties:
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterEditSpec'
          maxItems: 16
          minItems: 1
        expected_universe_version:
          description: Expected universe version. Set to -1 to ignore version checking.
          type: integer
          format: int32
    UniverseDeleteSpec:
      title: UniverseDeleteSpec
      description: 'UniverseDeleteSpec


        Optional addtional parameters for deleting a universe.

        '
      type: object
      properties:
        is_force_delete:
          description: Whether to force delete the universe
          type: boolean
          example: false
          default: false
        is_delete_backups:
          description: Whether to delete backups associated with the universe
          type: boolean
          example: false
          default: false
        is_delete_associated_certs:
          description: Whether to delete associated Encryption In Transit certificates
          type: boolean
          example: false
          default: false
    UniverseCreateSpec:
      title: UniverseCreateSpec
      description: 'UniverseCreateSpec


        Universe create time properties. This is used to create a new Universe.

        '
      type: object
      required:
      - spec
      - arch
      properties:
        spec:
          $ref: '#/components/schemas/UniverseSpec'
        arch:
          description: CPU Arch of DB nodes.
          type: string
          example: x86_64
          enum:
          - x86_64
          - aarch64
    ClusterAddSpec:
      title: ClusterAddSpec
      description: 'ClusterAddSpec


        Request payload to add a new cluster to an existing YugabyteDB Universe.

        '
      type: object
      required:
      - cluster_type
      - num_nodes
      - node_spec
      - provider_spec
      properties:
        cluster_type:
          description: Cluster type can be one of READ_REPLICA, ADDON
          type: string
          example: READ_REPLICA
          enum:
          - READ_REPLICA
          - ADDON
        num_nodes:
          description: Set the number of nodes (tservers) to provision in this cluster
          type: integer
          format: int32
          example: 3
          minimum: 1
        node_spec:
          $ref: '#/components/schemas/ClusterNodeSpec'
        provider_spec:
          $ref: '#/components/schemas/ClusterProviderEditSpec'
        placement_spec:
          $ref: '#/components/schemas/ClusterPlacementSpec'
        instance_tags:
          description: A map of strings representing a set of Tags and Values to apply
            on nodes in the aws/gcp/azu cloud. See https://docs.yugabyte.com/preview/yugabyte-platform/manage-deployments/instance-tags/.
          type: object
          additionalProperties:
            type: string
        gflags:
          $ref: '#/components/schemas/ClusterGFlags'
    SleepAfterRestartSchema:
      title: Sleep time after restart
      description: Time to wait after restarting a tserver or master process
      properties:
        sleep_after_master_restart_millis:
          description: Applicable for rolling restarts. Time to wait between master
            restarts. Defaults to 180000.
          type: integer
          default: 180000
        sleep_after_tserver_restart_millis:
          description: Applicable for rolling restarts. Time to wait between tserver
            restarts. Defaults to 180000.
          type: integer
          default: 180000
    UniverseUpgradeOptionsAll:
      title: UniverseUpgradeOptionsAll
      description: "UniverseUpgradeOptionsAll\n\nOption on how to handle node reboots:\n\
        \  Rolling     - Apply upgrade to each node one at a time (Default)\n  Non-rolling\
        \ - Apply upgrade to all nodes at the same time, so has client downtime\n\
        \  Non-restart - Apply upgrade without restarting nodes or processes. \n \
        \               Applicable to only certain supported Upgrades and GFlags.\n"
      properties:
        upgrade_option:
          description: 'Option for an upgrade to be rolling (one node at a time) or
            non-rolling (all nodes at once, with

            downtime)

            '
          type: string
          default: Rolling
          enum:
          - Rolling
          - Non-rolling
          - Non-restart
    UniverseEditGFlags:
      title: UniverseEditGFlags
      description: 'UniverseEditGFlags


        Request payload to edit GFlags of a Universe.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/SleepAfterRestartSchema'
      - $ref: '#/components/schemas/UniverseUpgradeOptionsAll'
      - type: object
        properties:
          universe_gflags:
            description: GFlags for each cluster uuid of this universe
            type: object
            additionalProperties:
              $ref: '#/components/schemas/ClusterGFlags'
    UniverseUpgradeOptionRolling:
      title: UniverseUpgradeOptionRolling
      description: 'UniverseUpgradeOptionRolling

        Option for an upgrade to be rolling (one node at a time) or non-rolling (all
        nodes at once, with downtime)'
      properties:
        rolling_upgrade:
          description: 'Perform a rolling upgrade where only one node is upgraded
            at a time. This is the default

            behavior. False will perform a non-rolling upgrade where all nodes are
            upgraded at the same

            '
          type: boolean
          default: true
    UniverseSoftwareUpgradeStart:
      title: UniverseSoftwareUpgradeStart
      description: 'UniverseSoftwareUpgradeStart


        Payload to start a YugabyteDB software upgrade on a Universe. Part of UniverseSoftwareUpgradeReq

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/SleepAfterRestartSchema'
      - $ref: '#/components/schemas/UniverseUpgradeOptionRolling'
      - type: object
        required:
        - version
        properties:
          allow_rollback:
            description: perform an upgrade where rollback is allowed
            type: boolean
            default: true
          upgrade_system_catalog:
            description: Upgrade the YugabyteDB Catalog
            type: boolean
            default: true
          version:
            description: The target release version to upgrade to.
            type: string
    UniverseSoftwareFinalizeImpactedXCluster:
      title: ImpactedXClusterInfo
      description: 'ImpactedXClusterInfo


        XCluster info that are impacted by software upgrade. Part of SoftwareUpgradesFinalize
        schema.

        '
      type: object
      required:
      - universe_uuid
      - universe_name
      - universe_version
      properties:
        universe_uuid:
          description: UUID of the Universe
          type: string
          format: uuid
        universe_name:
          description: Name of the Universe
          type: string
        universe_version:
          description: Version of the Universe
          type: string
    UniverseSoftwareUpgradeFinalizeInfo:
      title: SoftwareUpgradeFinalizeInfo
      description: 'SoftwareUpgradesFinalizeInfo


        The list of connected xclusters that will be impacted by finalizing the software
        upgrade. Part of

        SoftwareUpgradeFinalizeResponse.

        '
      type: object
      properties:
        impacted_xclusters:
          description: List of XCluster info that are impacted by software upgrade
          type: array
          items:
            $ref: '#/components/schemas/UniverseSoftwareFinalizeImpactedXCluster'
    UniverseSoftwareUpgradeFinalize:
      title: UniverseSoftwareUpgradeFinalize
      description: 'UniverseSoftwareUpgradeFinalize


        Payload to finalize a YugabyteDB software upgrade on a Universe

        '
      type: object
      properties: {}
    UniverseThirdPartySoftwareUpgradeStart:
      title: UniverseThirdPartyUpgradeStart
      description: "UniverseThirdPartyUpgradeStart\n\nPayload to start a third party\
        \ software upgrade on a Universe. Part of \nUniverseThirdPartyUpgradeReq\n"
      allOf:
      - $ref: '#/components/schemas/SleepAfterRestartSchema'
      - type: object
        properties:
          force_all:
            description: force all thirdparty softwares to be upgraded.
            type: boolean
            default: false
    NodeAgentUpgradeSpec:
      title: NodeAgentUpgradeSpec
      description: 'NodeAgentUpgradeSpec


        Request payload to upgrade node agents in a universe. Part of NodeAgentUpgradeReq.

        If node_names is omitted or empty, all live nodes in the universe are upgraded.

        '
      type: object
      properties:
        certificate_name:
          description: 'Optional name (label) of the YBA certificate config to use
            for the node agent upgrade.

            If omitted, existing certificates are used.

            '
          type: string
          example: my-custom-ca
        node_names:
          description: 'Optional list of node names whose node agents should be upgraded.

            If omitted or empty, all live nodes in the universe are upgraded.

            '
          type: array
          items:
            type: string
          example:
          - yb-15-universe-n1
          - yb-15-universe-n2
        certs_only:
          description: 'If true, replace node agent certificates without upgrading
            the package when

            the node agent version already matches YBA. If the version does not match,

            a full upgrade is performed so RPC stays compatible.

            '
          type: boolean
          default: false
    UniverseRollbackUpgradeReq:
      title: UniverseRollbackUpgrade
      description: "UniverseRollbackUpgrade\n\nPayload to rollback a YugabyteDB software\
        \ upgrade on a Universe. Part of \nUniverseRollbackUpgradeReq\n"
      type: object
      allOf:
      - $ref: '#/components/schemas/SleepAfterRestartSchema'
      - $ref: '#/components/schemas/UniverseUpgradeOptionRolling'
    UniverseSoftwareUpgradePrecheckReq:
      title: UniverseSoftwareUpgradePrecheckReq
      description: "UniverseSoftwareUpgradePrecheckReq\n\nPayload to precheck a YugabyteDB\
        \ software upgrade on a Universe. Part of \nUniverseSoftwareUpgradePrecheckReq\n"
      type: object
      required:
      - yb_software_version
      properties:
        yb_software_version:
          description: Run prechecks as if the universe would be upgraded to this
            version.
          type: string
    UniverseSoftwareUpgradePrecheckResp:
      title: UniverseSoftwareUpgradePrecheckResp
      description: "UniverseSoftwareUpgradePrecheckResp\n\nResponse to a YugabyteDB\
        \ software upgrade precheck on a Universe. Returns if a finalize is \nrequired.\
        \ Part of UniverseSoftwareUpgradePrecheckResponse.\n"
      type: object
      required:
      - finalize_required
      properties:
        finalize_required:
          description: "If the upgrade requires a finalize step. If true, the user\
            \ must call the finalize \nendpoint to complete the upgrade.\n"
          type: boolean
    UniverseRestart:
      title: UniverseRestart
      description: "UniverseRestart\n\nPayload to restart a Universe. Part of UniverseRestartReq.\
        \ This will restart all nodes in the \nuniverse or just restart the master\
        \ and tserver processes.\n"
      type: object
      allOf:
      - $ref: '#/components/schemas/SleepAfterRestartSchema'
      - type: object
        properties:
          rolling_restart:
            description: Perform a rolling restart of the universe. Otherwise, all
              nodes will be restarted at the same time.
            type: boolean
            default: true
          restart_type:
            description: "The method to reboot the node. This is not required for\
              \ kubernetes universes, as the pods \nwill get restarted no matter what.\
              \ \"HARD\" reboots are not supported today.\n\nOS: Restarts the node\
              \ via the operating system.\nSERVICE: Restart the YugabyteDB Process\
              \ only (master, tserver, etc).\n"
            type: string
            default: SERVICE
            enum:
            - OS
            - SERVICE
    UniverseSystemdEnableStart:
      title: UniverseSystemdEnableStart
      description: 'UniverseSystemdEnableStart


        Payload to move the universe to use systemd to manage the YugabyteDB services

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/SleepAfterRestartSchema'
    UniverseEditEncryptionInTransit:
      title: UniverseEditEncryptionInTransit
      description: "UniverseEditEncryptionInTransit\n\nRequest Payload to enable or\
        \ disable encryption in transit. Encryption in transit can be\ntoggled for\
        \ either node to node traffic or node to client traffic. Part of \nUniverseEncryptionInTransitReq\n"
      type: object
      allOf:
      - $ref: '#/components/schemas/SleepAfterRestartSchema'
      - $ref: '#/components/schemas/UniverseUpgradeOptionRolling'
      - type: object
        properties:
          node_to_node:
            description: Control encryption in transit between YugabyteDB nodes
            type: boolean
          client_to_node:
            description: Control encryption in transit between YugabyteDB nodes and
              clients
            type: boolean
          root_ca:
            description: Root CA cert for node to node encryption. Required if node_to_node
              is true
            type: string
            format: uuid
          client_root_ca:
            description: Root CA used for node to client encryption. Required if client_to_node
              is true
            type: string
            format: uuid
    UniverseCertRotateSpec:
      title: UniverseCertRotateSpec
      description: 'UniverseCertRotateSpec


        Request payload to rotate the certs used for encryption

        in transit. Part of UniverseCertRotateReq.

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/SleepAfterRestartSchema'
      - $ref: '#/components/schemas/UniverseUpgradeOptionRolling'
      - type: object
        properties:
          self_signed_server_cert_rotate:
            type: boolean
          self_signed_client_cert_rotate:
            type: boolean
          root_ca:
            type: string
            format: uuid
          client_root_ca:
            type: string
            format: uuid
    UniverseEditKubernetesOverrides:
      title: UniverseEditKubernetesOverrides
      description: "UniverseEditKubernetesOverrides\n\nUpdate all kubernetes overrides\
        \ on the universe. Part of UniverseKubernetesOverridesReq \n"
      type: object
      properties:
        overrides:
          description: Global kubernetes overrides to apply across the entire universe.
          type: string
          example: "tserver:\n  podLabels:\n    env: test"
        az_overrides:
          description: Granular kubernetes overrides per Availability Zone identified
            by AZ uuid.
          example: 'az_uuid: "tserver:\n  podLabels:\n    env: test"'
          additionalProperties:
            type: string
    DetachUniverseSpec:
      title: DetachUniverseSpec
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2025.2.0.0 that could change.</b></p>Request payload for detaching
        a universe.'
      type: object
      properties:
        skip_releases:
          description: Whether to skip releases during detach operation.
          type: boolean
          default: false
      x-yba-api-since: 2025.2.0.0
      x-yba-api-visibility: preview
    AttachUniverseSpec:
      title: AttachUniverseSpec
      description: '<b style="color:#FFA500">WARNING: This is a preview API in YBA
        version 2025.2.0.0 that could change.</b></p>Request payload for attaching
        a universe.'
      type: object
      properties:
        downloaded_spec_file:
          description: The uploaded tgz file containing universe metadata.
          type: string
          format: binary
          x-java-type: Http.MultipartFormData.FilePart<TemporaryFile>
      x-yba-api-since: 2025.2.0.0
      x-yba-api-visibility: preview
    UniverseQueryLogsExport:
      title: UniverseQueryLogsExport
      description: 'UniverseQueryLogsExport


        Payload to configure export of query logs. Part of

        UniverseQueryLogsExportReq

        '
      type: object
      allOf:
      - $ref: '#/components/schemas/SleepAfterRestartSchema'
      - $ref: '#/components/schemas/UniverseUpgradeOptionRolling'
      - type: object
        required:
        - install_otel_collector
        - query_log_config
        properties:
          install_otel_collector:
            description: Flag to install OpenTelemetry Collector
            type: boolean
          query_log_config:
            description: Query Log Configuration
            $ref: '#/components/schemas/QueryLogConfig'
    ConfigureMetricsExportSpec:
      title: ConfigureMetricsExportSpec
      description: 'ConfigureMetricsExportSpec


        Configuration for metrics export from a universe to telemetry providers.

        '
      type: object
      allOf:
      - type: object
        properties:
          install_otel_collector:
            description: 'Similar to DBAL request body. Optional - default false.

              Requires true if "universe_metrics_exporter_config" is not empty

              and "universeDetails.otelCollectorEnabled" is false.

              '
            type: boolean
            example: true
            default: false
          metrics_export_config:
            description: 'This root level object will be stored in the universe details
              directly, similar to auditLogConfig in DBAL.

              '
            $ref: '#/components/schemas/MetricsExportConfig'
    UniverseOperatorImportReq:
      title: UniverseOperatorImportReq
      description: 'UniverseOperatorImportReq


        Payload to import a universe to the operator. Part of UniverseOperatorImportReq

        '
      type: object
      properties:
        namespace:
          description: The namespace in which the universe custom resource will be
            created in.
          type: string
  responses:
    AuthGroupToRolesMappingResp:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AuthGroupToRolesMapping'
    YbcGflagsResp:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/GflagMetadata'
    ContinuousBackupResp:
      description: Continuous Backup Config
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContinuousBackup'
    YBATaskResp:
      description: task accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/YBATask'
    JobScheduleResp:
      description: Job schedule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobSchedule'
    JobSchedulePagedResp:
      description: Job schedules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobSchedulePagedResp'
    JobInstancePagedResp:
      description: Job instances
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobInstancePagedResp'
    UniverseResp:
      description: success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Universe'
    UniverseResourceDetailsResp:
      description: success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UniverseResourceDetails'
    UniverseSoftwareUpgradeFinalizeResp:
      description: Software Upgrade Finalize information
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UniverseSoftwareUpgradeFinalizeInfo'
    UniverseSoftwareUpgradePrecheckResponse:
      description: Software Upgrade Precheck success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UniverseSoftwareUpgradePrecheckResp'
    DetachUniverseResp:
      description: Successfully detached universe.
      content:
        application/gzip:
          schema:
            type: string
            format: binary
      x-yba-api-since: 2025.2.0.0
      x-yba-api-visibility: preview
  requestBodies:
    AuthGroupToRolesMappingReq:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AuthGroupToRolesMapping'
    ContinuousBackupCreateReq:
      required: true
      content:
