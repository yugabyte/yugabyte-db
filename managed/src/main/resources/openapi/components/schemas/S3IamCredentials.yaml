title: S3IamCredentials
description: |
  S3IamCredentials

  The IAM identity of YBA and of the database nodes, such as an instance profile or a
  Kubernetes service account role. Part of S3Credentials.
type: object
required:
  - credential_type
properties:
  credential_type:
    $ref: "./S3CredentialType.yaml"
  credential_source:
    $ref: "./S3IamCredentialSource.yaml"
  iam_user_profile:
    description: AWS profile to use with credential_source IAM_USER. Defaults to "default".
    type: string
  session_duration_secs:
    description: 'Duration of assumed-role sessions, in seconds, when the role''s maximum can''t be read (no iam:GetRole permission). Defaults to 3600.'
    type: integer
    format: int32
    maximum: 43200
    minimum: 900
  regional_sts:
    description: Whether to use the regional STS endpoint rather than the global one. Defaults to true.
    type: boolean
  sts_region:
    description: 'Region of the STS endpoint, with regional_sts'
    type: string
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
