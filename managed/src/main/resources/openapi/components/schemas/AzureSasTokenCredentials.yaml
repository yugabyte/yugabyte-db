title: AzureSasTokenCredentials
description: |
  AzureSasTokenCredentials

  A shared access signature for the backup_location container. Each region location carries the
  token of its own container. Part of AzureCredentials.
type: object
required:
  - credential_type
properties:
  credential_type:
    $ref: "./AzureCredentialType.yaml"
  sas_token:
    description: SAS token of the backup_location container. Required on create; never returned.
    type: string
    minLength: 4
    writeOnly: true
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
