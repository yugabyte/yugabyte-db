title: ClusterStorageBase
description: Storage volume properties. All fields are optional so this schema can describe partial overrides (for example per-AZ). Part of PerProcessNodeSpec.
type: object
properties:
  volume_size:
    description: The size of each volume in each instance. Could be modified in payload for /resize_node API call
    type: integer
    format: int32
  num_volumes:
    description: Number of volumes to be mounted on this instance at the default path
    type: integer
    format: int32
  mount_points:
    description: Comma-separated list of mount points for the volumes in each instance. Required for an onprem cluster.
    type: string
  storage_class:
    description: 'Name of the storage class, if this is a kubernetes cluster'
    type: string
  storage_type:
    $ref: "./ClusterStorageType.yaml"
  disk_iops:
    description: 'Desired IOPS for the volumes mounted on this aws, gcp or azu instance'
    type: integer
    format: int32
  throughput:
    description: 'Desired throughput for the volumes mounted on this aws, gcp or azu instance'
    type: integer
    format: int32
  cloud_volume_encryption:
    description: Volume encryption settings for cloud volumes (currently AWS EBS volumes only)
    $ref: "./CloudVolumeEncryption.yaml"
