title: YCQLComponentSpec
description: Spec driving the node-level YCQLComponent.
type: object
properties:
  component_name:
    description: |
      Logical component name; used as output file label.
      Must be a single file name of up to 128 characters from [A-Za-z0-9._-].
    type: string
  keyspace:
    description: Optional keyspace for ycqlsh -k.
    type: string
  queries:
    description: |
      YCQL statements to execute (each runs as ycqlsh -e).
      Support bundles are read-only, so each entry must be a single statement beginning
      with SELECT, DESCRIBE, DESC, SHOW or LIST (case-insensitive). Entries holding more
      than one statement are rejected.
    type: array
    items:
      type: string
  output_file_name:
    description: |
      Output file name written under the per-node bundle directory.
      Must be a single file name of up to 128 characters from [A-Za-z0-9._-].
    type: string
  timeout_secs:
    description: Command timeout in seconds.
    type: integer
    format: int64
