title: YSQLComponentSpec
description: Spec driving the node-level YSQLComponent.
type: object
properties:
  component_name:
    description: |
      Logical component name; used as output file label.
      Must be a single file name of up to 128 characters from [A-Za-z0-9._-].
    type: string
  db_name:
    description: Database name for ysqlsh -d.
    type: string
  queries:
    description: |
      YSQL statements to execute (each runs as ysqlsh -c).
      Support bundles are read-only, so each entry must be a single statement beginning
      with SELECT, WITH, EXPLAIN, SHOW, TABLE or VALUES (case-insensitive). Entries
      holding more than one statement are rejected, as are constructs that reach outside
      the database such as COPY ... TO PROGRAM or the pg_read_file family. The session
      additionally runs with default_transaction_read_only=on.
    type: array
    items:
      type: string
  output_file_name:
    description: |
      Output file name written under the per-node bundle directory.
      Must be a single file name of up to 128 characters from [A-Za-z0-9._-].
    type: string
  timeout_secs:
    description: Command timeout in seconds.
    type: integer
    format: int64
