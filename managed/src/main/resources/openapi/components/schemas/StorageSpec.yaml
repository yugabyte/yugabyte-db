  - $ref: "./GcsStorageSpec.yaml"
  - $ref: "./AzureStorageSpec.yaml"
  - $ref: "./NfsStorageSpec.yaml"
  - $ref: "./OciStorageSpec.yaml"
discriminator:
  propertyName: storage_type
  mapping:
    S3: ./S3StorageSpec.yaml
    GCS: ./GcsStorageSpec.yaml
    AZURE: ./AzureStorageSpec.yaml
    NFS: ./NfsStorageSpec.yaml
    OCI: ./OciStorageSpec.yaml
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
