title: RollMaxBatchSize
description: |
  RollMaxBatchSize

  Suggested number of nodes to roll at a time during a rolling operation, if available. Part of
  the UniverseRestart, UniverseResizeNodes, UniverseUpgradeOptionRolling and
  UniverseUpgradeOptionsAll request schemas, and the UniverseInfo response schema.
type: object
x-yba-api-visibility: preview
x-yba-api-since: 2026.2.0.0
properties:
  primary_batch_size:
    description: Suggested number nodes for primary cluster.
    type: number
    format: int32
    example: 1
    default: 1
  read_replica_batch_size:
    description: Suggested number nodes for readonly cluster.
    type: number
    format: int32
    example: 1
    default: 1
