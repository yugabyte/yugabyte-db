title: OciCredentialType
description: |
  OciCredentialType

  Kind of OCI credentials: the OCI IAM identity of YBA and the nodes with the native API, or a
  customer secret key with the S3-compatible API. Part of OciCredentials.
type: string
enum:
  - IAM
  - S3_COMPATIBLE
x-enum-varnames:
  - OciCredentialIam
  - OciCredentialS3Compatible
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
