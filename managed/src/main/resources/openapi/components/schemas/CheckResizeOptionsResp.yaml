title: CheckResizeOptionsResp
description: |
  Response listing available resize-related operations for the proposed node settings.
  Part of CheckResizeOptionsResponse.
type: object
required:
  - options
properties:
  options:
    description: Available operations for applying the proposed node settings.
    type: array
    items:
      $ref: "./ResizeUpdateOption.yaml"
  has_resize_changes:
    description: Whether the requested payload has resize changes.
  resize_restrictions:
    description: |
      Reasons why an in-place resize (SMART_RESIZE or SMART_RESIZE_NON_RESTART) is not available for the proposed node settings.
      Empty if there are no resize changes or no restriction was found.
    type: array
    items:
      type: string
