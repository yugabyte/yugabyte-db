title: CheckResizeOptionsResp
description: |
  Response listing available resize-related operations for the proposed node settings.
  Part of CheckResizeOptionsResponse.
type: object
required:
  - options
properties:
  options:
    description: Available operations for applying the proposed node settings.
    type: array
    items:
      $ref: "./ResizeUpdateOption.yaml"
  resize_restrictions:
    description: Reasons why an in-place resize (SMART_RESIZE or SMART_RESIZE_NON_RESTART) is not available for the proposed node settings. Empty if no restriction was found.
    type: array
    items:
      type: string
  full_move_reasons:
    description: 'Reasons why the proposed node settings require a full node replacement (FULL_MOVE), such as a changed image bundle, AWS instance profile, public IP assignment or communication ports.'
    type: array
    items:
      type: string
