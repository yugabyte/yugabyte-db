title: TaskExecutorShutdownSpec
description: |
  Parameters for shutting down the YBA task executor.
type: object
required:
  - abort_time_seconds
properties:
  abort_time_seconds:
    description: |
      Grace period in seconds before in-flight tasks are aborted.
    type: integer
    format: int64
    example: 300
    minimum: 0
x-yba-api-visibility: internal
