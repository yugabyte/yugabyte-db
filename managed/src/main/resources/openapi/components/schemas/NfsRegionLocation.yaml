title: NfsRegionLocation
description: |
  NfsRegionLocation

  Backup location of one region of an NFS storage configuration. Part of NfsStorageSpec.
type: object
required:
  - region
  - location
properties:
  region:
    description: Region of the universe whose backups go to this location
    type: string
    minLength: 1
  location:
    description: Absolute path of the region's NFS mount on the database nodes
    type: string
    minLength: 1
  bucket:
    description: Directory under location that holds the backups. Defaults to yugabyte_backup.
    type: string
    minLength: 1
  volumes:
    description: 'NFS volumes to check, in the backup prechecks, for being mounted on the region''s nodes'
    type: array
    items:
      type: string
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
