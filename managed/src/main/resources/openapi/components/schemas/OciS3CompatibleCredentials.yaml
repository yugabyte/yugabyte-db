title: OciS3CompatibleCredentials
description: |
  OciS3CompatibleCredentials

  A customer secret key, with the S3-compatible Object Storage API. Part of OciCredentials.
type: object
required:
  - credential_type
  - access_key_id
  - host_base
properties:
  credential_type:
    $ref: "./OciCredentialType.yaml"
  access_key_id:
    description: Access key of the customer secret key
    type: string
    minLength: 1
  secret_access_key:
    description: Secret of the customer secret key. Required on create; never returned.
    type: string
    minLength: 1
    writeOnly: true
  host_base:
    description: Host of the S3-compatible endpoint
    type: string
    example: example.compat.objectstorage.us-sanjose-1.oraclecloud.com
    minLength: 1
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
