title: S3Credentials
description: |
  S3Credentials

  How YBA and the database nodes authenticate to S3. credential_type selects the variant.
  Part of S3StorageSpec.
oneOf:
  - $ref: "./S3AccessKeyCredentials.yaml"
  - $ref: "./S3IamCredentials.yaml"
  - $ref: "./S3CrossCloudFederationCredentials.yaml"
discriminator:
  propertyName: credential_type
  mapping:
    ACCESS_KEY: ./S3AccessKeyCredentials.yaml
    IAM: ./S3IamCredentials.yaml
    CROSS_CLOUD_FEDERATION: ./S3CrossCloudFederationCredentials.yaml
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
