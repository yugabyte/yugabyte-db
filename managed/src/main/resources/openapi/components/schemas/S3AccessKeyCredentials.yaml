title: S3AccessKeyCredentials
description: |
  S3AccessKeyCredentials

  A static AWS (or S3-compatible) access key. Part of S3Credentials.
type: object
required:
  - credential_type
properties:
  credential_type:
    $ref: "./S3CredentialType.yaml"
  access_key_id:
    description: Access key ID. Required on create; never returned.
    type: string
    minLength: 1
    writeOnly: true
  secret_access_key:
    description: Secret access key. Required on create; never returned.
    type: string
    minLength: 1
    writeOnly: true
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
