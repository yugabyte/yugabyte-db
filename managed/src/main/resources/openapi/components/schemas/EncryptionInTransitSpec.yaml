title: EncryptionInTransitSpec
description: Specification of node-to-node and client-to-node TLS encryption. Part of UniverseSpec.
type: object
properties:
  enable_node_to_node_encrypt:
    description: Whether to enable encryption for communication among DB nodes
    type: boolean
    example: false
  enable_client_to_node_encrypt:
    description: Whether to enable encryption for client connection to DB nodes
    type: boolean
    example: false
  use_node_to_node_client_certs:
    description: |
      Whether DB nodes require a client certificate on RPC (node_to_node_encryption_use_client_certificates). Supported only on Kubernetes universes whose node-to-node encryption uses a cert-manager (K8SCertManager) root CA; VM universes and Kubernetes universes with other root CA types are not supported. Can only be set at universe creation.
    type: boolean
    example: false
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
  root_and_client_root_ca_same:
    description: 'In case certificates are generated, whether to use the same certificate'
    type: boolean
    example: false
  root_ca:
    description: The UUID of the rootCA to be used to generate node certificates and facilitate TLS communication between database nodes.
    type: string
    format: uuid
    example: fce99806-03f0-4b17-9483-297ccfaa368d
  client_root_ca:
    description: The UUID of the clientRootCA to be used to generate client certificates and facilitate TLS communication between server and client. Can be set to same as root_CA.
    type: string
    format: uuid
    example: 1711b83b-af74-416b-84b9-e9f66b532c82
