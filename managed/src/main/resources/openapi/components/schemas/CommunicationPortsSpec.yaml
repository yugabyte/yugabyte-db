title: CommunicationPortsSpec
description: Communication Ports used by nodes of this Universe. Part of UniverseNetworkingSpec. Omitted ports use the platform defaults on create and are left unchanged on edit.
type: object
readOnly: false
properties:
  master_http_port:
    description: Master table HTTP port. Defaults to 7000 on create.
    type: integer
    format: int32
    example: 7000
  master_rpc_port:
    description: Master table RCP port. Defaults to 7100 on create.
    type: integer
    format: int32
    example: 7100
  node_exporter_port:
    description: Node exporter port. Defaults to 9300 on create.
    type: integer
    format: int32
    example: 9300
  otel_collector_metrics_port:
    description: Otel Collector metrics port. Defaults to 8889 on create.
    type: integer
    format: int32
    example: 8889
  redis_server_http_port:
    description: Redis HTTP port. Defaults to 11000 on create.
    type: integer
    format: int32
    example: 11000
  redis_server_rpc_port:
    description: Redis RPC port. Defaults to 6379 on create.
    type: integer
    format: int32
    example: 6379
  tserver_http_port:
    description: Tablet server HTTP port. Defaults to 9000 on create.
    type: integer
    format: int32
    example: 9000
  tserver_rpc_port:
    description: Tablet server RPC port. Defaults to 9100 on create.
    type: integer
    format: int32
    example: 9100
  yb_controller_http_port:
    description: Yb controller HTTP port. Defaults to 14000 on create.
    type: integer
    format: int32
    example: 14000
  yb_controller_rpc_port:
    description: Yb controller RPC port. Defaults to 18018 on create.
    type: integer
    format: int32
    example: 18018
  yql_server_http_port:
    description: YQL HTTP port. Defaults to 12000 on create.
    type: integer
    format: int32
    example: 12000
  yql_server_rpc_port:
    description: YQL RPC port. Defaults to 9042 on create.
    type: integer
    format: int32
    example: 9042
  ysql_server_http_port:
    description: YSQL HTTP port. Defaults to 13000 on create.
    type: integer
    format: int32
    example: 13000
  ysql_server_rpc_port:
    description: YSQL RPC port. Defaults to 5433 on create.
    type: integer
    format: int32
    example: 5433
  internal_ysql_server_rpc_port:
    description: Internal YSQL RPC port used when connection pooling is enabled. Defaults to 6433 on create.
    type: integer
    format: int32
    example: 6433
