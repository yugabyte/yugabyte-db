title: GcsCrossCloudFederationCredentials
description: |
  GcsCrossCloudFederationCredentials

  Cross-cloud federated IAM, for YBA running on AWS: YBA exchanges its AWS identity for GCP
  credentials through the workload identity federation audience configured on the universe's
  provider. YBA can't check this access when the configuration is created, since it needs a
  universe's provider. Part of GcsCredentials.
type: object
required:
  - credential_type
properties:
  credential_type:
    $ref: "./GcsCredentialType.yaml"
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
