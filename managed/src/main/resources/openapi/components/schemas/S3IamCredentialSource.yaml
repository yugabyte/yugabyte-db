title: S3IamCredentialSource
description: |
  S3IamCredentialSource

  Where YBA gets IAM credentials from. DEFAULT tries, in order, a web identity token, an IAM
  user profile, an assumed instance role and the EC2 instance profile. Part of S3IamCredentials.
type: string
default: DEFAULT
enum:
  - DEFAULT
  - IAM_USER
  - WEB_TOKEN
  - ASSUME_INSTANCE_ROLE
  - EC2_INSTANCE
x-enum-varnames:
  - S3IamSourceDefault
  - S3IamSourceIamUser
  - S3IamSourceWebToken
  - S3IamSourceAssumeInstanceRole
  - S3IamSourceEc2Instance
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
