title: AzureManagedIdentityCredentials
description: |
  AzureManagedIdentityCredentials

  The managed identity of YBA's and the database nodes' VMs. Part of AzureCredentials.
type: object
required:
  - credential_type
properties:
  credential_type:
    $ref: "./AzureCredentialType.yaml"
  client_id:
    description: Client ID of the user-assigned managed identity to use. Omit to use the system-assigned identity.
    type: string
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
