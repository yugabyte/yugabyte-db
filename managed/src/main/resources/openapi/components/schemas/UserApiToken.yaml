title: UserApiToken
description: A user's newly generated API token. Part of UserApiTokenResp.
type: object
required:
  - customer_uuid
  - user_uuid
  - api_token
  - api_token_version
properties:
  customer_uuid:
    description: UUID of the user's customer
    type: string
    format: uuid
    readOnly: true
  user_uuid:
    description: UUID of the user
    type: string
    format: uuid
    readOnly: true
  api_token:
    description: 'The new API token, to be sent in the X-AUTH-YW-API-TOKEN header'
    type: string
    readOnly: true
  api_token_version:
    description: Version of the new API token
    type: integer
    format: int64
    readOnly: true
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
