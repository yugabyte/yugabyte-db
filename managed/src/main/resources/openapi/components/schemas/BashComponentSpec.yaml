title: BashComponentSpec
description: Spec driving the node-level BashComponent.
type: object
properties:
  component_name:
    description: |
      Logical component name; used as a label/sub-directory.
      Must be a single file name of up to 128 characters from [A-Za-z0-9._-].
    type: string
  script_path:
    description: |
      Path on the YBA host to the script file to execute on the node.
      Must resolve to one of the shipped support bundle scripts, node_utils.sh or
      yba_utils.sh, under the platform devops directory. A relative path is resolved
      against that directory. Any other path is rejected.
    type: string
  params:
    description: Arguments appended after the script (entrypoint + flags).
    type: array
    items:
      type: string
  remote_tar_path:
    description: |
      Path on the node where the script writes the tar. May contain ${nodeName}.
      Must be an absolute path without '..', built only from letters, digits, '.', '_',
      '-', '/' and the ${nodeName} / ${bundleUuid} tokens.
    type: string
  linux_user:
    description: |
      Linux user to run the script as on the node.
      Only yugabyte is accepted; leave it unset to get the same result. The SystemLogs
      component is the one exception, as it needs the provider SSH user and sudo to read
      /var/log.
    type: string
  timeout_secs:
    description: Script execution timeout in seconds.
    type: integer
    format: int64
