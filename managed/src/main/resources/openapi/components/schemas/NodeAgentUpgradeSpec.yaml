title: NodeAgentUpgradeSpec
description: |
  NodeAgentUpgradeSpec

  Request payload to upgrade node agents in a universe. Part of NodeAgentUpgradeReq.
  If node_names is omitted or empty, all live nodes in the universe are upgraded.
type: object
properties:
  certificate_uuid:
    description: |
      Optional UUID of the certificate to use for the node agent upgrade.
      If omitted, existing certificates are used.
    type: string
    format: uuid
    example: fce99806-03f0-4b17-9483-297ccfaa368d
  node_names:
    description: |
      Optional list of node names whose node agents should be upgraded.
      If omitted or empty, all live nodes in the universe are upgraded.
    type: array
    items:
      type: string
    example:
      - yb-15-universe-n1
      - yb-15-universe-n2
  certs_only:
    description: |
      If true, only replace node agent certificates without upgrading the node agent package.
    type: boolean
    default: false
