title: S3CredentialType
description: |
  S3CredentialType

  Kind of S3 credentials: a static access key, the IAM identity of YBA and the nodes, or
  cross-cloud federation for database nodes on GCP. Part of S3Credentials.
type: string
enum:
  - ACCESS_KEY
  - IAM
  - CROSS_CLOUD_FEDERATION
x-enum-varnames:
  - S3CredentialAccessKey
  - S3CredentialIam
  - S3CredentialCrossCloudFederation
