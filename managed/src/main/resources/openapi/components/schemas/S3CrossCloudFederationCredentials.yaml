title: S3CrossCloudFederationCredentials
description: |
  S3CrossCloudFederationCredentials

  Cross-cloud federated IAM, for database nodes on GCP that write to S3: they exchange their
  GCP identity for AWS credentials of the role configured on the universe's provider. YBA can't
  check this access when the configuration is created, since only a node of such a universe can
  use it. Part of S3Credentials.
type: object
required:
  - credential_type
properties:
  credential_type:
    $ref: "./S3CredentialType.yaml"
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
