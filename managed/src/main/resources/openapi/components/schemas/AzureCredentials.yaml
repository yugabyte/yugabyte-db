title: AzureCredentials
description: |
  AzureCredentials

  How YBA and the database nodes authenticate to Azure Blob Storage. credential_type selects
  the variant. Part of AzureStorageSpec.
oneOf:
  - $ref: "./AzureSasTokenCredentials.yaml"
  - $ref: "./AzureManagedIdentityCredentials.yaml"
discriminator:
  propertyName: credential_type
  mapping:
    SAS_TOKEN: ./AzureSasTokenCredentials.yaml
    MANAGED_IDENTITY: ./AzureManagedIdentityCredentials.yaml
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
