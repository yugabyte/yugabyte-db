title: GcsCredentials
description: |
  GcsCredentials

  How YBA and the database nodes authenticate to GCS. credential_type selects the variant.
  Part of GcsStorageSpec.
oneOf:
  - $ref: "./GcsServiceAccountKeyCredentials.yaml"
  - $ref: "./GcsIamCredentials.yaml"
  - $ref: "./GcsCrossCloudFederationCredentials.yaml"
discriminator:
  propertyName: credential_type
  mapping:
    SERVICE_ACCOUNT_KEY: ./GcsServiceAccountKeyCredentials.yaml
    IAM: ./GcsIamCredentials.yaml
    CROSS_CLOUD_FEDERATION: ./GcsCrossCloudFederationCredentials.yaml
x-yba-api-since: 2026.2.0.0
x-yba-api-visibility: preview
