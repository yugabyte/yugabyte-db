title: ClusterNodeSpec
description: Node settings (like CPU / memory) for each node in the cluster. The node settings configured at top-level are uniform settings for both tserver and master nodes and require complete storage_spec (volume_size and num_volumes). Granular settings for tserver and master (honoured if dedicated_nodes is true or this is k8s cluster) are available for certain node properties. Granular settings can also be overridden per Availability Zone with partial storage. This is part of ClusterSpec.
type: object
allOf:
  - $ref: "./ClusterPerProcessNodeSpec.yaml"
  - properties:
      cgroup_size:
        description: 'Amount of memory in MB to limit the postgres process using the ysql cgroup. The value should be greater than 0. When set to 0 it results in no cgroup limits. For a read replica cluster, setting this value to null or -1 would inherit this value from the primary cluster. Applicable only for nodes running as Linux VMs on AWS/GCP/Azure Cloud Provider. Only used internally by YBM.'
        type: integer
        example: 1024
        x-yba-api-visibility: internal
      tserver:
        description: Instance spec for tserver nodes of cluster.
        $ref: "./ClusterPerProcessNodeSpec.yaml"
      master:
        description: Instance spec for master nodes of cluster
        $ref: "./ClusterPerProcessNodeSpec.yaml"
      dedicated_nodes:
        description: 'Deprecated: use dedicated_nodes on ClusterSpec / ClusterEditSpec / ClusterAddSpec. Whether to run tserver and master processes in dedicated nodes in this cluster.'
        type: boolean
        example: false
        deprecated: true
      k8s_master_resource_spec:
        description: Used only for a k8s Universe. Required for k8s Universe if instance_type is not specified. Sets custom cpu and memory requests/limits for master pods of a cluster.
        $ref: "./K8SNodeResourceSpec.yaml"
      k8s_tserver_resource_spec:
        description: Used only for a k8s Universe. Required for k8s Universe if instance_type is not specified. Sets custom cpu and memory requests/limits for tserver pods of a cluster.
        $ref: "./K8SNodeResourceSpec.yaml"
      az_node_spec:
        description: |
          Granular node settings overridden per Availability Zone identified by AZ uuid.
          When provided, this map fully replaces existing AZ node overrides; omit the field to
          leave them unchanged. An empty map clears all AZ node overrides.
        additionalProperties:
          $ref: "./AvailabilityZoneNodeSpec.yaml"
