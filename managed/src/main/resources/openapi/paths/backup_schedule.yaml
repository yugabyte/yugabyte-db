'/customers/{cUUID}/backup-schedules':
  parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
  post:
    operationId: createBackupSchedule
    summary: Create a backup schedule
    description: |
      Creates a backup schedule and returns the task that sets it up (resource_uuid is the new
      schedule's UUID). The request checks the spec, that the universe and the storage
      configuration exist, that the configuration is ACTIVE and that the name is free among the
      universe's schedules. It saves the schedule in state CREATING, so get and list show it at
      once. The task checks that the configuration's storage can be used, from YBA unless
      yb.backup.skip_config_based_preflight_validation is set for the universe, and from the
      universe for YB-Controller backups. It upgrades YB-Controller on the universe when it is
      older than YBA's, and for point_in_time_restore sets the history retention the backups need.
      It then makes the schedule ACTIVE. If the task fails, the schedule is removed, so the name is
      free for a retry; the failed task's error says why. If YBA restarts while the create task
      runs, the schedule is left in ERROR; delete it before creating one with the same name. A
      point-in-time-restore schedule whose task fails after changing the universe's history
      retention is left in ERROR; delete it to restore the retention. Only YSQL and YCQL schedules
      can be created; each keyspaces entry needs its keyspace. Retry with the same Idempotency-Key
      to get the task of a request whose response was lost.
    tags:
      - Backup Schedule
    requestBody:
      $ref: "../components/requestBodies/BackupScheduleCreateReq.yaml"
    responses:
      '200':
        $ref: "../components/responses/YBATaskResp.yaml"
      '400':
        description: 'Invalid input, such as an interval shorter than an hour, an invalid cron expression, an incremental interval not shorter than the full backups'' interval, a REDIS backup_type or a keyspaces entry without its keyspace'
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no backup permission on the universe'
      '404':
        description: 'The customer has no universe with universe_uuid, or no storage configuration with storage_config_uuid'
      '409':
        description: 'error.code is BACKUP_SCHEDULE_NAME_CONFLICT when the universe already has a schedule with this name, with error.backup_schedule_uuid and error.backup_schedule_state naming it, and STORAGE_CONFIG_NOT_ACTIVE when the storage configuration is being validated or deleted'
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      auditTargetType: Schedule
      auditTargetId: obj.getResourceUuid().toString()
      auditActionType: CreateBackupSchedule
      taskUuid: obj.getTaskUuid()
    x-yba-api-authz:
      - requiredPermission:
          resourceType: universe
          action: backup_restore
        resourceLocation:
          path: universe_uuid
          sourceType: request_body
    x-yba-api-idempotent: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
'/customers/{cUUID}/backup-schedules/page':
  parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
  post:
    operationId: pageListBackupSchedules
    summary: List backup schedules (paged)
    description: |
      Returns the customer's backup schedules, in every state, of all its universes. Rows are
      ordered by name (case-insensitive), then UUID.
    tags:
      - Backup Schedule
    requestBody:
      $ref: "../components/requestBodies/BackupSchedulePagedReq.yaml"
    responses:
      '200':
        $ref: "../components/responses/BackupSchedulePagedResp.yaml"
      '400':
        description: 'Invalid input, such as a limit outside 1-500'
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no read permission on the customer'
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      noAudit: true
    x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
        checkOnlyPermission: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
'/customers/{cUUID}/backup-schedules/{bsUUID}':
  parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: bsUUID
      in: path
      description: Backup schedule UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
  get:
    operationId: getBackupSchedule
    summary: Get a backup schedule
    description: |
      Returns a backup schedule: what it backs up, where, how often and for how long, with its
      state and when its next backups are due.
    tags:
      - Backup Schedule
    responses:
      '200':
        $ref: "../components/responses/BackupScheduleResp.yaml"
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no read permission on the customer'
      '404':
        description: The customer has no backup schedule with this UUID
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      noAudit: true
    x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
        checkOnlyPermission: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
  put:
    operationId: editBackupSchedule
    summary: Edit a backup schedule
    description: |
      Edits a backup schedule and returns the task that applies the edit (resource_uuid is the
      schedule's UUID). The spec replaces the stored one, but only the frequency (an interval or a
      cron expression), the incremental interval and the retention can change; every other field
      must equal the schedule's, as getBackupSchedule returns it, where an omitted option counts as
      false and an omitted min_backups_to_retain as 3. Incremental backups can't be turned on or
      off, and a retention can't be removed. A changed retention also changes the expiry of the
      schedule's completed backups. Only schedules of the CreateBackup task can be edited, not
      those of the older BackupUniverse and MultiTableBackup tasks. The schedule keeps its state;
      it is EDITING while the task runs. For point_in_time_restore the task also sets the history
      retention the new frequency needs. If the task fails, the schedule is left in ERROR. Retry
      with the same Idempotency-Key to get the task of a request whose response was lost.
    tags:
      - Backup Schedule
    requestBody:
      $ref: "../components/requestBodies/BackupScheduleEditReq.yaml"
    responses:
      '200':
        $ref: "../components/responses/YBATaskResp.yaml"
      '400':
        description: 'Invalid input, such as a change to a field other than the frequency, incremental interval and retention, turning incremental backups on or off, removing the retention, an interval shorter than an hour, an invalid cron expression, or a schedule of an older backup task'
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no update permission on the universe or the customer'
      '404':
        description: The customer has no backup schedule with this UUID
      '409':
        description: 'error.code is BACKUP_SCHEDULE_BUSY when the schedule is CREATING, EDITING or DELETING, or a task holds it (error.backup_schedule_state), and UNIVERSE_LOCKED when the schedule has point_in_time_restore and a task holds its universe (error.universe_uuid).'
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      auditTargetType: Schedule
      auditTargetId: obj.getResourceUuid().toString()
      auditActionType: EditBackupSchedule
      taskUuid: obj.getTaskUuid()
    x-yba-api-authz:
      - requiredPermission:
          resourceType: universe
          action: update
        resourceLocation:
          path: universe_uuid
          sourceType: request_body
      - requiredPermission:
          resourceType: other
          action: update
        resourceLocation:
          path: customers
          sourceType: endpoint
    x-yba-api-idempotent: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
