/customers:
  post:
    operationId: registerCustomer
    summary: Register a customer
    description: 'Creates a customer and its primary user, and returns an API token for that user. The first customer on a YBA instance can be registered without authentication, and its user becomes a SuperAdmin. Further customers can only be registered by a SuperAdmin on a multi-tenant YBA instance (yb.multiTenant), and their users are Admins.'
    tags:
      - Customer
    requestBody:
      $ref: "../components/requestBodies/CustomerRegistrationReq.yaml"
    responses:
      '200':
        $ref: "../components/responses/CustomerRegistrationResp.yaml"
      '400':
        description: 'Invalid input, such as a password that violates the password policy'
      '401':
        description: Customers already exist and the request has no valid API token
      '403':
        description: Customers already exist and the caller is not a SuperAdmin
      '409':
        description: 'A customer already exists on a single-tenant or SSO-enabled YBA instance, or a user with this email already exists'
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
    x-yba-api-audit:
      auditTargetType: Customer
      auditTargetId: obj.getCustomerUuid().toString()
      auditActionType: Register
    x-yba-api-authz:
      noAuthz: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
