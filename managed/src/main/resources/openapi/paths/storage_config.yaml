'/customers/{cUUID}/storage-configs':
  parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
  post:
    operationId: createStorageConfig
    summary: Create a storage configuration
    description: |
      Creates a backup storage configuration and returns the task that checks it. The request runs
      only the checks that need no storage: the spec, including the secrets its credentials need,
      and that the name is free. The configuration is saved in state VALIDATING, and the task
      (resource_uuid is the configuration's UUID) checks the locations and, unless
      yb.storage_config.skip_validation is set, that YBA can write, read, list and delete a test
      object at each location with the given credentials. When the check passes, the task succeeds
      and the configuration becomes ACTIVE. When it fails, YBA deletes the configuration and the
      task fails with an error message that starts with the error code:
      STORAGE_CONFIG_INVALID for a malformed location or host found without reaching the storage,
      STORAGE_VALIDATION_FAILED when YBA reached the storage, or tried to, and it refused the
      configuration, e.g. with access denied or no such bucket, and STORAGE_PROVIDER_UNAVAILABLE
      when the provider throttled or failed the check (HTTP 429 or 5xx) or a request to it timed
      out, which is worth retrying. The message goes on with the provider's HTTP status and error
      code when it answered, and the failures by field. Retry with the same Idempotency-Key to get
      the task of a request whose response was lost.
    tags:
      - Storage Config
    requestBody:
      $ref: "../components/requestBodies/StorageConfigCreateReq.yaml"
    responses:
      '200':
        $ref: "../components/responses/YBATaskResp.yaml"
      '400':
        description: 'Invalid input, such as a missing secret, a blank name, a region listed twice or a location longer than allowed. error.code is STORAGE_CONFIG_INVALID, with error.errors listing the failures by field, for a field constraint of the stored configuration.'
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no create permission on the customer'
      '409':
        description: The customer already has a storage configuration with this name. error.code is STORAGE_CONFIG_NAME_CONFLICT and error.storage_config_uuid names the existing configuration.
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      auditTargetType: CustomerConfig
      auditTargetId: obj.getResourceUuid().toString()
      auditActionType: Create
      taskUuid: obj.getTaskUuid()
    x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: create
        resourceLocation:
          path: customers
          sourceType: endpoint
    x-yba-api-idempotent: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
'/customers/{cUUID}/storage-configs/validate':
  parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
  post:
    operationId: validateStorageConfig
    summary: Validate a storage configuration
    description: |
      Checks a storage configuration without creating it, and returns the task that checks the
      storage. The request runs the same checks as createStorageConfig, including that the name is
      free. The task then checks the locations and, unless yb.storage_config.skip_validation is set,
      that YBA can write, read, list and delete a test object at each location with the given
      credentials. The task succeeds if and only if the storage check of a create would pass; when
      it fails, its error message starts with the same error codes as the createStorageConfig task.
      The task has no resource, and YBA keeps the configuration only in memory while the task runs:
      a task interrupted by a YBA restart fails.
    tags:
      - Storage Config
    requestBody:
      $ref: "../components/requestBodies/StorageConfigValidateReq.yaml"
    responses:
      '200':
        $ref: "../components/responses/YBATaskResp.yaml"
      '400':
        description: 'Invalid input, such as a missing secret, a blank name, a region listed twice or a location longer than allowed. error.code is STORAGE_CONFIG_INVALID, with error.errors listing the failures by field, for a field constraint of the stored configuration.'
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no create permission on the customer'
      '409':
        description: The customer already has a storage configuration with this name. error.code is STORAGE_CONFIG_NAME_CONFLICT and error.storage_config_uuid names the existing configuration.
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      noAudit: true
    x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: create
        resourceLocation:
          path: customers
          sourceType: endpoint
    x-yba-api-idempotent: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
'/customers/{cUUID}/storage-configs/{scUUID}':
  parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: scUUID
      in: path
      description: Storage configuration UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
  get:
    operationId: getStorageConfig
    summary: Get a storage configuration
    description: 'Returns a storage configuration, without its secrets.'
    tags:
      - Storage Config
    responses:
      '200':
        $ref: "../components/responses/StorageConfigResp.yaml"
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no read permission on the customer'
      '404':
        description: The customer has no storage configuration with this UUID
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      noAudit: true
    x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
        checkOnlyPermission: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
