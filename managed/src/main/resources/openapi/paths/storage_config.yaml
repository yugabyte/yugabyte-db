'/customers/{cUUID}/storage-configs':
  parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
  post:
    operationId: createStorageConfig
    summary: Create a storage configuration
    description: |
      Creates a backup storage configuration and returns the task that checks it. The request runs
      only the checks that need no storage: the spec, including the secrets its credentials need,
      and that the name is free. The configuration is saved in state VALIDATING, and the task
      (resource_uuid is the configuration's UUID) checks, unless yb.storage_config.skip_validation
      is set, the locations and that YBA can write, read, list and delete a test object at each
      location with the given credentials, within yb.storage_config.validation_timeout. When the
      check passes, the task succeeds and the configuration becomes ACTIVE. When it fails, YBA
      deletes the configuration and the task fails with an error message that starts with the error
      code: STORAGE_CONFIG_INVALID for a malformed location or host found without reaching the
      storage, STORAGE_VALIDATION_FAILED when YBA reached the storage, or tried to, and it refused
      the configuration, e.g. with access denied or no such bucket, and STORAGE_PROVIDER_UNAVAILABLE
      when the provider throttled or failed the check (HTTP 429 or 5xx), a request to it timed out
      or the check didn't finish in time, which is worth retrying. STORAGE_VALIDATION_BUSY means YBA
      was already running as many storage checks as it allows; retry later. The message goes on with
      the provider's HTTP status and error code when it answered, and the other failures. Retry with
      the same Idempotency-Key to get the task of a request whose response was lost.
    tags:
      - Storage Config
    requestBody:
      $ref: "../components/requestBodies/StorageConfigCreateReq.yaml"
    responses:
      '200':
        $ref: "../components/responses/YBATaskResp.yaml"
      '400':
        description: 'Invalid input, such as a missing secret, a blank name, a region listed twice or a location longer than allowed. error.code is STORAGE_CONFIG_INVALID, with error.errors listing the failures by field, for a field constraint of the stored configuration.'
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no create permission on the customer'
      '409':
        description: The customer already has a storage configuration with this name. error.code is STORAGE_CONFIG_NAME_CONFLICT and error.storage_config_uuid names the existing configuration.
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      auditTargetType: CustomerConfig
      auditTargetId: obj.getResourceUuid().toString()
      auditActionType: Create
      taskUuid: obj.getTaskUuid()
    x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: create
        resourceLocation:
          path: customers
          sourceType: endpoint
    x-yba-api-idempotent: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
'/customers/{cUUID}/storage-configs/page':
  parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
  post:
    operationId: pageListStorageConfigs
    summary: List storage configurations (paged)
    description: |
      Returns the customer's storage configurations, without their secrets, with what uses each
      one (info.usage). Rows are ordered by name (case-insensitive), then UUID.
    tags:
      - Storage Config
    requestBody:
      $ref: "../components/requestBodies/StorageConfigPagedReq.yaml"
    responses:
      '200':
        $ref: "../components/responses/StorageConfigPagedResp.yaml"
      '400':
        description: 'Invalid input, such as a limit outside 1-500'
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no read permission on the customer'
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      noAudit: true
    x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
        checkOnlyPermission: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
'/customers/{cUUID}/storage-configs/validate':
  parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
  post:
    operationId: validateStorageConfig
    summary: Validate a storage configuration
    description: |
      Checks a storage configuration without creating it, and returns the task that checks the
      storage. The request runs the same checks as createStorageConfig, including that the name is
      free. The task then checks, unless yb.storage_config.skip_validation is set, the locations and
      that YBA can write, read, list and delete a test object at each location with the given
      credentials. The task succeeds if and only if the storage check of a create would pass; when
      it fails, its error message starts with the same error codes as the createStorageConfig task.
      The task has no resource, and YBA keeps the configuration only in memory while the task runs:
      a task interrupted by a YBA restart fails.
    tags:
      - Storage Config
    requestBody:
      $ref: "../components/requestBodies/StorageConfigValidateReq.yaml"
    responses:
      '200':
        $ref: "../components/responses/YBATaskResp.yaml"
      '400':
        description: 'Invalid input, such as a missing secret, a blank name, a region listed twice or a location longer than allowed. error.code is STORAGE_CONFIG_INVALID, with error.errors listing the failures by field, for a field constraint of the stored configuration.'
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no create permission on the customer'
      '409':
        description: The customer already has a storage configuration with this name. error.code is STORAGE_CONFIG_NAME_CONFLICT and error.storage_config_uuid names the existing configuration.
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      noAudit: true
    x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: create
        resourceLocation:
          path: customers
          sourceType: endpoint
    x-yba-api-idempotent: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
'/customers/{cUUID}/storage-configs/{scUUID}':
  parameters:
    - name: cUUID
      in: path
      description: Customer UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
    - name: scUUID
      in: path
      description: Storage configuration UUID
      schema:
        type: string
        format: uuid
      explode: false
      style: simple
      required: true
  get:
    operationId: getStorageConfig
    summary: Get a storage configuration
    description: |
      Returns a storage configuration, without its secrets, with what uses it (info.usage). Early
      access: when the runtime flag yb.api.conditional_get.enabled is set, the response carries an
      ETag, to send in If-None-Match (304 Not Modified while the configuration is unchanged) or in
      the If-Match of editStorageConfig.
    tags:
      - Storage Config
    responses:
      '200':
        $ref: "../components/responses/StorageConfigResp.yaml"
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no read permission on the customer'
      '404':
        description: The customer has no storage configuration with this UUID
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      noAudit: true
    x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: read
        resourceLocation:
          path: customers
          sourceType: endpoint
        checkOnlyPermission: true
    x-yba-api-conditional-get:
      provider: com.yugabyte.yw.common.http.conditional.StorageConfigRevisionProvider
      resourcePathSegment: storage-configs
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
  put:
    operationId: editStorageConfig
    summary: Edit a storage configuration
    description: |
      Edits a storage configuration and returns the task that applies the edit (resource_uuid is
      the configuration's UUID). The spec replaces the stored one, except that a secret left out
      keeps the stored value, as long as the credential type stays the same; an Azure region's SAS
      token is kept by region. The storage type and backup location can't change. The request runs
      only the checks that need no storage, as createStorageConfig does. The configuration stays
      ACTIVE, and in use with its stored settings, while the task checks the edited one: unless
      only the name changed, or yb.storage_config.skip_validation is set, the task checks the
      locations and that YBA can write, read, list and delete a test object at each location with
      the edited credentials, within yb.storage_config.validation_timeout. When the check passes,
      the task applies the edit; when it fails, nothing changes and the task fails with the same
      error codes as the createStorageConfig task. It also fails with STORAGE_CONFIG_CHANGED when
      the configuration was changed or deleted after the request, and with
      STORAGE_CONFIG_NAME_CONFLICT when another configuration took the new name meanwhile. The
      edited configuration waits for the task in memory, as its secrets aren't stored in the task:
      a task interrupted by a YBA restart fails, and the configuration keeps its stored settings.
      Early access: when yb.api.conditional_get.enabled is set, If-Match takes the ETag of
      getStorageConfig, and a configuration changed since then is answered 412.
    tags:
      - Storage Config
    parameters:
      - name: If-Match
        in: header
        description: 'ETag of getStorageConfig: edit only if the configuration is unchanged since. Honoured only when the runtime flag yb.api.conditional_get.enabled is set.'
        schema:
          type: string
        required: false
    requestBody:
      $ref: "../components/requestBodies/StorageConfigEditReq.yaml"
    responses:
      '200':
        $ref: "../components/responses/YBATaskResp.yaml"
      '400':
        description: 'Invalid input, such as a missing secret that the stored configuration can''t provide, a changed storage type or backup location, a blank name or a region listed twice. error.code is STORAGE_CONFIG_INVALID, with error.errors listing the failures by field, for a field constraint of the stored configuration.'
      '401':
        description: 'The request has no valid API or session token, cUUID is not the caller''s customer, or the caller''s role has no update permission on the customer'
      '404':
        description: The customer has no storage configuration with this UUID
      '409':
        description: 'error.code is STORAGE_CONFIG_NAME_CONFLICT when another configuration has the new name (error.storage_config_uuid names it), STORAGE_CONFIG_NOT_ACTIVE when the configuration is still VALIDATING or QUEUED_FOR_DELETION (error.storage_config_state), and STORAGE_CONFIG_EDIT_IN_PROGRESS while the task of an earlier edit runs (error.task_uuid).'
      '412':
        description: The configuration changed since the ETag in If-Match. error.code is STORAGE_CONFIG_REVISION_MISMATCH.
      '500':
        description: Server error
    security:
      - apiKeyAuth: []
      - authTokenAuth: []
    x-yba-api-audit:
      auditTargetType: CustomerConfig
      auditTargetId: obj.getResourceUuid().toString()
      auditActionType: Update
      taskUuid: obj.getTaskUuid()
    x-yba-api-authz:
      - requiredPermission:
          resourceType: other
          action: update
        resourceLocation:
          path: customers
          sourceType: endpoint
    x-yba-api-idempotent: true
    x-yba-api-since: 2026.2.0.0
    x-yba-api-visibility: preview
