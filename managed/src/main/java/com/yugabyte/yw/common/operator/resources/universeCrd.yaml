apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ybuniverses.operator.yugabyte.io
spec:
  group: operator.yugabyte.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: >
          Custom resource definition for YugabyteDB universe.
          This CR describes the universe configuration for an instance of yugabytedb database.
          For details about YugabyteDB please refer to https://docs.yugabyte.com/
        properties:
          spec:
            type: object
            description: Schema spec for a yugabytedb universe.
            x-kubernetes-validations:
              - message: replicationFactor <= numNodes
                rule: self.replicationFactor <= self.numNodes
              - message: placementInfo cannot be removed once set.
                rule: has(self.placementInfo) || !has(oldSelf.placementInfo)
              - message: >
                  tserverVolume cannot be present if deviceInfo or masterDeviceInfo is present.
                  The new volume fields are mutually exclusive with the old deviceInfo fields.
                rule: >
                  !has(self.tserverVolume) || (!has(self.deviceInfo) && !has(self.masterDeviceInfo))
              - message: >
                  masterVolume cannot be present if deviceInfo or masterDeviceInfo is present.
                  The new volume fields are mutually exclusive with the old deviceInfo fields.
                rule: >
                  !has(self.masterVolume) || (!has(self.deviceInfo) && !has(self.masterDeviceInfo))
              - message: rootCA cannot be removed once set.
                rule: >
                  !self.enableNodeToNodeEncrypt && !self.enableClientToNodeEncrypt
                  || has(self.rootCA) || !has(oldSelf.rootCA)
              - message: rootCA cannot be set when both node-to-node and client-to-node TLS are disabled.
                rule: >
                  self.enableNodeToNodeEncrypt || self.enableClientToNodeEncrypt || !has(self.rootCA)
            properties:
              universeName:
                type: string
                description: Name of the universe object to create
                x-kubernetes-validations:
                - message: universeName cannot be changed once set.
                  rule: self == oldSelf
              numNodes:
                description: Number of tservers in the universe to create.
                type: integer
              replicationFactor:
                description: Number of times to replicate data in a universe.
                type: integer
                x-kubernetes-validations:
                - message: Replication Factor is cannot be changed
                  rule: self == oldSelf
              placementInfo:
                description: Placement information for the universe.
                type: object
                x-kubernetes-validations:
                  - message: defaultRegion cannot be removed once set.
                    rule: has(self.defaultRegion) || !has(oldSelf.defaultRegion)
                required:
                - regions
                properties:
                  defaultRegion:
                    type: string
                    description: Default region for the universe.
                    x-kubernetes-validations:
                    - message: defaultRegion cannot be changed once set.
                      rule: self == oldSelf
                  regions:
                    type: array
                    description: Regions for the universe.
                    required:
                    - code
                    - zones
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Code for the region.
                        zones:
                          type: array
                          description: Zones for the region.
                          required:
                          - code
                          - numNodes
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                                description: Code for the zone.
                              numNodes:
                                type: integer
                                description: Number of nodes for the zone.
                              preferred:
                                type: boolean
                                description: >
                                  Deprecated: use leaderPreference instead. Whether the zone
                                  is preferred for leader placement. Only honored when
                                  leaderPreference is not set; when neither is set the zone
                                  defaults to preferred (leaderPreference 1).
                              leaderPreference:
                                type: integer
                                description: >
                                  Leader affinity priority for the zone. Non-negative
                                  contiguous integers; 0 means the zone is not prioritized,
                                  and a lower positive value indicates higher leader priority.
                                  Multiple zones may share the same value. When set, this
                                  takes precedence over the deprecated preferred field.
                                minimum: 0
              gFlags:
                description: >
                  Configuration flags for the universe.
                  These can be set on masters or tservers
                type: object
                properties:
                  tserverGFlags:
                    description: >
                      Configuration flags for the tserver process in the universe.
                    type: object
                    additionalProperties:
                      type: string
                  masterGFlags:
                    description: >
                      Configuration flags for the master process in the universe.
                    type: object
                    additionalProperties:
                      type: string
                  perAZ:
                    description: >
                      Configuration flags per AZ per process in the universe.
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        tserverGFlags:
                          type: object
                          additionalProperties:
                            type: string
                        masterGFlags:
                          type: object
                          additionalProperties:
                            type: string

              enableYSQL:
                description: Enable YSQL interface in the universe.
                default: true
                type: boolean
                x-kubernetes-validations:
                - message: enableYSQL cannot be changed
                  rule: self == oldSelf
              enableNodeToNodeEncrypt:
                description: >
                  Enable node to node encryption in the universe.
                  This encrypts the data in transit between nodes.
                type: boolean
                default: true
              enableClientToNodeEncrypt:
                description: >
                  Enable client to node encryption in the universe.
                  Enable this to use tls enabled connnection between
                  client and database.
                type: boolean
                default: true
              encryptionAtRest:
                description: >
                  Encryption at rest (EAR) configuration for the universe. Omit to leave EAR off.
                  Set enabled to false to disable EAR while keeping the KMS config association so it
                  can be re-enabled later. Changing kmsConfig while enabled triggers a master key
                  rotation.
                type: object
                properties:
                  kmsConfig:
                    description: >
                      Name of the KMSConfig CR (in the same namespace) to associate with the
                      universe for encryption at rest. Only read while enabled is true: changing it
                      on a disabled universe has no immediate effect, and takes effect when EAR is
                      re-enabled. Because disabling EAR keeps the existing universe key, re-enabling
                      against a kmsConfig other than the one that key was encrypted under performs a
                      master key rotation.
                    type: string
                  enabled:
                    description: >
                      Whether encryption at rest is enabled. Defaults to true. Set to false to
                      disable EAR without removing the kmsConfig association so it can be flipped
                      back on later. Disabling and changing kmsConfig in the same edit applies the
                      disable only; the new kmsConfig is applied on re-enable.
                    type: boolean
                    default: true
                required:
                  - kmsConfig
              rootCA:
                description: >
                  Specify the name of the rootCA certificate to be used for cert-manager
                  or cert-manager certificates. If empty, YBA will create its own certificate.
                type: string
              ybSoftwareVersion:
                description: Version of DB software to use in the universe.
                type: string
              upgradeOption:
                description: >
                  Strategy to use when performing upgrade operations (software upgrade,
                  GFlags upgrade, Kubernetes overrides upgrade, certificate rotation and
                  YBC toggle). "Rolling" upgrades nodes one at a time, "Non-Rolling"
                  upgrades all nodes simultaneously with a restart, and "Non-Restart"
                  applies the change without restarting nodes. Defaults to "Rolling".
                type: string
                enum:
                - Rolling
                - Non-Rolling
                - Non-Restart
                default: Rolling
              rollMaxBatchSize:
                description: >
                  Maximum number of nodes to roll (restart) at a time during a rolling
                  upgrade. Only honored when upgradeOption is "Rolling". When unset, nodes
                  are rolled one at a time.
                type: object
                properties:
                  primaryBatchSize:
                    description: Number of nodes to roll at a time in the primary cluster.
                    type: integer
                    default: 1
                  readReplicaBatchSize:
                    description: Number of nodes to roll at a time in the read replica cluster.
                    type: integer
                    default: 1
              tserverWaitSeconds:
                description: >
                  Time in seconds to wait after restarting a TServer node before
                  proceeding to the next node during a rolling upgrade.
                type: integer
                default: 180
              masterWaitSeconds:
                description: >
                  Time in seconds to wait after restarting a Master node before
                  proceeding to the next node during a rolling upgrade.
                type: integer
                default: 180
              useYbdbInbuiltYbc:
                description: >
                  Use YBDB inbuilt YBC (immutable YBC) for the universe. When true, YBC runs from
                  the same container image as the database instead of being installed at runtime.
                type: boolean
                default: false
              proxyConfig:
                description: >
                  Proxy configuration used by universe nodes for backup and restore traffic.
                  Credentials can be included in the proxy URL, for example
                  http://username:password@proxy.example.com:3128.
                type: object
                properties:
                  httpProxy:
                    description: HTTP proxy URL.
                    type: string
                  httpsProxy:
                    description: HTTPS proxy URL.
                    type: string
                  noProxyList:
                    description: Hosts and domains that should bypass the proxy.
                    type: array
                    items:
                      type: string
              providerName:
                description: Preexisting Provider name to use in the universe.
                type: string
                x-kubernetes-validations:
                - message: providerName cannot be changed
                  rule: self == oldSelf
              zoneFilter:
                description: >
                  Filter the zones to be added by the auto-provider.
                  Only used when providerName is not specified.
                type: array
                x-kubernetes-validations:
                - message: zoneFilter cannot be changed
                  rule: self == oldSelf
                items:
                  type: string
              enableYSQLAuth:
                description: enableYSQLAuth enables authentication for YSQL inteface.
                type: boolean
                default: false
                x-kubernetes-validations:
                  - message: enableYSQL auth cannot be changed once set.
                    rule: self == oldSelf
              ysqlPassword:
                description: Used to refer to secrets if enableYSQLAuth is set.
                type: object
                x-kubernetes-validations:
                - message: ysqlPassword cannot be changed once set.
                  rule: self == oldSelf
                properties:
                  secretName:
                    type: string
                required:
                - secretName
              enableYCQL:
                description: Enable YCQL interface in the universe.
                type: boolean
                default: false
                x-kubernetes-validations:
                - message: enableYCQL cannot be changed once set.
                  rule: self == oldSelf
              enableYCQLAuth:
                description: enableYCQLAuth enables authentication for YCQL inteface.
                type: boolean
                default: false
                x-kubernetes-validations:
                - message: enableYCQLAuth cannot be changed once set.
                  rule: self == oldSelf
              ycqlPassword:
                description: Used to refer to secrets if enableYCQLAuth is set.
                type: object
                x-kubernetes-validations:
                - message:  ycqlPassword cannot be changed once set.
                  rule: self == oldSelf
                properties:
                  secretName:
                    type: string
                required:
                - secretName
              enableIPV6:
                description: Enable IPV6 in the universe.
                type: boolean
                default: false
                x-kubernetes-validations:
                - message:   enableIPV6 cannot be changed once set.
                  rule: self == oldSelf
              enableLoadBalancer:
                description: >
                  Enable LoadBalancer access to the universe.
                  Creates a service with Type:LoadBalancer
                  in the universe for tserver and masters.
                  WARNING: Enabling LoadBalancer may expose universe servers via public IPs.
                  Use with caution. To use an internal LoadBalancer, ensure you set appropriate Kubernetes overrides to avoid exposing nodes publicly.
                type: boolean
                default: false
                x-kubernetes-validations:
                - message:   enableExposingService cannot be changed once set.
                  rule: self == oldSelf
              deviceInfo:
                description: >
                  Device information for the tservers in universe to
                  refer to storage information for volume,
                  storage classes etc.
                  DEPRECATED: Use tserverVolume instead. deviceInfo and tserverVolume are mutually exclusive.
                properties:
                  volumeSize:
                    type: integer
                    default: 100
                  numVolumes:
                    type: integer
                    default: 1
                    x-kubernetes-validations:
                      - message:   numVolumes cannot be changed once set.
                        rule: self == oldSelf
                  storageClass:
                    type: string
                    x-kubernetes-validations:
                      - message: StorageClass cannot be changed once set.
                        rule: self == oldSelf
                    description: >
                      Storage class for the volumes. Only used when providerName is not specified
                      to populate storageClass of generated auto-provider.
                type: object
              masterDeviceInfo:
                description: >
                  Device information for the masters in universe to
                  refer to storage information for volume,
                  storage classes etc.
                  DEPRECATED: Use masterVolume instead. masterDeviceInfo and masterVolume are mutually exclusive.
                properties:
                  volumeSize:
                    type: integer
                    default: 50
                  numVolumes:
                    type: integer
                    default: 1
                    x-kubernetes-validations:
                      - message:   numVolumes cannot be changed once set.
                        rule: self == oldSelf
                  storageClass:
                    type: string
                    x-kubernetes-validations:
                      - message:   StorageClass cannot be changed once set.
                        rule: self == oldSelf
                    description: Storage class for the volumes. Only used when providerName is not specified.
                type: object
              tserverVolume:
                description: >
                  Volume configuration for tservers in the universe.
                  This replaces deviceInfo. deviceInfo and tserverVolume are mutually exclusive.
                type: object
                properties:
                  volumeSize:
                    type: integer
                    description: Volume size in GiB( defaults to 100 )
                    default: 100
                  numVolumes:
                    type: integer
                    description: >
                      Number of volumes per tserver( defaults to 2 ). Modifying values supported with 
                      DB software versions 2026.1.0 and above.
                    default: 2
                  storageClass:
                    type: string
                    description: >
                      Storage class for the volumes. Provider storage class takes precedence over this
                      since it is at AZ level. To use this, provider storage class values should be empty.
                      Modifying values supported with DB software versions 2026.1.0 and above.
                  perAZ:
                    description: >
                      Per availability zone volume overrides. Maps AZ codes to volume configuration.
                      This takes precedence over provider/base volume configuration.  Once this is used, the
                      provider values are no longer used for volume configuration. If some
                      AZs are not provided as overrides, the values are picked from base tserverVolume. This
                      can be set to {} to make all AZs use base tserverVolume.
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        volumeSize:
                          type: integer
                          description: Volume size in GiB for this AZ
                        numVolumes:
                          type: integer
                          description: >
                            Number of volumes per tserver for this AZ. Modifying values supported with 
                            DB software versions 2026.1.0 and above.
                        storageClass:
                          type: string
                          description: >
                            Storage class for this AZ. Modifying values supported with 
                            DB software versions 2026.1.0 and above.
                x-kubernetes-validations:
                  - message: tserverVolume cannot be removed once set.
                    rule: self != null || oldSelf == null
                  - message: perAZ in tserverVolume cannot be removed once set.
                    rule: "!has(oldSelf.perAZ) || has(self.perAZ)"
              masterVolume:
                description: >
                  Volume configuration for masters in the universe.
                  This replaces masterDeviceInfo. masterDeviceInfo and masterVolume are mutually exclusive.
                type: object
                properties:
                  volumeSize:
                    type: integer
                    description: Volume size in GiB( defaults to 50 )
                    default: 50
                  numVolumes:
                    type: integer
                    description: >
                      Number of volumes per master( defaults to 1 ). Modifying values supported with 
                      DB software versions 2026.1.0 and above.
                    default: 1
                  storageClass:
                    type: string
                    description: >
                      Storage class for the volumes. Provider storage class takes precedence over this
                      since it is at AZ level. To use this, provider storage class values should be empty.
                      Modifying values supported with DB software versions 2026.1.0 and above.
                  perAZ:
                    description: >
                      Per availability zone volume overrides. Maps AZ codes to volume configuration.
                      This takes precedence over provider/base volume configuration. Once this is used, the
                      provider values are no longer used for volume configuration. If some
                      AZs are not provided as overrides, the values are picked from base masterVolume. This 
                      can be set to {} to make all AZs use base masterVolume.
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        volumeSize:
                          type: integer
                          description: Volume size in GiB for this AZ
                        numVolumes:
                          type: integer
                          description: >
                            Number of volumes per master for this AZ. Modifying values supported with 
                            DB software versions 2026.1.0 and above.
                        storageClass:
                          type: string
                          description: >
                            Storage class for this AZ. Modifying values supported with 
                            DB software versions 2026.1.0 and above.
                x-kubernetes-validations:
                  - message: masterVolume cannot be removed once set.
                    rule: self != null || oldSelf == null
                  - message: perAZ in masterVolume cannot be removed once set.
                    rule: "!has(oldSelf.perAZ) || has(self.perAZ)"
              tserverResourceSpec:
                description: >
                  Resource specification for the tserver pods in the universe.
                type: object
                properties:
                  cpu:
                    type: number
                    description: CPU core count for the tserver pods.
                    minimum: 1
                  memory:
                    type: number
                    description: Memory in GiB for the tserver pods.
                    minimum: 1
              masterResourceSpec:
                description: >
                  Resource specification for the master pods in the universe.
                type: object
                properties:
                  cpu:
                    type: number
                    description: CPU core count for the master pods.
                    minimum: 1
                  memory:
                    type: number
                    description: Memory in GiB for the master pods.
                    minimum: 1
              paused:
                description: >
                  If the universe is paused. A paused universe will have its statefulsets scaled
                  to 0 pods. When unpaused, the statefulsets will be scaled back to their previous
                  values.
                  While Paused, all other actions on the universe will be ignored until the universe
                  is resumed.
                type: boolean
                default: false
              readReplica:
                type: object
                x-kubernetes-validations:
                  - message: placementInfo for read replica cannot be removed once set.
                    rule: has(self.placementInfo) || !has(oldSelf.placementInfo)
                  - message: deviceInfo and tserverVolume are mutually exclusive in readReplica. Only one can be provided.
                    rule: >
                      !has(self.deviceInfo) || !has(self.tserverVolume)
                required:
                - numNodes
                - replicationFactor
                properties:
                  numNodes:
                    type: integer
                  replicationFactor:
                    type: integer
                  deviceInfo:
                    description: >
                      Device information for the readReplica tservers.
                      DEPRECATED: Use tserverVolume instead. deviceInfo and tserverVolume are mutually exclusive.
                    type: object
                    required:
                    - numVolumes
                    properties:
                      volumeSize:
                        type: integer
                        default: 50
                      numVolumes:
                        type: integer
                        x-kubernetes-validations:
                          - message: numVolumes cannot be changed once set.
                            rule: "self == oldSelf"
                  tserverVolume:
                    description: >
                      Volume configuration for tservers in the read replica.
                      This replaces deviceInfo. deviceInfo and tserverVolume are mutually exclusive.
                    type: object
                    properties:
                      volumeSize:
                        type: integer
                        description: Volume size in GiB
                      numVolumes:
                        type: integer
                        description: >
                          Number of volumes per tserver. Modifying values supported with 
                          DB software versions 2026.1.0 and above.
                      storageClass:
                        type: string
                        description: >
                          Storage class for the volumes. Provider storage class takes precedence over this
                          since it is at AZ level. To use this, provider storage class values should be empty.
                          Modifying values supported with DB software versions 2026.1.0 and above.
                      perAZ:
                        description: >
                          Per availability zone volume overrides. Maps AZ codes to volume configuration.
                          This takes precedence over provider/base volume configuration.  Once this is used, the
                          provider values are no longer used for volume configuration. If some
                          AZs are not provided as overrides, the values are picked from base tserverVolume. This 
                          can be set to {} to make all AZs use base tserverVolume.
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            volumeSize:
                              type: integer
                              description: Volume size in GiB for this AZ
                            numVolumes:
                              type: integer
                              description: >
                                Number of volumes per tserver for this AZ. Modifying values supported with 
                                DB software versions 2026.1.0 and above.
                            storageClass:
                              type: string
                              description: >
                                Storage class for this AZ. Modifying values supported with 
                                DB software versions 2026.1.0 and above.
                    x-kubernetes-validations:
                      - message: tserverVolume cannot be removed once set.
                        rule: self != null || oldSelf == null
                      - message: perAZ in readReplica tserverVolume cannot be removed once set.
                        rule: "!has(oldSelf.perAZ) || has(self.perAZ)"
                  tserverResourceSpec:
                    description: >
                      Resource specification for the tserver pods in the universe.
                    type: object
                    properties:
                      cpu:
                        type: number
                        description: CPU core count for the tserver pods.
                        minimum: 1
                      memory:
                        type: number
                        description: Memory in GiB for the tserver pods.
                        minimum: 1
                  placementInfo:
                    description: Placement information for the universe.
                    type: object
                    required:
                    - regions
                    properties:
                      regions:
                        type: array
                        description: Regions for the universe.
                        required:
                        - code
                        - zones
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              description: Code for the region.
                            zones:
                              type: array
                              description: Zones for the region.
                              required:
                              - code
                              - numNodes
                              items:
                                type: object
                                properties:
                                  code:
                                    type: string
                                    description: Code for the zone.
                                  numNodes:
                                    type: integer
                                    description: Number of nodes for the zone.
              ybcThrottleParameters:
                description: >
                  YBC throttle parameters for the universe. These throttle parameters can be used to
                  control speed and resource usage of taking and restoring backups.
                type: object
                properties:
                  maxConcurrentUploads:
                    description: Number of parallel uploads per node. Used during backup.
                    type: integer
                  perUploadNumObjects:
                    description: Number of buffers per upload per node. Used during backup.
                    type: integer
                  maxConcurrentDownloads:
                    description: Number of parallel downloads per node. Used during restore.
                    type: integer
                  perDownloadNumObjects:
                    description: Number of buffers per download per node. Used during restore.
                    type: integer
                  diskReadBytesPerSec:
                    description: Disk read bytes per second to throttle disk usage during backups
                    type: integer
                    format: int64
                  diskWriteBytesPerSec:
                    description: Disk write bytes per second to throttle disk usage during restores
                    type: integer
                    format: int64
              telemetry:
                description: >
                  Telemetry export configuration for the universe. Each section below is one
                  export type: present means that export is configured, omitted means it is
                  disabled. Omitting this block entirely, or setting it to an empty object,
                  configures no exports at all.

                  Applying a telemetry change always performs a rolling helm upgrade of the
                  master and tserver pods. 
                type: object
                properties:
                  auditLogs:
                    description: >
                      YSQL and YCQL audit log export (pgaudit and the YCQL audit logger). Omit
                      to disable. Changing this section restarts the DB processes, because the
                      settings are delivered as postgres and tserver flags read at startup.
                    type: object
                    properties:
                      ysqlAuditConfig:
                        description: >
                          pgaudit settings for YSQL audit logging. Present means YSQL audit
                          logging is on; omit the whole object to leave YSQL auditing off.
                        type: object
                        properties:
                          classes:
                            description: >
                              YSQL statement classes to audit. Omit to audit none of them
                              explicitly, which in practice logs nothing until a class is added.
                            type: array
                            items:
                              type: string
                              enum:
                                - READ
                                - WRITE
                                - FUNCTION
                                - ROLE
                                - DDL
                                - MISC
                                - MISC_SET
                          logCatalog:
                            description: >
                              Log statements that touch only postgres catalog relations.
                            type: boolean
                            default: false
                          logClient:
                            description: >
                              Echo audit records to the client as well as to the log.
                            type: boolean
                            default: false
                          logLevel:
                            description: >
                              Postgres log level the audit records are emitted at. For NOTICE,
                              INFO and the DEBUG levels the log_min_messages flag must also be
                              lowered to that level, or the records are dropped before they
                              reach the log (log_min_messages defaults to WARNING).
                            type: string
                            enum:
                              - DEBUG1
                              - DEBUG2
                              - DEBUG3
                              - DEBUG4
                              - DEBUG5
                              - INFO
                              - NOTICE
                              - WARNING
                              - LOG
                          logParameter:
                            description: Include statement parameters in the audit record.
                            type: boolean
                            default: false
                          logParameterMaxSize:
                            description: >
                              Maximum size in bytes of a logged parameter value; longer values
                              are replaced by a placeholder.
                            type: integer
                          logRelation:
                            description: >
                              Emit a separate audit record per relation referenced by a
                              statement, rather than one record per statement.
                            type: boolean
                            default: false
                          logRows:
                            description: Include the number of rows retrieved or affected.
                            type: boolean
                            default: false
                          logStatement:
                            description: Include the statement text in the audit record.
                            type: boolean
                            default: false
                          logStatementOnce:
                            description: >
                              Log the statement text only with the first record of a statement
                              rather than repeating it on every record.
                            type: boolean
                            default: false
                          logRetentionDays:
                            description: >
                              Days to keep extracted YSQL audit log archives on the node. 0 or
                              unset disables the dedicated audit-log retention pipeline and
                              keeps the default size-based postgres log purge behavior.
                            type: integer
                            minimum: 0
                      ycqlAuditConfig:
                        description: >
                          YCQL audit logger settings. Present means YCQL audit logging is on;
                          omit the whole object to leave YCQL auditing off. Categories,
                          keyspaces and users are filtered by include lists first, then by
                          exclude lists.
                        type: object
                        properties:
                          includedCategories:
                            description: Statement categories to audit.
                            type: array
                            items:
                              type: string
                              enum:
                                - QUERY
                                - DML
                                - DDL
                                - DCL
                                - AUTH
                                - PREPARE
                                - ERROR
                                - OTHER
                          excludedCategories:
                            description: Statement categories to exclude from auditing.
                            type: array
                            items:
                              type: string
                              enum:
                                - QUERY
                                - DML
                                - DDL
                                - DCL
                                - AUTH
                                - PREPARE
                                - ERROR
                                - OTHER
                          includedKeyspaces:
                            description: Keyspaces to audit.
                            type: array
                            items:
                              type: string
                          excludedKeyspaces:
                            description: Keyspaces to exclude from auditing.
                            type: array
                            items:
                              type: string
                          includedUsers:
                            description: Users whose statements are audited.
