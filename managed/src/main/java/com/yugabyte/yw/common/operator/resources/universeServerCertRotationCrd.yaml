apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: universeservercertrotations.operator.yugabyte.io
spec:
  group: operator.yugabyte.io
  scope: Namespaced
  names:
    plural: universeservercertrotations
    singular: universeservercertrotation
    shortNames:
      - uscr
    kind: UniverseServerCertRotation
    categories:
      - all
      - yugabyte
  versions:
    - name: v1alpha1
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Universe
          type: string
          description: The universe whose server certificates are rotated
          jsonPath: .spec.universe
        - name: State
          type: string
          description: The state of the server certificate rotation
          jsonPath: .status.state
        - name: Retries
          type: integer
          description: Number of times the rotation task has been retried after a failure
          jsonPath: .status.retryCount
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >
            Custom resource definition for a YugabyteDB Anywhere universe server certificate
            rotation. Each resource represents a single imperative rotation that reissues the node
            and client (leaf) certificates under the universe's current rootCA, so listing the
            resources for a universe gives the rotation history. For cert-manager issued
            certificates, renew the Certificate resources with cert-manager first (for example
            with cmctl renew); the rotation then rolls the renewed certificates out to the nodes.
            To rotate the rootCA itself, change rootCA on the ybuniverse resource instead.
          type: object
          properties:
            status:
              description: Server certificate rotation status for the custom resource.
              type: object
              properties:
                state:
                  description: >
                    State of the rotation (e.g. Running, Retrying, Succeeded, Failed).
                  type: string
                message:
                  description: Message for the rotation (failure reason, progress, etc.).
                  type: string
                taskUUID:
                  description: >
                    Internal UUID of the task currently tracked for the rotation. A failed task is
                    retried by the ybuniverse reconciler, and this then follows the retry task.
                  type: string
                retryCount:
                  description: Number of times the rotation task has been retried after a failure.
                  type: integer
                requestedAt:
                  description: Timestamp when the rotation was requested.
                  type: string
                completedAt:
                  description: Timestamp when the rotation completed.
                  type: string
            spec:
              type: object
              description: Server certificate rotation specification.
              properties:
                universe:
                  description: >
                    Name of the universe whose server certificates are to be rotated. Refers to a
                    ybuniverse CR name in the same namespace. Immutable.
                  type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: "universe is immutable"
                upgradeOption:
                  description: >
                    Strategy used to roll the new certificates out. "Rolling" restarts nodes one
                    batch at a time, "Non-Rolling" restarts all nodes simultaneously, and
                    "Non-Restart" hot-reloads the certificates without restarting nodes. Defaults
                    to the upgradeOption of the ybuniverse resource. Rolling batch size and wait
                    times always come from the ybuniverse resource. Immutable.
                  type: string
                  enum:
                    - Rolling
                    - Non-Rolling
                    - Non-Restart
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: "upgradeOption is immutable"
              required:
                - universe
