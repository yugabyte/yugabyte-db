apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: restorejobs.operator.yugabyte.io
spec:
  group: operator.yugabyte.io
  scope: Namespaced
  names:
    plural: restorejobs
    singular: restorejob
    kind: RestoreJob
    categories:
      - all
      - yugabyte
  versions:
    - name: v1alpha1
      subresources:
        status: {}
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: Custom resource definition for YugabyteDB restore job
          properties:
            status:
              type: object
              description: Restore job status for the restore job custom resource.
              properties:
                message:
                  description: String log message from restore job controller
                  type: string
                taskUUID:
                  description: >
                    Internal UUID of the task associated with
                    the restore job resource.
                  type: string
                resourceUUID:
                  description: Internal UUID of the restore operation.
                  type: string
            spec:
              type: object
              x-kubernetes-validations:
                - rule: >
                    !((has(self.keyspace) && size(self.keyspace) > 0) &&
                      (has(self.restoreKeyspaces) && size(self.restoreKeyspaces) > 0))
                  message: >
                    spec.keyspace and spec.restoreKeyspaces cannot both be set.
                    spec.keyspace is deprecated; use spec.restoreKeyspaces.
              properties:
                actionType:
                  description: Type of action to be taken. Allowed values - RESTORE
                  type: string
                  enum:
                    - RESTORE
                universe:
                  description: >
                    Name of the universe for which restore is to be taken,
                    refers to a ybuniverse CR name.
                  type: string
                backup:
                  description: >
                    Name of the backup to be restored,
                    refers to a backup CR name.
                  type: string
                kmsConfig:
                  description: >
                    Optional. Name of the KMSConfig CR to use when restoring an
                    encryption-at-rest (EAR) backup, used to decrypt the backup's universe keys.
                    Required only when the backup is encrypted; leave unset for plaintext backups.
                  type: string
                keyspace:
                  description: >
                    DEPRECATED: Use restoreKeyspaces instead. Still supported to
                    rename the only YSQL database or YCQL keyspace of a
                    single-keyspace backup; rejected for a multi-keyspace backup.
                    Mutually exclusive with restoreKeyspaces.
                  type: string
                restoreKeyspaces:
                  description: >
                    YSQL databases or YCQL keyspaces to restore from the backup.
                    If empty, every keyspace is restored as its original name.
                    When set, only listed keyspaces are restored. If newName is
                    provided for a keyspace, it is restored with that name. If
                    newName is empty, the original name is used.
                  type: array
                  # Bounds keep the pairwise uniqueness rule under the API server's
                  # CEL cost budget; without them the CRD is rejected on apply.
                  maxItems: 256
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        description: Name of the keyspace in the backup.
                        type: string
                        minLength: 1
                        maxLength: 63
                      newName:
                        description: >
                          Optional destination name. Omit to restore under the
                          original name.
                        type: string
                        minLength: 1
                        maxLength: 63
                  x-kubernetes-validations:
                    - rule: >
                        self.all(a, self.all(b, a.name == b.name ||
                          (has(a.newName) ? a.newName : a.name) !=
                          (has(b.newName) ? b.newName : b.name)))
                      message: restoreKeyspaces destination names must be unique
                useTablespaces:
                  description: Restore tablespace information from the backup.
                  type: boolean
                  default: false
                useRoles:
                  description: Restore global YSQL roles from the backup.
                  type: boolean
                  default: false
                usePrivileges:
                  description: >
                    Restore privileges for roles.
                    If false, --no-privileges will be added to the restore command.
                  type: boolean
                  default: true
