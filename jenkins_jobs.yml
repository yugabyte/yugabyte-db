# This file determines the jobs that we run in this branch on Jenkins.
# Default architecture is x86_64
#
# when selectors:
#   change - run by default for DB changes
#   full - run for full official build
#

jobs:
  - os: alma8
    compiler: clang17
    build_type: asan
    release_artifact: false
    when:
     - change
     - full

  - os: alma8
    compiler: clang17
    build_type: tsan
    release_artifact: false
    when:
     - full

  - os: alma8
    compiler: gcc11
    build_type: fastdebug
    test_opts: YB_TEST_YB_CONTROLLER=0
    release_artifact: false
    when:
     - change
     - full

  - os: alma8
    compiler: clang17
    build_type: release
    build_opts: YB_LINKING_TYPE=full-lto
    release_artifact: true
    when:
     - change
     - full

  - os: alma8
    compiler: clang17
    build_type: release
    architecture: aarch64
    release_artifact: true
    when:
     - full

  - os: mac14
    compiler: clang
    build_type: release
    architecture: arm64
    test_opts: YB_TEST_YB_CONTROLLER=0
    release_artifact: true
    when:
     - full

  - os: mac14
    compiler: clang
    build_type: release
    architecture: x86_64
    test_opts: YB_COMPILE_ONLY=1
    release_artifact: true
    when:
     - full

  - os: ubuntu22.04
    compiler: clang17
    build_type: debug
    release_artifact: false
    test_opts: YB_COMPILE_ONLY=1
    when:
     - full
